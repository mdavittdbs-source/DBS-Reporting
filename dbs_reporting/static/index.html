    // Keep the list scrolling while the pointer sits near its top or bottom edge.
    const edgeScroll = () => {
      const r = scroller.getBoundingClientRect();
      const speed = y < r.top + 60 ? -(r.top + 60 - y) / 4 : y > r.bottom - 60 ? (y - (r.bottom - 60)) / 4 : 0;
      if (speed) { scroller.scrollTop += speed; if (!raf) raf = requestAnimationFrame(place); }
      scrollRaf = requestAnimationFrame(edgeScroll);
    };
    scrollRaf = requestAnimationFrame(edgeScroll);
    const refreshEmpty = () => {
      for (const c of todoBox.querySelectorAll(".todo-group"))
        c.classList.toggle("empty", ![...c.querySelector(".todo-rows").children].some((r) => r !== row));
    };

    const move = (ev) => { if (ev.pointerId !== e.pointerId) return; y = ev.clientY; if (!raf) raf = requestAnimationFrame(place); };
    const end = (ev) => {
      if (ev.pointerId !== e.pointerId) return;
      removeEventListener("pointermove", move); removeEventListener("pointerup", end); removeEventListener("pointercancel", end);
      cancelAnimationFrame(raf); cancelAnimationFrame(scrollRaf);
      const from = row.getBoundingClientRect();
      drop.replaceWith(row);
      row.classList.remove("dragging");
      document.body.classList.remove("dragging-todo");
      row.removeAttribute("style");
      // Settle from where it was let go into its slot.
      const to = row.getBoundingClientRect();
      if (!reducedMotion() && Math.abs(from.top - to.top) > 1) {
        row.style.transform = `translateY(${from.top - to.top}px)`;
        row.style.transition = "none";
        requestAnimationFrame(() => {
          row.style.transition = "transform var(--duration-fast) var(--ease-smooth-out)";
          row.style.transform = "";
          row.addEventListener("transitionend", () => row.removeAttribute("style"), { once: true });
        });
      }
      const card = row.closest(".todo-group");
      const moved = todoById(row.dataset.id);
      if (moved && moved.priority !== card.dataset.key) announce(`Moved to ${TODO_GROUPS.find(([k]) => k === card.dataset.key)[1]}`);
      saveTodo();
      grip.focus({ preventScroll: true });
    };
    addEventListener("pointermove", move); addEventListener("pointerup", end); addEventListener("pointercancel", end);
  }

  async function makeTodo() {
    if (todoMaking) return;
    todoMaking = true;
    await flushTodo();  // your latest changes are saved first, so they carry over
    todoBox.querySelectorAll(".todo-bar .cta").forEach((b) => { b.disabled = true; });
    todoBox.querySelector(".todo-note")?.remove();
    const holder = make("div");
    holder.style.margin = "4px 0 26px";
    (todoBox.querySelector(".todo-bar") || todoBox).after(holder);
    const thinking = addThinking(holder);
    thinking.setStatus("Finding you in ConnectWise…");
    const steps = [[1500, "Pulling your open tickets…"], [3500, "Checking your calendar…"], [6500, "Putting it in order…"]]
      .map(([ms, text]) => setTimeout(() => thinking.setStatus(text), ms));
    let problem = null;
    try {
      todoState = await api("/api/todo", { method: "POST" });
    } catch (err) {
      problem = "Couldn't make your list: " + err.message;
    } finally {
      steps.forEach(clearTimeout);
      thinking.stop();
      todoMaking = false;
    }
    if (inTodo()) drawTodo(problem); else if (problem) toast(problem);
    else toast("Your to-do list is ready");
  }

  todoTab.onclick = showTodo;

  // ---------- Notes ----------
  // Anyone can jot notes here (meetings, calls, site visits). Each note saves as you type. "Clean up" has David
  // tidy it under short headings, keeping every fact, and pull out the action items for To Do; Undo puts
  // back what you wrote. Notes are private.
  const notesTab = $("notes-tab"), notesBox = $("notes-inner");
  const SPARKLE = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5 9.2 6.8 13.5 8 9.2 9.2 8 13.5 6.8 9.2 2.5 8 6.8 6.8 8 2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  let notesList = null;      // [{id, title, label, preview, cleaned_at, updated_at}], newest first
  let note = null;           // the open note, in full
  let noteEditing = false;   // a cleaned-up note shows formatted until you click Edit
  let noteTimer = null, noteSaving = Promise.resolve(), noteCleaning = false, noteRevealing = false;
  const newNoteId = () => "n-" + Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => b.toString(16).padStart(2, "0")).join("");
  const noteDay = (iso) => {
    const d = new Date(iso), days = Math.round((dayStart(new Date()) - dayStart(d)) / 864e5);
    if (days === 0) return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    if (days === 1) return "Yesterday";
    return d.toLocaleDateString("en-US", days < 7 ? { weekday: "short" } : { month: "numeric", day: "numeric" });
  };
  function pillButton(label, icon, onclick, ghost = false) {
    const b = make("button", "pill-btn" + (ghost ? " ghost" : ""));
    b.type = "button";
    b.innerHTML = icon || "";
    b.append(make("span", null, label));
    b.onclick = onclick;
    return b;
  }

  function inNotes() { return document.body.classList.contains("notes-view"); }
  function showNotes() {
    leaveTodo();
    document.body.classList.add("notes-view");
    revealView($("notes"));
    notesTab.setAttribute("aria-current", "page");
    chatTitle.textContent = "";
    chatList.querySelectorAll("li.chat.active").forEach((li) => li.classList.remove("active"));
    if (location.hash !== "#notes") history.replaceState(null, "", "#notes");
    closeDrawer();
    notesList ? drawNotes() : loadNotes();
  }
  function leaveNotes() {
    if (!inNotes()) return;
    flushNote();
    document.body.classList.remove("notes-view");
    $("notes").hidden = true;
    notesTab.removeAttribute("aria-current");
    history.replaceState(null, "", location.pathname);
  }
  async function loadNotes() {
    try {
      notesList = await api("/api/notes");
    } catch (err) {
      notesBox.replaceChildren(make("p", "todo-note", "Couldn't load your notes: " + err.message));

      if (ok) {  // a check for a moment, then the paperclip again
        button.classList.add("done");
        clearTimeout(button.doneTimer);
        button.doneTimer = setTimeout(() => button.classList.remove("done"), 1400);
      }
    }
  }

  (async () => {
    const [me, models] = await Promise.all([api("/api/me"), api("/api/models")]);
    $("me").textContent = me.display_name;
    $("me").title = me.display_name;  // the full name when a long one is cut short
    isAdmin = me.is_admin;
    if (isAdmin) {
      $("feedback-link").hidden = false;
      api("/api/feedback/recent").then(({ down_this_week: recent }) => {
        if (recent) {
          const label = `Feedback from users: ${recent} thumbs down this week`;
          $("feedback-link").title = label;
          $("feedback-link").setAttribute("aria-label", label);
        }
      }).catch(() => {});
    }
    if (me.can_upload) $("spoton-upload").hidden = false;
    firstName = me.display_name.trim().split(/\s+/)[0] || "";
    ticketUrl = me.ticket_url || "";
    $("avatar").textContent = me.display_name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
    modelInfo = models;
    for (const m of modelInfo.models) modelSelect.add(new Option(m.label, m.id));
    fitToScreen();
    narrowQuery.addEventListener("change", fitToScreen);
    updateSend();
    newChat();
    if (location.hash === "#todo") showTodo();
    if (location.hash === "#notes") showNotes();
    setupPush();
    checkReminders();
    setInterval(checkReminders, 30000);
  })();
</script>
</body>
</html>
