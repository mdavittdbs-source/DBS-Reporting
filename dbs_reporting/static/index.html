<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ask plain-English questions about client tickets and time in ConnectWise.">
<meta name="color-scheme" content="light dark">
<title>David</title>
<!--icon--><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23183e7c'/%3E%3Cpath d='M9 21V11m7 10v-6m7 6v-9' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"><!--/icon-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/theme.css">
<style>
  :root { --z-popover: 20; --z-drawer: 30; --z-toast: 40; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-size: 15px; line-height: 1.6; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: none; box-shadow: var(--ring); border-radius: 8px; }

  .skip { position: absolute; left: 12px; top: -48px; z-index: var(--z-toast);
          background: var(--cta); color: var(--cta-ink); padding: 8px 14px; border-radius: 999px;
          text-decoration: none; font-weight: 500; transition: top .2s var(--ease); }
  .skip:focus { top: 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { position: relative; z-index: 1; display: grid; grid-template-columns: 292px minmax(0, 1fr);
         height: 100dvh; overflow: hidden; }

  /* ---------- Sidebar: a floating, mostly solid panel ---------- */
  aside { margin: 14px 0 14px 14px; border-radius: 28px; background: var(--panel); border: 1px solid var(--glass-ring);
          box-shadow: var(--core-hi), var(--ambient); display: flex; flex-direction: column; min-height: 0;
          position: relative; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 16px; }
  .brand-mark { width: 28px; height: 28px; border-radius: 9px; background: #183e7c;
                display: grid; place-items: center; flex-shrink: 0; }
  .brand-mark svg { width: 16px; height: 16px; }
  .brand-mark.has-logo { background: none; width: auto; height: auto; border-radius: 0; }
  .brand-mark img { display: block; height: 30px; width: auto; max-width: 132px; object-fit: contain; }
  .brand-name { font-weight: 600; letter-spacing: -.02em; line-height: 1.2; font-size: 16px; min-width: 0; }
  .brand-name small { display: block; font-size: 9.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
                      color: var(--faint); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #new { margin: 0 14px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
         padding: 6px 6px 6px 18px; border-radius: 999px; border: 0; background: var(--cta); color: var(--cta-ink);
         font-weight: 500; transition: transform .5s var(--spring), opacity .2s; }
  #new:hover { opacity: .92; }
  #new:active { transform: scale(.98); }

  #chats { list-style: none; margin: 0; padding: 4px 10px 12px; overflow-y: auto; flex: 1; }
  #chats .group { font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--faint);
                  padding: 16px 12px 6px; }
  #chats .group:first-child { padding-top: 4px; }
  #chats li.chat { position: relative; display: flex; align-items: center; border-radius: 14px; margin: 1px 0;
                   transition: background .2s var(--ease); }
  #chats li.chat:hover { background: var(--hover); }
  #chats li.chat.active { background: var(--pill); box-shadow: inset 0 0 0 1px var(--hair); }
  #chats button.open { flex: 1; min-width: 0; text-align: left; background: none; border: 0;
                       padding: 8px 4px 8px 12px; border-radius: 14px; }
  #chats .title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                  font-size: 13.5px; color: var(--muted); }
  #chats li.active .title { color: var(--text); font-weight: 500; }
  #chats button.menu { background: none; border: 0; color: var(--muted); padding: 4px 8px; margin-right: 4px;
                       border-radius: 999px; opacity: 0; transition: opacity .15s, background .15s; line-height: 1; }
  #chats li.chat:hover button.menu, #chats li.chat.active button.menu,
  #chats button.menu:focus-visible, #chats button.menu[aria-expanded="true"] { opacity: 1; }
  #chats button.menu:hover { background: var(--hover); color: var(--text); }
  #chats input.rename { flex: 1; min-width: 0; margin: 3px 6px; padding: 5px 10px; font-size: 13.5px;
                        border: 1px solid var(--glass-ring); border-radius: 10px; background: var(--core); }
  #chats input.rename:focus { outline: none; box-shadow: var(--ring); }
  .popover { position: absolute; right: 6px; top: calc(100% - 2px); z-index: var(--z-popover);
             background: var(--core); border: 1px solid var(--glass-ring); border-radius: 16px;
             box-shadow: var(--ambient); padding: 5px; min-width: 176px; animation: pop .2s var(--spring); }
  .popover p { margin: 6px 10px 8px; font-size: 13px; color: var(--muted); }
  .popover button { display: block; width: 100%; text-align: left; background: none; border: 0;
                    padding: 8px 12px; border-radius: 11px; font-size: 13.5px; }
  .popover button:hover { background: var(--hover); }
  .popover button.danger { color: var(--danger); }
  .popover button.danger:hover { background: var(--danger-soft); }
  .popover .row { display: flex; gap: 4px; }
  .popover .row button { text-align: center; }
  .empty-list { color: var(--faint); font-size: 13px; padding: 10px 12px; line-height: 1.5; }

  .appearance { border-top: 1px solid var(--hair); margin: 0 10px; padding: 12px 6px 2px; display: flex; align-items: center;
                justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); }
  .theme-switch { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--pill);
                  box-shadow: inset 0 0 0 1px var(--hair); }
  .theme-switch button { width: 32px; height: 26px; border: 0; border-radius: 999px; background: none; color: var(--faint);
                         display: grid; place-items: center; transition: background .2s, color .2s; }
  .theme-switch button:hover { color: var(--text); }
  .theme-switch button[aria-checked="true"] { background: var(--core); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
  .theme-switch svg { width: 15px; height: 15px; }
  .me { margin: 0 10px; padding: 12px 6px 14px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 30px; height: 30px; border-radius: 999px; background: var(--pill); color: var(--text);
            box-shadow: inset 0 0 0 1px var(--hair); display: grid; place-items: center; font-size: 11.5px;
            font-weight: 600; flex-shrink: 0; }
  #me { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #logout { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 5px 10px; border-radius: 999px; }
  #logout:hover { color: var(--text); background: var(--hover); }

  /* ---------- Main ---------- */
  main { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  /* The chat title floats as a small glass pill */
  /* The chat title: plain text at the top of the chat area */
  header { display: flex; align-items: center; gap: 10px; padding: 20px 28px 4px; min-height: 0; }
  #chat-title { min-width: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em; color: var(--text);
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toggle { display: none; background: none; border: 0; border-radius: 999px; padding: 4px; margin-left: -8px; line-height: 0; }
  #toggle svg { width: 18px; height: 18px; }

  #log { flex: 1; overflow-y: auto; padding: 28px 24px 16px; scroll-behavior: smooth;
         -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 24px), transparent);
                 mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 24px), transparent); }
  .inner { max-width: 840px; margin: 0 auto; }
  #messages { display: flex; flex-direction: column; gap: 34px; }

  /* Start screen: headline and an uneven grid of example questions */
  .start { padding: min(4vh, 32px) 0 24px; }
  .start > .eyebrow { margin-bottom: 18px; }
  .start h2 { font-size: clamp(36px, 4.4vw, 56px); font-weight: 600; letter-spacing: -.05em; line-height: 1.02;
              margin: 0 0 16px; text-wrap: balance; color: var(--text);
              background: linear-gradient(180deg, var(--text) 30%, var(--muted)); -webkit-background-clip: text;
              background-clip: text; -webkit-text-fill-color: transparent; }
  .start p { margin: 0 0 28px; font-size: 16px; color: var(--muted); max-width: 44ch; text-wrap: pretty; }
  .suggestions { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; }
  .suggestions button.shell { display: block; text-align: left; color: inherit;
    transition: transform .7s var(--spring); animation: rise-in .9s var(--spring) both; animation-delay: calc(var(--i) * 110ms); }
  .suggestions button.shell:hover { transform: translateY(-2px); }
  .suggestions button.shell:active { transform: scale(.99); }
  .suggestions button.shell:first-child { grid-row: span 2; }
  .suggestions .core { position: relative; overflow: hidden; height: 100%; padding: 20px;
                       display: flex; flex-direction: column; gap: 14px; }
  .suggestions .shell:first-child .core { min-height: 252px; justify-content: space-between; }
  .suggestions .shell:first-child .core::before { content: ""; position: absolute; width: 340px; height: 340px;
    right: -110px; top: -140px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, var(--orb-a), transparent); }
  .suggestions .q { position: relative; font-size: 15px; font-weight: 500; line-height: 1.45; letter-spacing: -.01em; }
  .suggestions .shell:first-child .q { font-size: 25px; font-weight: 600; letter-spacing: -.035em; line-height: 1.12; max-width: 17ch; }
  .cta { position: relative; display: inline-flex; align-items: center; gap: 12px; align-self: flex-start;
         border-radius: 999px; padding: 5px 5px 5px 16px; font-size: 13px; font-weight: 500;
         background: var(--cta); color: var(--cta-ink); }
  .cta .ico { width: 26px; height: 26px; }
  .cta.ghost { background: var(--pill); color: var(--text); }
  .cta.ghost .ico { background: var(--pill); }

  /* Messages */
  .msg { animation: rise .35s var(--spring); }
  .msg.user { align-self: flex-end; max-width: 82%; background: var(--glass); border: 1px solid var(--glass-ring);
              padding: 11px 18px; border-radius: 22px 22px 8px 22px; white-space: pre-wrap; }
  .msg.bot { align-self: stretch; min-width: 0; }
  .byline { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .byline .mark { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; overflow: hidden;
                  background: var(--pill); box-shadow: inset 0 0 0 1px var(--hair); flex-shrink: 0; }
  .byline .mark .brand-mark { width: 20px; height: 20px; border-radius: 6px; }
  .byline .mark .brand-mark svg { width: 12px; height: 12px; }
  .byline .mark img { height: 20px; max-width: 20px; }
  .answer { overflow-x: auto; line-height: 1.7; font-size: 15.5px; }
  .answer > :first-child { margin-top: 0; }
  .answer > :last-child { margin-bottom: 0; }
  .answer > p:first-child { font-size: 22px; font-weight: 600; letter-spacing: -.03em; line-height: 1.32; }
  .answer > p:first-child strong { font-weight: 600; }
  .answer h1, .answer h2, .answer h3 { font-size: 17px; font-weight: 600; letter-spacing: -.02em; margin: 1.4em 0 .5em; }
  .answer strong { font-weight: 600; }
  .answer ul, .answer ol { padding-left: 1.3em; }
  .answer li { margin: .3em 0; }
  .answer li::marker { color: var(--faint); }
  .answer code { font-family: var(--mono); font-size: .88em; background: var(--pill); padding: 2px 6px; border-radius: 6px; }
  .answer a { color: var(--tag-ink); }
  /* Tables sit on one pane that scrolls sideways itself when a table is too wide, so the pane always
     covers the whole table. Text wraps, but no column gets narrower than a few words. */
  .answer .bezel { display: inline-block; max-width: 100%; margin: 10px 0 14px; vertical-align: top; }
  .answer .bezel > .core { padding: 4px; border-radius: 22px; max-width: 100%; overflow-x: auto; }
  .answer table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .answer th { text-align: left; font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
               color: var(--faint); border-bottom: 1px solid var(--hair); padding: 12px 18px; }
  .answer td { border-bottom: 1px solid var(--hair); padding: 11px 18px; vertical-align: top; }
  .answer tr:last-child td { border-bottom: 0; }
  .answer th, .answer td { min-width: 6.5em; }
  .answer :is(th, td):first-child { min-width: 9em; }
  .answer :is(th, td).num { text-align: right; white-space: nowrap; min-width: 0; }
  .answer :is(th, td):not(.num) { text-align: left; }
  .answer :is(th, td).short { white-space: nowrap; min-width: 0; }
  .answer :is(th, td).long { min-width: 16em; }
  .ref { font-family: var(--mono); font-size: .82em; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
         background: var(--tag-bg); color: var(--tag-ink); }
  a.ref { text-decoration: none; transition: box-shadow .2s var(--ease); }
  a.ref:hover { box-shadow: inset 0 0 0 1px currentColor; }
  a.ref:focus-visible { outline: none; box-shadow: var(--ring); }

  .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .actions button { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px;
                    background: var(--pill); box-shadow: inset 0 0 0 1px var(--hair); color: var(--muted);
                    font-size: 13px; padding: 6px 12px; transition: color .15s, background .15s; }
  .actions button:hover { color: var(--text); background: var(--hover); }
  .actions svg { width: 14px; height: 14px; }
  .usage { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; padding: 4px 6px 4px 2px; cursor: help; }

  .charts { display: grid; gap: 16px; margin-top: 24px; }
  .chart-card { margin: 0; min-width: 0; }
  .chart-card > .core { padding: 22px 24px 14px; }
  .chart-card h4 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.025em; text-wrap: balance; }
  .chart-card .chart-sub { margin: 6px 0 0; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
  .chart-box { position: relative; margin-top: 12px; }
  .chart-tools { display: flex; gap: 6px; margin-top: 8px; }
  .chart-tools button { background: var(--pill); border: 0; color: var(--muted); font-size: 12px; padding: 5px 12px;
                        border-radius: 999px; }
  .chart-tools button:hover { color: var(--text); background: var(--hover); }
  .chart-table { width: 100%; margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; border-collapse: collapse; }
  .chart-table th { text-align: left; font-weight: 500; color: var(--faint); border-bottom: 1px solid var(--hair); padding: 6px 12px 6px 0; }
  .chart-table td { border-bottom: 1px solid var(--hair); padding: 6px 12px 6px 0; }
  .chart-table td:not(:first-child), .chart-table th:not(:first-child) { text-align: right; }

  .thinking { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--tag-ink); opacity: .3;
            animation: pulse 1.2s infinite var(--ease); }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  .answer.streaming > :is(p, h1, h2, h3, h4):last-child::after,
  .answer.streaming > :is(ul, ol):last-child > li:last-child::after, .answer.streaming:empty::after {
    content: ""; display: inline-block; width: .5em; height: 1.05em; margin-left: 2px; vertical-align: -.15em;
    background: var(--tag-ink); border-radius: 2px; animation: blink 1s steps(2, start) infinite; }
  .elapsed { font-family: var(--mono); font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .msg.error { background: var(--danger-soft); color: var(--danger); padding: 12px 18px; border-radius: 18px; }
  .msg.error button { margin-top: 8px; background: none; border: 1px solid currentColor; color: inherit;
                      border-radius: 999px; padding: 4px 12px; font-size: 13px; }

  /* Question box: a framed island with the model picker and an Ask pill */
  #form { padding: 8px 24px 18px; }
  .composer { border-radius: 24px;
              box-shadow: var(--ambient); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
              transition: box-shadow .2s, border-color .2s; }
  .composer:focus-within { box-shadow: var(--ambient), var(--ring); }
  .composer > .core { display: flex; align-items: flex-end; gap: 10px; padding: 6px 6px 6px 20px; border-radius: 24px; }
  #q { flex: 1; min-width: 0; resize: none; border: 0; background: none; padding: 9px 0; max-height: 200px;
       line-height: 1.5; outline: none; }
  #q:focus-visible { box-shadow: none; }
  #q::placeholder { color: var(--faint); }
  .model-wrap { position: relative; flex-shrink: 0; height: 40px; display: flex; align-items: center; }
  .model-wrap[hidden] { display: none; }
  #model { appearance: none; height: 40px; border: 0; border-radius: 999px; padding: 0 30px 0 14px;
           font-size: 12.5px; font-weight: 500; color: var(--muted); background: var(--pill);
           box-shadow: inset 0 0 0 1px var(--hair); max-width: 240px; text-overflow: ellipsis;
           transition: color .15s, background .15s; }
  #model:hover:not(:disabled), #model:focus-visible { background: var(--hover); color: var(--text); }
  #model:focus-visible { box-shadow: var(--ring); }
  #model:disabled { cursor: default; padding-right: 14px; }
  #model option { background: var(--core); color: var(--text); }
  .model-wrap:has(#model:disabled)::after { display: none; }
  .model-wrap::after { content: ""; position: absolute; right: 14px; top: 50%; width: 5px; height: 5px;
                       border: solid currentColor; color: var(--faint); border-width: 0 1.5px 1.5px 0;
                       transform: translateY(-75%) rotate(45deg); pointer-events: none; }
  #send { flex-shrink: 0; height: 40px; display: inline-flex; align-items: center; gap: 10px; border: 0;
          border-radius: 999px; padding: 0 5px 0 16px; background: var(--cta); color: var(--cta-ink);
          font-weight: 500; font-size: 13.5px; transition: transform .5s var(--spring), opacity .2s; }
  #send:active:not(:disabled) { transform: scale(.96); }
  #send:disabled { opacity: .45; cursor: default; }
  #send .ico { width: 30px; height: 30px; }
  .composer-hint { font-size: 12px; color: var(--faint); margin: 8px 6px 0; display: flex; justify-content: space-between;
                   gap: 16px; white-space: nowrap; }
  .composer-hint span:last-child { overflow: hidden; text-overflow: ellipsis; }
  kbd { font-family: var(--mono); font-size: 11px; border-radius: 6px; padding: 0 5px; background: var(--pill);
        box-shadow: inset 0 0 0 1px var(--hair); }

  #toast { position: fixed; left: 50%; bottom: 112px; z-index: var(--z-toast); transform: translate(-50%, 20px);
           background: var(--cta); color: var(--cta-ink); padding: 10px 18px; border-radius: 999px; font-size: 14px;
           box-shadow: var(--ambient); opacity: 0; pointer-events: none;
           transition: opacity .25s var(--ease), transform .4s var(--spring); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .backdrop { display: none; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise-in { from { opacity: 0; transform: translateY(40px); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes blink { to { visibility: hidden; } }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }

  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    /* The sidebar becomes a slide-out panel */
    aside { position: fixed; inset: 10px auto 10px 0; margin: 0 0 0 10px; width: min(300px, 84vw); z-index: var(--z-drawer);
            background: var(--core); transform: translateX(calc(-100% - 24px)); transition: transform .45s var(--spring); }
    body.sidebar-open aside { transform: none; }
    body.sidebar-open .backdrop { display: block; position: fixed; inset: 0; z-index: calc(var(--z-drawer) - 1);
                                  background: rgba(4, 6, 12, .5); }
    #toast { bottom: auto; top: 16px; }
    #toast.show { transform: translate(-50%, 0); }
    header { padding: 12px 14px 2px; }
    #toggle { display: inline-block; margin-left: 0; }
    #log { padding: 20px 16px 12px; }
    #form { padding: 6px 10px 10px; }
    .composer-hint { display: none; }
    .msg.user { max-width: 90%; }
    .suggestions { grid-template-columns: minmax(0, 1fr); }
    .suggestions button.shell:first-child { grid-row: auto; }
    .suggestions .shell:first-child .core { min-height: 0; gap: 18px; }
    .suggestions .shell:first-child .q { font-size: 21px; }
    #model { max-width: 124px; }
    #send { padding-left: 5px; gap: 0; }
    #send .label { display: none; }
    .answer > p:first-child { font-size: 19px; }
  }
  /* Entrance right after signing in: the sidebar slides in, then the chat settles into place. */
  @keyframes slide-in { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  @keyframes settle { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  body.entering header { animation: settle .45s var(--ease) .08s both; }
  body.entering .start { animation: settle .5s var(--ease) .16s both; }
  body.entering #form { animation: settle .5s var(--ease) .24s both; }
  @media (min-width: 761px) {  /* on phones the sidebar is a hidden drawer, so it stays put */
    body.entering aside { animation: slide-in .45s var(--ease) both; }
  }
  @view-transition { navigation: auto; }
  @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<a class="skip" href="#q">Skip to question box</a>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>
<div class="app">
  <aside aria-label="Your chats">
    <div class="brand">
      <!--brand-mark--><span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none"><path d="M3.5 12V5m4.5 7V8m4.5 4V3.5" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
      </span><!--/brand-mark-->
      <span class="brand-name">David<small>DBS ConnectWise Assistant</small></span>
    </div>
    <button id="new" type="button">
      New chat
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span>
    </button>
    <ul id="chats"></ul>
    <div class="appearance">
      <span id="theme-label">Theme</span>
      <div class="theme-switch" role="radiogroup" aria-labelledby="theme-label">
        <button type="button" role="radio" data-choice="light" aria-label="Light" title="Light">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button type="button" role="radio" data-choice="system" aria-label="Match system" title="Match system">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="3" width="12" height="8.5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 14h4M8 11.5V14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button type="button" role="radio" data-choice="dark" aria-label="Dark" title="Dark">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="me">
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <span id="me"></span>
      <button id="logout" type="button">Sign out</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main>
    <header>
      <button id="toggle" type="button" aria-label="Show chats">
        <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <span id="chat-title">New chat</span>
    </header>
    <div id="log"><div class="inner"><div id="messages" aria-live="polite"></div></div></div>
    <form id="form">
      <div class="inner">
        <div class="composer"><div class="core">
          <label for="q" class="sr-only">Your question</label>
          <textarea id="q" rows="1" placeholder="Ask about a client's tickets or time…"></textarea>
          <span class="model-wrap" id="model-wrap" hidden>
            <select id="model" aria-label="AI model"></select>
          </span>
          <button id="send" aria-label="Ask">
            <span class="label">Ask</span>
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M8 12.5v-9M4 7.5l4-4 4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
        </div></div>
        <div class="composer-hint">
          <span><kbd>Enter</kbd> to send · <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line</span>
          <span>Live ConnectWise data. Check key numbers before sharing.</span>
        </div>
      </div>
    </form>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
  // Play the entrance once, when arriving straight from the sign-in page.
  try {
    if (sessionStorage.getItem("justSignedIn")) {
      sessionStorage.removeItem("justSignedIn");
      document.body.classList.add("entering");
      setTimeout(() => document.body.classList.remove("entering"), 1200);
    }
  } catch {}
  const $ = (id) => document.getElementById(id);
  const messages = $("messages"), chatList = $("chats"), q = $("q"), send = $("send");
  const modelSelect = $("model"), chatTitle = $("chat-title");
  let conversationId = null;
  let modelInfo = { default: null, models: [] };
  let isAdmin = false;
  let firstName = "";  // for the greeting on the start screen
  let ticketUrl = "";  // opens a ticket in ConnectWise; {id} is replaced with the number
  let busy = false;
  let view = 0;  // changes whenever another chat is shown, so a finishing answer can't land in the wrong one

  const EXAMPLES = [
    ["Recurring issues", "What are the most common issues in the past 30 days at Jimmy's Grille?"],
    ["Time & effort", "How many hours did we spend on Jimmy's Grille last month, and on what?"],
    ["Backlog", "Which open tickets at Jimmy's Grille are oldest?"],
  ];
  const ARROW = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const COPY = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5" y="5" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M3 10.5V4.5A1.5 1.5 0 0 1 4.5 3h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { "Content-Type": "application/json", ...(options.headers || {}) },
    });
    if (res.status === 401) { location.href = "/login"; throw new Error("Signed out"); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || res.statusText);
    return data;
  }

  let toastTimer;
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  function renderMarkdown(el, text) {
    el.innerHTML = DOMPurify.sanitize(marked.parse(text));
    // Tables sit in a framed card; ticket numbers like #48211 become small tags.
    for (const table of el.querySelectorAll("table")) {
      const shell = document.createElement("div");
      shell.className = "bezel shell";
      const core = document.createElement("div");
      core.className = "core";
      table.replaceWith(shell);
      shell.appendChild(core);
      core.appendChild(table);
    }
    tagTicketNumbers(el);
    alignNumberColumns(el);
  }

  // Right-align columns that hold numbers (counts, hours, %, $, ticket numbers); text stays left.
  // Columns of short values (names, dates, ticket numbers) stay on one line; columns of sentences
  // keep a readable width.
  function alignNumberColumns(root) {
    const numeric = /^[-+]?[$£€]?[\d,.]+%?$|^#\d+$|^[-–—]$/;
    for (const table of root.querySelectorAll("table")) {
      const rows = [...table.rows];
      const body = rows.filter((r) => r.parentElement.tagName !== "THEAD");
      const columns = Math.max(0, ...rows.map((r) => r.cells.length));
      for (let c = 0; c < columns; c++) {
        const values = body.map((r) => r.cells[c]?.textContent.trim()).filter(Boolean);
        if (values.length && values.every((v) => v.length <= 24)) {
          for (const r of rows) r.cells[c]?.classList.add("short");
        } else if (values.some((v) => v.length > 60)) {
          for (const r of rows) r.cells[c]?.classList.add("long");  // sentences: keep lines readable
        }
        if (c === 0) continue;
        if (!values.length || !values.every((v) => numeric.test(v.replace(/\s/g, "")))) continue;
        for (const r of rows) r.cells[c]?.classList.add("num");
      }
    }
  }

  function tagTicketNumbers(root) {
    const pattern = /#\d{3,}\b/g;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => n.nodeValue.includes("#") && !n.parentElement.closest("code, pre, a, .ref")
        ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
      const text = node.nodeValue;
      const matches = [...text.matchAll(pattern)];
      if (!matches.length) continue;
      const frag = document.createDocumentFragment();
      let at = 0;
      for (const m of matches) {
        frag.append(text.slice(at, m.index));
        // Ticket numbers open the ticket in ConnectWise. "Project #123" is a project, not a ticket: no link.
        const isProject = /project\s*$/i.test(text.slice(0, m.index));
        const tag = document.createElement(ticketUrl && !isProject ? "a" : "span");
        tag.className = "ref";
        tag.textContent = m[0];
        if (tag.tagName === "A") {
          tag.href = ticketUrl.replace("{id}", m[0].slice(1));
          tag.target = "_blank";
          tag.rel = "noopener";
          tag.title = "Open in ConnectWise";
        }
        frag.append(tag);
        at = m.index + m[0].length;
      }
      frag.append(text.slice(at));
      node.replaceWith(frag);
    }
  }

  // "Claude Sonnet 5.5 (balanced)" -> "Sonnet 5.5"
  function shortModel(id) {
    const label = modelInfo.models.find((m) => m.id === id)?.label || id || "";
    return label.replace(/\s*\(.*\)\s*$/, "").replace(/^Claude\s+/, "");
  }

  // The small line above each answer: David's mark, the model, and (for new answers) how long it took.
  function byline(model, seconds) {
    const line = document.createElement("div");
    line.className = "byline";
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.setAttribute("aria-hidden", "true");
    const brand = document.querySelector("aside .brand-mark");
    if (brand) mark.appendChild(brand.cloneNode(true));
    const label = document.createElement("span");
    label.className = "eyebrow";
    label.textContent = ["David", shortModel(model), seconds ? `${seconds}s` : ""].filter(Boolean).join(" · ");
    line.append(mark, label);
    return line;
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // Clipboard API needs HTTPS; fall back for plain-http intranet use.
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    toast("Answer copied");
  }

  function scrollToEnd() {
    const log = $("log");
    log.scrollTop = log.scrollHeight;
  }

  function addUser(text) {
    const div = document.createElement("div");
    div.className = "msg user";
    div.textContent = text;
    messages.appendChild(div);
    scrollToEnd();
  }

  function fmtTokens(n) {
    return n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
  }

  // Admins see what each answer used: tokens in/out and an estimated cost.
  function usageTag(u) {
    const span = document.createElement("span");
    span.className = "usage";
    const input = u.input_tokens + u.cache_write_tokens + u.cache_read_tokens;
    const cost = u.priced ? ` · ≈ $${u.cost_usd.toFixed(u.cost_usd < 0.1 ? 3 : 2)}` : "";
    span.textContent = `${fmtTokens(input)} in · ${fmtTokens(u.output_tokens)} out${cost}`;
    span.title = [
      `${u.requests} API call${u.requests === 1 ? "" : "s"} to Claude`,
      `Input: ${u.input_tokens.toLocaleString()} new, ${u.cache_read_tokens.toLocaleString()} cached, ` +
        `${u.cache_write_tokens.toLocaleString()} written to cache`,
      `Output (including reasoning): ${u.output_tokens.toLocaleString()}`,
      u.priced ? `Estimated cost: $${u.cost_usd.toFixed(4)}` : "No price known for this model",
      "Only admins see this.",
    ].join("\n");
    return span;
  }

  // ---------- Charts ----------
  // Validated categorical palette (dataviz reference instance), stepped separately for each mode,
  // checked against this page's surfaces. Series take slots in fixed order; never more than 8.
  const CHART_THEMES = {
    light: { surface: "#ffffff", grid: "#eceef2", axis: "#d9dce3", text: "#0b0d12", muted: "#5f636d",
             tooltip: "#ffffff",
             series: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"] },
    dark:  { surface: "#0d0f14", grid: "#1b1e26", axis: "#2a2e38", text: "#ededef", muted: "#9a9ea8",
             tooltip: "#161922",
             series: ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"] },
  };
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const liveCharts = [];  // {spec, canvas, chart} so charts can redraw when the theme changes

  function chartHeight(spec) {
    const legend = spec.series.length > 1 ? 28 : 0;
    return spec.type === "hbar" ? Math.max(140, spec.labels.length * 30 + 50 + legend) : 280 + legend;
  }

  function chartConfig(spec, t, forExport) {
    const horizontal = spec.type === "hbar";
    const stacked = spec.type === "stacked_bar";
    const line = spec.type === "line";
    const many = spec.series.length > 1;
    const datasets = spec.series.map((s, i) => {
      const color = t.series[i % 8];
      if (line) {
        return { label: s.name, data: s.values, borderColor: color, backgroundColor: many ? color : color + "1a",
                 fill: many ? false : "origin", borderWidth: 2, tension: 0, pointRadius: 4, pointHoverRadius: 6,
                 pointBackgroundColor: color, pointBorderColor: t.surface, pointBorderWidth: 2,
                 borderCapStyle: "round", borderJoinStyle: "round" };
      }
      const top = i === spec.series.length - 1;
      return { label: s.name, data: s.values, backgroundColor: color, maxBarThickness: 24,
               borderRadius: stacked && !top ? 0 : 4, borderSkipped: "start",
               // Stacked segments are separated by a 2px gap in the surface color, not a drawn border.
               borderWidth: stacked ? { top: horizontal ? 0 : 2, right: horizontal ? 2 : 0 } : 0,
               borderColor: t.surface, categoryPercentage: 0.8, barPercentage: many && !stacked ? 0.92 : 0.8 };
    });
    const valueAxis = {
      beginAtZero: true, stacked, grid: { color: t.grid, lineWidth: 1, drawTicks: false }, border: { display: false },
      ticks: { color: t.muted, padding: 6, callback: (v) => Number(v).toLocaleString() },
      title: { display: !!spec.y_label, text: spec.y_label, color: t.muted },
    };
    const categoryAxis = {
      stacked, grid: { display: false }, border: { color: t.axis },
      ticks: { color: t.muted, autoSkip: !horizontal, maxRotation: 0 },
      title: { display: !!spec.x_label, text: spec.x_label, color: t.muted },
    };
    return {
      type: line ? "line" : "bar",
      data: { labels: spec.labels, datasets },
      options: {
        indexAxis: horizontal ? "y" : "x",
        responsive: !forExport, maintainAspectRatio: false,
        animation: forExport || reduceMotion.matches ? false : { duration: 300 },
        interaction: line ? { mode: "index", intersect: false } : { mode: "nearest", intersect: true },
        font: { family: getComputedStyle(document.body).fontFamily },
        scales: horizontal ? { x: valueAxis, y: categoryAxis } : { x: categoryAxis, y: valueAxis },
        layout: { padding: labelPadding(spec) },
        plugins: {
          legend: { display: many, position: "top", align: "start",
                    labels: { color: t.muted, usePointStyle: true, boxWidth: 12, boxHeight: 12, padding: 14,
                              // A short stroke for lines, a square for bars, always in the series color.
                              generateLabels: (chart) => chart.data.datasets.map((d, i) => ({
                                text: d.label, datasetIndex: i, hidden: !chart.isDatasetVisible(i),
                                fontColor: t.muted, fillStyle: t.series[i % 8], strokeStyle: t.series[i % 8],
                                lineWidth: line ? 3 : 0, pointStyle: line ? "line" : "rect", rotation: 0,
                              })) } },
          tooltip: { backgroundColor: t.tooltip, titleColor: t.muted, bodyColor: t.text, borderColor: t.grid,
                     borderWidth: 1, padding: 10, usePointStyle: true, boxPadding: 4,
                     callbacks: {
                       labelPointStyle: () => ({ pointStyle: "line", rotation: 0 }),
                       // Values lead, series names follow.
                       label: (ctx) => ` ${Number(ctx.raw).toLocaleString()}  ${many ? ctx.dataset.label : ""}`,
                     } },
        },
      },
      plugins: [{ id: "surface", beforeDraw: (chart) => {
        const { ctx, width, height } = chart;
        ctx.save(); ctx.fillStyle = forExport ? "#ffffff" : t.surface; ctx.fillRect(0, 0, width, height); ctx.restore();
      } }, directLabels(spec, t)],
    };
  }

  // Selective direct labels: each value at the bar tip for a single-series ranking (up to 15 bars),
  // and each series' name at the end of its line for 2-4 lines. Nothing on busier charts.
  const LABEL_FONT = "11px " + getComputedStyle(document.body).fontFamily;
  function labelMode(spec) {
    if ((spec.type === "bar" || spec.type === "hbar") && spec.series.length === 1 && spec.labels.length <= 15) return "tips";
    if (spec.type === "line" && spec.series.length >= 2 && spec.series.length <= 4) return "ends";
    return null;
  }
  function textWidth(text) {
    const ctx = textWidth.ctx || (textWidth.ctx = document.createElement("canvas").getContext("2d"));
    ctx.font = LABEL_FONT;
    return ctx.measureText(text).width;
  }
  function labelPadding(spec) {
    const mode = labelMode(spec);
    if (mode === "tips") {
      const widest = Math.max(0, ...spec.series[0].values.map((v) => v == null ? 0 : textWidth(Number(v).toLocaleString())));
      return spec.type === "hbar" ? { right: Math.ceil(widest) + 8 } : { top: 18 };
    }
    if (mode === "ends") return { right: Math.ceil(Math.max(...spec.series.map((s) => textWidth(s.name)))) + 12 };
    return 0;
  }
  function directLabels(spec, t) {
    const mode = labelMode(spec);
    return { id: "directLabels", afterDatasetsDraw: (chart) => {
      if (!mode) return;
      const { ctx, chartArea } = chart;
      ctx.save();
      ctx.font = LABEL_FONT; ctx.fillStyle = t.muted;
      if (mode === "tips") {
        if (!chart.isDatasetVisible(0)) return ctx.restore();
        chart.getDatasetMeta(0).data.forEach((bar, i) => {
          const value = spec.series[0].values[i];
          if (value == null) return;
          const text = Number(value).toLocaleString();
          if (spec.type === "hbar") {
            ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(text, bar.x + 6, bar.y);
          } else {
            ctx.textAlign = "center"; ctx.textBaseline = "bottom"; ctx.fillText(text, bar.x, bar.y - 4);
          }
        });
      } else {
        // Place each name beside its line's last point, nudged apart so no two overlap.
        const ends = [];
        spec.series.forEach((s, i) => {
          if (!chart.isDatasetVisible(i)) return;
          const points = chart.getDatasetMeta(i).data;
          const last = points[points.length - 1];
          if (last) ends.push({ name: s.name, x: last.x, y: last.y });
        });
        ends.sort((a, b) => a.y - b.y);
        const gap = 14;
        for (let i = 1; i < ends.length; i++) ends[i].y = Math.max(ends[i].y, ends[i - 1].y + gap);
        const overflow = ends.length ? ends[ends.length - 1].y - chartArea.bottom : 0;
        if (overflow > 0) ends.forEach((e) => { e.y -= overflow; });
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ends.forEach((e) => ctx.fillText(e.name, e.x + 8, e.y));
      }
      ctx.restore();
    } };
  }

  function themeName() { return davidTheme.effective(); }

  function drawChart(entry) {
    if (entry.chart) entry.chart.destroy();
    entry.chart = new Chart(entry.canvas, chartConfig(entry.spec, CHART_THEMES[themeName()], false));
  }
  davidTheme.onChange(() => liveCharts.forEach((e) => e.canvas.isConnected && drawChart(e)));

  // Theme switch at the bottom of the sidebar: Light / Match system / Dark.
  const themeButtons = document.querySelectorAll(".theme-switch button");
  function showThemeChoice() {
    const choice = davidTheme.get();
    themeButtons.forEach((b) => b.setAttribute("aria-checked", String(b.dataset.choice === choice)));
  }
  themeButtons.forEach((b) => { b.onclick = () => { davidTheme.set(b.dataset.choice); showThemeChoice(); }; });
  showThemeChoice();

  // A light-theme, fixed-size rendering for PNG downloads and PDF reports.
  function chartImage(spec) {
    const canvas = document.createElement("canvas");
    canvas.width = 1200; canvas.height = Math.round(chartHeight(spec) * 1.8);
    canvas.style.cssText = "position:fixed;left:-99999px;top:0";
    document.body.appendChild(canvas);
    const t = { ...CHART_THEMES.light, surface: "#ffffff" };
    const config = chartConfig(spec, t, true);
    config.options.devicePixelRatio = 1;
    config.options.font = { ...config.options.font, size: 20 };
    const chart = new Chart(canvas, config);
    const url = chart.toBase64Image("image/png");
    chart.destroy(); canvas.remove();
    return url;
  }

  function download(url, filename) {
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function slug(text) { return (text || "chart").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50); }

  function chartTable(spec) {
    const table = document.createElement("table");
    table.className = "chart-table";
    const head = table.insertRow();
    for (const h of [spec.x_label || "", ...spec.series.map((s) => s.name)]) {
      const th = document.createElement("th"); th.textContent = h; head.appendChild(th);
    }
    spec.labels.forEach((label, i) => {
      const row = table.insertRow();
      row.insertCell().textContent = label;
      for (const s of spec.series) row.insertCell().textContent = s.values[i] == null ? "–" : Number(s.values[i]).toLocaleString();
    });
    return table;
  }

  function chartCard(spec) {
    const card = document.createElement("figure");
    card.className = "chart-card shell";
    const inner = document.createElement("div");
    inner.className = "core";
    card.appendChild(inner);
    const title = document.createElement("h4"); title.textContent = spec.title;
    inner.appendChild(title);
    if (spec.subtitle) {
      const sub = document.createElement("p"); sub.className = "chart-sub"; sub.textContent = spec.subtitle;
      inner.appendChild(sub);
    }
    const box = document.createElement("div");
    box.className = "chart-box";
    box.style.height = chartHeight(spec) + "px";
    const canvas = document.createElement("canvas");
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", `${spec.title}. Use "Show table" for the values.`);
    box.appendChild(canvas);
    inner.appendChild(box);
    const tools = document.createElement("div");
    tools.className = "chart-tools";
    const tableBtn = document.createElement("button");
    tableBtn.type = "button"; tableBtn.textContent = "Show table";
    let table = null;
    tableBtn.onclick = () => {
      if (table) { table.remove(); table = null; tableBtn.textContent = "Show table"; return; }
      table = chartTable(spec); inner.appendChild(table); tableBtn.textContent = "Hide table";
    };
    const png = document.createElement("button");
    png.type = "button"; png.textContent = "Download PNG";
    png.onclick = () => download(chartImage(spec), `${slug(spec.title)}.png`);
    tools.append(tableBtn, png);
    inner.appendChild(tools);
    const entry = { spec, canvas, chart: null };
    liveCharts.push(entry);
    requestAnimationFrame(() => drawChart(entry));
    return card;
  }

  // ---------- Exports ----------
  // PDF of just the tables and charts in an answer (not the rest of the chat).
  function printReport(tables, charts) {
    const win = window.open("", "_blank");
    if (!win) { toast("Allow pop-ups for this site to create the PDF."); return; }
    const doc = win.document;
    doc.open();
    doc.write(`<!doctype html><html><head><meta charset="utf-8"><title></title><style>
      body { font: 13px/1.55 "Geist", "Segoe UI", system-ui, sans-serif; color: #1c1b19; margin: 32px 40px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px;
               border-bottom: 2px solid #183e7c; padding-bottom: 12px; margin-bottom: 18px; }
      header img { height: 44px; } header .meta { text-align: right; font-size: 11px; color: #6f6b63; }
      table { border-collapse: collapse; margin: 10px 0; font-variant-numeric: tabular-nums; }
      th { text-align: left; font-weight: 600; border-bottom: 1px solid #cfcbc2; padding: 4px 14px 4px 0; }
      td { border-bottom: 1px solid #e2dfd8; padding: 4px 14px 4px 0; }
      td:not(:first-child), th:not(:first-child) { text-align: right; }
      figure { margin: 18px 0; break-inside: avoid; } figure img { width: 100%; }
      figcaption { font-weight: 600; margin-bottom: 4px; } figcaption span { font-weight: 400; color: #6f6b63; }
      footer { margin-top: 28px; font-size: 10px; color: #9a958b; }
      @page { margin: 14mm; }
    </style></head><body></body></html>`);
    doc.close();
    const title = charts?.[0]?.title || "Report";
    doc.title = `David – ${title}`;
    const header = doc.createElement("header");
    const logo = doc.createElement("img"); logo.src = "/logo"; logo.alt = ""; logo.onerror = () => logo.remove();
    const meta = doc.createElement("div"); meta.className = "meta";
    meta.textContent = `Prepared by David · ${new Date().toLocaleString()}`;
    header.append(logo, meta);
    doc.body.append(header);
    for (const table of tables) doc.body.appendChild(doc.importNode(table, true));
    for (const spec of charts || []) {
      const fig = doc.createElement("figure");
      const cap = doc.createElement("figcaption"); cap.textContent = spec.title;
      if (spec.subtitle) { const sub = doc.createElement("span"); sub.textContent = " · " + spec.subtitle; cap.appendChild(sub); }
      const img = doc.createElement("img"); img.src = chartImage(spec); img.alt = spec.title;
      fig.append(cap, img);
      doc.body.appendChild(fig);
    }
    const footer = doc.createElement("footer");
    footer.textContent = "Generated from live ConnectWise data. Check key numbers before sharing.";
    doc.body.appendChild(footer);
    const go = () => { win.focus(); win.print(); };
    if (logo.isConnected && !logo.complete) { logo.onload = go; logo.onerror = () => { logo.remove(); go(); }; }
    else setTimeout(go, 50);
  }

  function actionButton(label, icon, onclick) {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = icon + label;
    b.onclick = onclick;
    return b;
  }

  const DOWNLOAD = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5v8m0 0L4.5 7M8 10.5 11.5 7M3 13.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function addAnswer(text, usage, charts, answerId, model, seconds) {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.appendChild(byline(model, seconds));
    const answer = document.createElement("div");
    answer.className = "answer";
    renderMarkdown(answer, text);
    const actions = document.createElement("div");
    actions.className = "actions";
    const copy = document.createElement("button");
    copy.type = "button";
    copy.innerHTML = COPY + "Copy";
    copy.onclick = () => copyText(text);
    if (isAdmin && usage) actions.appendChild(usageTag(usage));
    actions.appendChild(copy);
    // Only reports can be downloaded: the answer's tables and charts, never the chat itself.
    const tables = [...answer.querySelectorAll("table")];
    if (tables.length || charts?.length) {
      if (answerId) {
        actions.appendChild(actionButton("Excel", DOWNLOAD, () => download(`/api/answers/${answerId}/export.xlsx`, "")));
      }
      actions.appendChild(actionButton("PDF", DOWNLOAD, () => printReport(tables, charts)));
    }
    div.append(answer);
    if (charts && charts.length && window.Chart) {
      const wrap = document.createElement("div");
      wrap.className = "charts";
      for (const spec of charts) wrap.appendChild(chartCard(spec));
      div.appendChild(wrap);
    }
    div.appendChild(actions);
    messages.appendChild(div);
    return div;
  }

  function addThinking() {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.innerHTML = '<div class="thinking"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>' +
      '<span class="status">Thinking…</span><span class="elapsed">0s</span></div>';
    messages.appendChild(div);
    scrollToEnd();
    const started = Date.now();
    const elapsed = div.querySelector(".elapsed");
    const status = div.querySelector(".status");
    const timer = setInterval(() => { elapsed.textContent = Math.round((Date.now() - started) / 1000) + "s"; }, 1000);
    return { el: div, stop: () => clearInterval(timer), setStatus: (text) => { status.textContent = text; } };
  }

  function showStart() {
    const start = document.createElement("section");
    start.className = "start";
    start.innerHTML = '<span class="eyebrow">David · ConnectWise intelligence</span>' +
      "<h2></h2>" +
      "<p>Ask anything about our clients: tickets, time, SLAs and projects, answered from live ConnectWise data. " +
      "Follow-up questions keep the context.</p>";
    start.querySelector("h2").textContent = firstName ? `Hey, ${firstName}` : "Hey there";
    const list = document.createElement("div");
    list.className = "suggestions";
    EXAMPLES.forEach(([kind, text], i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "shell";
      b.style.setProperty("--i", i);
      b.innerHTML = '<span class="core"><span class="eyebrow"></span><span class="q"></span>' +
        `<span class="cta${i ? " ghost" : ""}">${i ? "Try it" : "Ask David"}<span class="ico">${ARROW}</span></span></span>`;
      b.querySelector(".eyebrow").textContent = kind;
      b.querySelector(".q").textContent = text;
      b.onclick = () => ask(text);
      list.appendChild(b);
    });
    start.appendChild(list);
    messages.appendChild(start);
  }

  function groupLabel(iso) {
    const d = new Date(iso), now = new Date();
    const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((day(now) - day(d)) / 86400000);
    if (diff <= 0) return "Today";
    if (diff === 1) return "Yesterday";
    if (diff < 7) return "Previous 7 days";
    if (diff < 30) return "Previous 30 days";
    return "Older";
  }

  function closePopovers() {
    chatList.querySelectorAll(".popover").forEach((p) => p.remove());
    chatList.querySelectorAll("button.menu[aria-expanded]").forEach((b) => b.setAttribute("aria-expanded", "false"));
  }

  async function loadChats() {
    let chats;
    try {
      chats = await api("/api/conversations");
    } catch (err) {
      chatList.innerHTML = '<li class="empty-list">Couldn\'t load your chats. Refresh to try again.</li>';
      return;
    }
    chatList.innerHTML = "";
    if (!chats.length) {
      chatList.innerHTML = '<li class="empty-list">Your chats will appear here. Questions and answers are logged for admins.</li>';
      return;
    }
    let lastGroup = null;
    for (const c of chats) {
      const label = groupLabel(c.updated_at);
      if (label !== lastGroup) {
        const g = document.createElement("li");
        g.className = "group";
        g.textContent = label;
        chatList.appendChild(g);
        lastGroup = label;
      }
      const li = document.createElement("li");
      li.className = "chat" + (c.id === conversationId ? " active" : "");
      const open = document.createElement("button");
      open.className = "open";
      open.type = "button";
      open.innerHTML = '<span class="title"></span>';
      open.firstChild.textContent = c.title;
      open.title = c.title;
      if (c.id === conversationId) open.setAttribute("aria-current", "true");
      open.onclick = () => openChat(c.id);
      const menu = document.createElement("button");
      menu.className = "menu";
      menu.type = "button";
      menu.setAttribute("aria-label", `Options for ${c.title}`);
      menu.setAttribute("aria-expanded", "false");
      menu.textContent = "⋯";
      menu.onclick = (e) => { e.stopPropagation(); chatMenu(li, menu, c); };
      li.append(open, menu);
      chatList.appendChild(li);
    }
  }

  function chatMenu(li, menuButton, c) {
    const wasOpen = menuButton.getAttribute("aria-expanded") === "true";
    closePopovers();
    if (wasOpen) return;
    menuButton.setAttribute("aria-expanded", "true");
    const pop = document.createElement("div");
    pop.className = "popover";
    pop.onclick = (e) => e.stopPropagation();
    const rename = document.createElement("button");
    rename.type = "button";
    rename.textContent = "Rename";
    rename.onclick = () => { closePopovers(); startRename(li, c); };
    const del = document.createElement("button");
    del.type = "button";
    del.className = "danger";
    del.textContent = "Delete";
    del.onclick = () => {
      pop.innerHTML = "<p>Delete this chat? This can't be undone.</p>";
      const row = document.createElement("div");
      row.className = "row";
      const yes = document.createElement("button");
      yes.type = "button"; yes.className = "danger"; yes.textContent = "Delete";
      const no = document.createElement("button");
      no.type = "button"; no.textContent = "Cancel";
      no.onclick = closePopovers;
      yes.onclick = async () => {
        try {
          await api(`/api/conversations/${c.id}`, { method: "DELETE" });
          toast("Chat deleted");
          if (c.id === conversationId) newChat(); else loadChats();
        } catch (err) {
          toast("Couldn't delete: " + err.message);
        }
      };
      row.append(no, yes);
      pop.appendChild(row);
      yes.focus();
    };
    pop.append(rename, del);
    li.appendChild(pop);
    rename.focus();
  }

  function startRename(li, c) {
    const input = document.createElement("input");
    input.className = "rename";
    input.value = c.title;
    input.setAttribute("aria-label", "Chat name");
    li.replaceChildren(input);
    input.focus();
    input.select();
    let done = false;
    const finish = async (save) => {
      if (done) return;
      done = true;
      const title = input.value.trim();
      if (save && title && title !== c.title) {
        try {
          await api(`/api/conversations/${c.id}`, { method: "PATCH", body: JSON.stringify({ title }) });
          if (c.id === conversationId) chatTitle.textContent = title;
        } catch (err) {
          toast("Couldn't rename: " + err.message);
        }
      }
      loadChats();
    };
    input.onkeydown = (e) => {
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    };
    input.onblur = () => finish(true);
  }

  function setModel(model, locked) {
    // Only select models that are still enabled; otherwise show the default.
    if (model && [...modelSelect.options].some((o) => o.value === model)) modelSelect.value = model;
    else if (modelInfo.default) modelSelect.value = modelInfo.default;
    modelSelect.disabled = locked;
    modelSelect.title = locked
      ? "This chat's model. Start a new chat to use a different one."
      : "Model for this chat. It can't be changed after the first question.";
  }

  // Empty the conversation view, freeing its charts.
  function clearMessages() {
    view++;
    for (const entry of liveCharts) entry.chart?.destroy();
    liveCharts.length = 0;
    messages.innerHTML = "";
  }

  function newChat() {
    conversationId = null;
    clearMessages();
    chatTitle.textContent = "New chat";
    setModel(modelInfo.default, false);
    showStart();
    closeDrawer();
    loadChats();
    q.focus();
  }

  async function openChat(id) {
    closeDrawer();
    try {
      const chat = await api(`/api/conversations/${id}`);
      conversationId = chat.id;
      chatTitle.textContent = chat.title;
      setModel(chat.model, true);
      clearMessages();
      for (const t of chat.turns) {
        if (t.role === "user") addUser(t.text);
        else addAnswer(t.text, t.usage, t.charts, t.id, t.model || chat.model);
      }
      scrollToEnd();
      loadChats();
    } catch (err) {
      toast("Couldn't open that chat: " + err.message);
    }
  }

  function nearBottom() {
    const log = $("log");
    return log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  }

  // Reads the server's one-JSON-event-per-line stream and calls onEvent for each.
  async function readEvents(response, onEvent) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
      let newline;
      while ((newline = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, newline).trim();
        buffer = buffer.slice(newline + 1);
        if (line) onEvent(JSON.parse(line));
      }
      if (done) return;
    }
  }

  async function ask(question) {
    if (busy) return;
    busy = true;
    updateSend();
    const askedIn = view;
    const shown = () => view === askedIn;  // false once the person has opened another chat
    messages.querySelector(".start")?.remove();
    addUser(question);
    const thinking = addThinking();
    const askedAt = Date.now();
    let streamed = null;   // the answer element while text is arriving
    let text = "";
    let frame = 0;
    const render = () => {
      frame = 0;
      const follow = nearBottom();
      renderMarkdown(streamed, text);
      if (follow) scrollToEnd();
    };
    const dropStreamed = () => {
      if (frame) { cancelAnimationFrame(frame); frame = 0; }
      text = "";
      if (streamed) { streamed.parentElement.remove(); streamed = null; }
      thinking.el.hidden = false;
    };
    try {
      const response = await fetch("/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, conversation_id: conversationId, model: modelSelect.value || null }),
      });
      if (response.status === 401) { location.href = "/login"; return; }
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || response.statusText);
      }
      let result = null;
      await readEvents(response, (event) => {
        if (event.type === "error") throw new Error(event.message);
        if (event.type === "done") { result = event; return; }
        if (!shown()) return;  // keep reading so the answer finishes and is saved
        if (event.type === "status") {
          thinking.setStatus(event.text);
        } else if (event.type === "reset") {
          dropStreamed();  // a new step started; earlier partial text was a preamble, not the answer
        } else if (event.type === "text") {
          if (!streamed) {
            const wrap = document.createElement("div");
            wrap.className = "msg bot";
            wrap.appendChild(byline(modelSelect.value));
            streamed = document.createElement("div");
            streamed.className = "answer streaming";
            wrap.appendChild(streamed);
            messages.insertBefore(wrap, thinking.el);
            thinking.el.hidden = true;
          }
          text += event.text;
          if (!frame) frame = requestAnimationFrame(render);
        }
      });
      if (!result) throw new Error("The connection was lost before the answer finished.");
      if (frame) cancelAnimationFrame(frame);
      thinking.stop();
      if (!shown()) {
        // Reopened this same chat meanwhile: reload it to show the answer. Otherwise just say where it went.
        if (result.conversation_id === conversationId) { openChat(conversationId); return; }
        toast(`Answer saved in “${result.title}”`);
        loadChats();
        return;
      }
      thinking.el.remove();
      if (streamed) streamed.parentElement.remove();
      addAnswer(result.answer, result.usage, result.charts, result.answer_id, result.model,
                Math.max(1, Math.round((Date.now() - askedAt) / 1000)));
      if (!conversationId) {
        chatTitle.textContent = result.title;
        setModel(result.model, true);
      }
      conversationId = result.conversation_id;
      loadChats();
    } catch (err) {
      if (frame) cancelAnimationFrame(frame);
      thinking.stop();
      if (!shown()) { toast("That answer didn't go through: " + err.message); return; }
      if (streamed) streamed.parentElement.remove();
      thinking.el.hidden = false;
      thinking.el.className = "msg error";
      thinking.el.textContent = "That didn't go through: " + err.message;
      const retry = document.createElement("button");
      retry.type = "button";
      retry.textContent = "Try again";
      retry.onclick = () => { thinking.el.previousElementSibling?.remove(); thinking.el.remove(); ask(question); };
      thinking.el.appendChild(document.createElement("br"));
      thinking.el.appendChild(retry);
    } finally {
      busy = false;
      updateSend();
      q.focus();
    }
  }

  // Phones get a shorter hint and short model names, so neither gets cut off.
  const narrowQuery = window.matchMedia("(max-width: 760px)");
  function fitToScreen() {
    const narrow = narrowQuery.matches;
    q.placeholder = narrow ? "Ask about a client…" : "Ask about a client's tickets or time…";
    for (const option of modelSelect.options) {
      const label = modelInfo.models.find((m) => m.id === option.value)?.label || option.value;
      option.text = narrow ? shortModel(option.value) : label;
    }
  }

  function updateSend() {
    send.disabled = busy || !q.value.trim();
  }
  function autoGrow() {
    q.style.height = "auto";
    q.style.height = Math.min(q.scrollHeight, 200) + "px";
  }

  function openDrawer() { document.body.classList.add("sidebar-open"); }
  function closeDrawer() { document.body.classList.remove("sidebar-open"); }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const question = q.value.trim();
    if (!question || busy) return;
    q.value = "";
    autoGrow();
    ask(question);
  });
  q.addEventListener("input", () => { autoGrow(); updateSend(); });
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("new").onclick = newChat;
  $("toggle").onclick = openDrawer;
  $("backdrop").onclick = closeDrawer;
  document.addEventListener("click", closePopovers);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closePopovers(); closeDrawer(); } });
  $("logout").onclick = async () => {
    await api("/api/logout", { method: "POST" }).catch(() => {});
    location.href = "/login";
  };


  (async () => {
    const me = await api("/api/me");
    $("me").textContent = me.display_name;
    isAdmin = me.is_admin;
    firstName = me.display_name.trim().split(/\s+/)[0] || "";
    ticketUrl = me.ticket_url || "";
    $("avatar").textContent = me.display_name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
    modelInfo = await api("/api/models");
    for (const m of modelInfo.models) modelSelect.add(new Option(m.label, m.id));
    fitToScreen();
    narrowQuery.addEventListener("change", fitToScreen);
    $("model-wrap").hidden = modelInfo.models.length < 2;
    updateSend();
    newChat();
  })();
</script>
