<title>David</title>

<style>
  :root { --z-popover: 20; --z-drawer: 30; --z-toast: 40; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-size: 15px; line-height: 1.6; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: none; box-shadow: var(--ring); border-radius: 8px; }

  .skip { position: absolute; left: 12px; top: -48px; z-index: var(--z-toast);
          background: var(--cta); color: var(--cta-ink); padding: 8px 14px; border-radius: 999px;
          text-decoration: none; font-weight: 500; transition: top .2s var(--ease); }
  .skip:focus { top: 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { position: relative; z-index: 1; display: grid; grid-template-columns: 292px minmax(0, 1fr);
         height: 100dvh; overflow: hidden; }

  /* ---------- Sidebar: a floating, mostly solid panel ---------- */
  aside { margin: 14px 0 14px 14px; border-radius: 28px; background: var(--panel); border: 1px solid var(--glass-ring);
          box-shadow: var(--core-hi), var(--ambient); display: flex; flex-direction: column; min-height: 0;
          position: relative; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 16px; }
  .brand-mark { width: 28px; height: 28px; border-radius: 9px; background: #183e7c;
                display: grid; place-items: center; flex-shrink: 0; }
  .brand-mark svg { width: 16px; height: 16px; }
  .brand-mark.has-logo { background: none; width: auto; height: auto; border-radius: 0; }
  .brand-mark img { display: block; height: 30px; width: auto; max-width: 132px; object-fit: contain; }
  .brand-name { font-weight: 600; letter-spacing: -.02em; line-height: 1.2; font-size: 16px; min-width: 0; }
  .brand-name small { display: block; font-size: 9.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
                      color: var(--faint); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #new { margin: 0 14px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
         padding: 6px 6px 6px 18px; border-radius: 999px; border: 0; background: var(--cta); color: var(--cta-ink);
         font-weight: 500; transition: transform var(--duration-quick) var(--ease-smooth-out), opacity .2s; }
  #new:hover { opacity: .92; }
  #new:active { transform: scale(.96); }

  #chats { list-style: none; margin: 0; padding: 4px 10px 12px; overflow-y: auto; flex: 1; }
  /* Thin scrollbar that only shows while the pointer is over the chat list (or it has focus). */
  #chats { scrollbar-width: thin; scrollbar-color: transparent transparent; transition: scrollbar-color .2s; }
  #chats:hover, #chats:focus-within { scrollbar-color: color-mix(in srgb, var(--faint) 60%, transparent) transparent; }
  #chats .group { font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--faint);
                  padding: 16px 12px 6px; }
  #chats .group:first-child { padding-top: 4px; }
  #chats li.chat { position: relative; display: flex; align-items: center; border-radius: 14px; margin: 1px 0;
                   transition: background .2s var(--ease); }
  #chats li.chat:hover { background: var(--hover); }
  #chats li.chat.active { background: var(--pill); box-shadow: inset 0 0 0 1px var(--hair); }
  #chats button.open { flex: 1; min-width: 0; text-align: left; background: none; border: 0;
                       padding: 8px 4px 8px 12px; border-radius: 14px; }
  #chats .title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                  font-size: 13.5px; color: var(--muted); }
  #chats li.active .title { color: var(--text); font-weight: 500; }
  #chats button.menu { position: relative; width: 36px; height: 32px; display: grid; place-items: center;
                       background: none; border: 0; color: var(--muted); padding: 0; margin-right: 3px;
                       border-radius: 999px; opacity: 0; line-height: 1;
                       transition: opacity .15s, background .15s, transform var(--duration-quick) var(--ease-smooth-out); }
  #chats li.chat:hover button.menu, #chats li.chat.active button.menu,
  #chats button.menu:focus-visible, #chats button.menu[aria-expanded="true"] { opacity: 1; }
  #chats button.menu:hover { background: var(--hover); color: var(--text); }
  #chats input.rename { flex: 1; min-width: 0; margin: 3px 6px; padding: 5px 10px; font-size: 13.5px;
                        border: 1px solid var(--glass-ring); border-radius: 10px; background: var(--core); }
  #chats input.rename:focus { outline: none; box-shadow: var(--ring); }
  .popover { position: absolute; right: 6px; top: calc(100% - 2px); z-index: var(--z-popover);
             background: var(--core); border: 1px solid var(--glass-ring); border-radius: 16px;
             box-shadow: var(--ambient); padding: 5px; min-width: 176px; }
  .popover p { margin: 6px 10px 8px; font-size: 13px; color: var(--muted); }
  .popover button { display: block; width: 100%; text-align: left; background: none; border: 0;
                    padding: 8px 12px; border-radius: 11px; font-size: 13.5px; }
  .popover button { transition: transform var(--duration-quick) var(--ease-smooth-out); }
  .popover button:hover { background: var(--hover); }
  .popover button.danger { color: var(--danger); }
  .popover button.danger:hover { background: var(--danger-soft); }
  .popover .row { display: flex; gap: 4px; }
  .popover .row button { text-align: center; }
  .empty-list { color: var(--faint); font-size: 13px; padding: 10px 12px; line-height: 1.5; }

  .appearance { padding: 0; }
  /* The highlight slides between the three choices (tabs sliding). Full width, square-ish corners. */
  .theme-switch { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px;
                  border-radius: 9px; background: var(--pill); box-shadow: inset 0 0 0 1px var(--hair); }
  .theme-switch button { position: relative; height: 30px; border: 0; border-radius: 6px; background: none;
                         display: grid; place-items: center; }
  .theme-switch .t-tab { transition: color var(--tabs-dur) var(--tabs-ease), transform var(--duration-quick) var(--ease-smooth-out); }
  .theme-switch .t-tabs-pill { height: 30px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 1px var(--hair); }
  .theme-switch svg { width: 15px; height: 15px; }
  /* Admins: Feedback from users, an icon at the right of the David name. Hovering shows this week's thumbs down. */
  .icon-link { position: relative; width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center;
               color: var(--muted); flex-shrink: 0; transition: transform var(--duration-quick) var(--ease-smooth-out); }
  .icon-link[hidden] { display: none; }
  .name-line { display: flex; align-items: center; gap: 4px; }
  .brand .icon-link { width: 26px; height: 26px; margin: -4px 0; }
  .brand .icon-link svg { width: 15px; height: 15px; }
  .brand .icon-link::after { inset: -7px; }
  .icon-link:hover { color: var(--text); background: var(--hover); }
  .icon-link:active { transform: scale(.96); }
  .icon-link:focus-visible { outline: none; box-shadow: var(--ring); }
  .icon-link::after { content: ""; position: absolute; inset: -4px; }
  .icon-link svg { width: 16px; height: 16px; }
  .me { position: relative; margin: 0 10px; padding: 10px 0 12px; display: flex; align-items: center; gap: 6px;
        border-top: 1px solid var(--hair); }
  #me-button { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 6px; border: 0;
               border-radius: 10px; background: none; color: var(--text); text-align: left;
               transition: background .2s var(--ease), transform var(--duration-quick) var(--ease-smooth-out); }
  #me-button:hover, #me-button[aria-expanded="true"] { background: var(--hover); }
  #me-button:active { transform: scale(.96); }
  #me-button .who { flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  /* Up/down arrows: the name opens a menu. They stay put when a long name is cut short. */
  #me-button .chev { width: 14px; height: 14px; flex-shrink: 0; margin-left: -4px; color: var(--faint);
                     transition: color .2s var(--ease); }
  #me-button:hover .chev, #me-button[aria-expanded="true"] .chev { color: var(--text); }
  /* The settings menu opens upward from your name. */
  #me-menu { left: 0; right: 0; top: auto; bottom: calc(100% + 2px); min-width: 0; padding: 6px; border-radius: 15px;
             border-color: var(--glass-ring); box-shadow: 0 12px 32px -16px rgba(15, 23, 42, .16); }
  #me-menu .rule { height: 1px; margin: 6px 2px; background: var(--hair); }
  .avatar { width: 30px; height: 30px; border-radius: 999px; background: var(--pill); color: var(--text);
            box-shadow: inset 0 0 0 1px var(--hair); display: grid; place-items: center; font-size: 11.5px;
            font-weight: 600; flex-shrink: 0; }
  #me { min-width: 0; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #logout { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 34px;
            margin: 0; background: none; border: 0; border-radius: 9px; color: var(--muted); font-size: 13px; font-weight: 500;
            transition: background .2s var(--ease), color .2s var(--ease), transform var(--duration-quick) var(--ease-smooth-out); }
  #logout svg { width: 14px; height: 14px; }
  #logout::after { content: ""; position: absolute; inset: -3px 0; }  /* 40px tall to click */
  #logout:hover { color: var(--text); background: var(--hover); }

  /* ---------- Main ---------- */
  main { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  /* The chat title floats as a small glass pill */
  /* The chat title: plain text at the top of the chat area */
  header { display: flex; align-items: center; gap: 10px; padding: 20px 28px 4px; min-height: 0; }
  /* Empty on a new chat; it keeps its line height so nothing shifts when a title appears. */
  #chat-title { min-width: 0; min-height: 1.45em; font-size: 14px; font-weight: 600; letter-spacing: -.01em;
                color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toggle { display: none; background: none; border: 0; border-radius: 999px; padding: 4px; margin-left: -8px; line-height: 0; }
  #toggle svg { width: 18px; height: 18px; }

  #log { flex: 1; overflow-y: auto; padding: 28px 24px 16px; scroll-behavior: smooth;
         -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 24px), transparent);
                 mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 24px), transparent); }
  .inner { max-width: 840px; margin: 0 auto; }
  #messages { display: flex; flex-direction: column; gap: 34px; }

  /* Start screen: headline and an uneven grid of example questions. Sizes and spacing follow the
     window's height, so it fits without scrolling on short screens (laptops, Windows displays
     scaled to 125-150%) and sits in the middle of tall ones. It only scrolls if it can't fit. */
  #log:has(.start) .inner { min-height: 100%; display: flex; flex-direction: column; }
  #log:has(.start) #messages { flex: 1; justify-content: center; }
  .start { padding: clamp(0px, 2vh, 24px) 0 clamp(8px, 2vh, 24px); }
  .start .eyebrow-row { margin-bottom: clamp(10px, 2.2vh, 18px); }
  .start h2 { font-size: clamp(30px, min(4.4vw, 6.2vh), 56px); font-weight: 600; letter-spacing: -.05em; line-height: 1.02;
              margin: 0 0 clamp(8px, 1.6vh, 16px); text-wrap: balance; color: var(--text); }
  .start h2 .word { display: inline-block;
              background: linear-gradient(180deg, var(--text) 30%, var(--muted)); -webkit-background-clip: text;
              background-clip: text; -webkit-text-fill-color: transparent; }
  .start p { margin: 0 0 clamp(14px, 3vh, 28px); font-size: clamp(14px, 1.9vh, 16px); color: var(--muted);
             max-width: 44ch; text-wrap: pretty; }
  .suggestions { display: grid; grid-template-columns: 1.5fr 1fr; gap: clamp(10px, 1.6vh, 14px); }
  .suggestions button.shell { display: block; text-align: left; color: inherit;
    transition: transform var(--duration-fast) var(--ease-smooth-out);
    animation: rise-in var(--duration-very-slow) var(--ease-smooth-out) both; animation-delay: calc(var(--i) * var(--duration-micro)); }
  .suggestions button.shell:hover { transform: translateY(-2px); }
  .suggestions button.shell:active { transform: scale(.96); }
  .suggestions button.shell:first-child { grid-row: span 2; }
  .suggestions .core { position: relative; overflow: hidden; height: 100%; padding: clamp(14px, 2.3vh, 20px);
                       display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 14px); }
  .suggestions .shell:first-child .core { min-height: clamp(160px, 30vh, 300px); justify-content: space-between; }
  .suggestions .shell:first-child .core::before { content: ""; position: absolute; width: 340px; height: 340px;
    right: -110px; top: -140px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, var(--orb-a), transparent); }
  /* Shorter windows: the three examples side by side in one row, which takes about half the height. */
  @media (min-width: 761px) and (max-height: 780px) {
    .suggestions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .suggestions button.shell:first-child { grid-row: auto; }
    .suggestions .shell:first-child .core { min-height: 0; }
    .suggestions .shell:first-child .q { font-size: 17px; letter-spacing: -.02em; line-height: 1.35; max-width: none; }
    .start p { max-width: 62ch; }
  }
  .suggestions .q { position: relative; font-size: 15px; font-weight: 500; line-height: 1.45; letter-spacing: -.01em; }
  .suggestions .shell:first-child .q { font-size: clamp(20px, 3vh, 26px); font-weight: 600; letter-spacing: -.035em; line-height: 1.12; max-width: 17ch; }
  .cta { position: relative; display: inline-flex; align-items: center; gap: 12px; align-self: flex-start;
         border-radius: 999px; padding: 5px 5px 5px 16px; font-size: 13px; font-weight: 500;
         background: var(--cta); color: var(--cta-ink); }
  .cta .ico { width: 26px; height: 26px; }
  .cta.ghost { background: var(--pill); color: var(--text); }
  .cta.ghost .ico { background: var(--pill); }

  /* To Do tab: a sidebar entry, and a view that takes the chat's place. */
  /* To Do sits at the right of your name row. */
  .nav-tab { position: relative; flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px 0 10px;
             border: 0; border-radius: 9px; background: none; color: var(--muted); font-size: 13px; font-weight: 500;
             box-shadow: inset 0 0 0 1px var(--hair);
             transition: background .2s var(--ease), color .2s var(--ease), transform var(--duration-quick) var(--ease-smooth-out); }
  .nav-tab:hover { background: var(--hover); color: var(--text); }
  .nav-tab:active { transform: scale(.96); }
  .nav-tab[aria-current="page"] { background: var(--core); color: var(--text); box-shadow: inset 0 0 0 1px var(--glass-ring), 0 1px 2px rgba(0, 0, 0, .06); }
  /* Its own outline would otherwise replace the keyboard focus ring. */
  .nav-tab:focus-visible { box-shadow: inset 0 0 0 1px var(--hair), var(--ring); }
  .nav-tab[aria-current="page"]:focus-visible { box-shadow: inset 0 0 0 1px var(--glass-ring), 0 1px 2px rgba(0, 0, 0, .06), var(--ring); }
  .nav-tab::after { content: ""; position: absolute; inset: -3px 0; }  /* 40px tall to click */
  .nav-tab svg { width: 15px; height: 15px; flex-shrink: 0; }
  /* Notes and To Do share the row with your name, so they're icons; the name keeps the room. */
  .me .nav-tab { width: 36px; padding: 0; justify-content: center; }
  .nav-tips { gap: 6px; flex-shrink: 0; }
  .nav-tips .t-tt { left: 0; font-size: 12.5px; font-weight: 500; padding: 6px 10px; }
  .me .nav-tab .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  :is(body.todo-view, body.notes-view) :is(#log, #form) { display: none; }
  :is(#todo, #notes) .inner { min-height: 100%; display: flex; flex-direction: column; }
  #notes .inner { max-width: 1060px; }  /* room for the list beside the note */
  /* Opening Notes or To Do: the page rises a short way into place (panel reveal). */
  :is(#todo, #notes).t-panel-slide { --panel-translate-y: 14px; }
  :is(#todo, #notes) { flex: 1; overflow-y: auto; padding: 28px 24px 40px;
          -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28px);
                  mask-image: linear-gradient(to bottom, transparent 0, #000 28px); }
  .todo-head h2 { font-size: clamp(30px, 4vw, 44px); font-weight: 600; letter-spacing: -.05em; line-height: 1.04;
                  margin: 16px 0 6px; text-wrap: balance;
                  background: linear-gradient(180deg, var(--text) 30%, var(--muted)); -webkit-background-clip: text;
                  background-clip: text; -webkit-text-fill-color: transparent; }
  .todo-head p { margin: 0 0 14px; color: var(--muted); max-width: 60ch; text-wrap: pretty; }
  .todo-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .todo-bar .meta { white-space: nowrap; }
  .todo-bar .meta { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
  .todo-bar .cta { border: 0; transition: transform var(--duration-quick) var(--ease-smooth-out), opacity .2s; }
  .todo-bar .cta:active { transform: scale(.96); }
  .todo-bar .cta:disabled { opacity: .5; }
  .progress { flex: 1 1 80px; height: 4px; border-radius: 999px; background: var(--pill); overflow: hidden; }
  .progress i { display: block; height: 100%; border-radius: inherit; background: var(--tag-ink);
                transition: width var(--duration-slow) var(--ease-smooth-out); }
  .todo-sheet { margin-bottom: 16px; animation: rise var(--duration-slow) var(--ease-smooth-out) both; }
  .todo-sheet > .core { padding: 2px 8px 8px; }
  .todo-group-body { padding: 16px 0 6px; }
  .todo-group + .todo-group > .todo-group-body { box-shadow: 0 -1px 0 var(--hair); }
  .todo-group h3 { margin: 0 14px 6px; display: flex; align-items: center; gap: 10px; }
  .todo-group h3 .n { font-size: 12px; color: var(--faint); font-weight: 500; font-variant-numeric: tabular-nums; }
  .todo-group.now .eyebrow { color: var(--danger); background: var(--danger-soft); }
  .todo-item { display: flex; gap: 14px; align-items: flex-start; padding: 12px 14px; border-radius: 14px;
               transition: background .2s var(--ease); }
  .todo-item + .todo-item { box-shadow: 0 -1px 0 var(--hair); }
  .todo-item:hover { background: var(--hover); }
  .tick { position: relative; flex-shrink: 0; width: 22px; height: 22px; margin-top: 1px; border-radius: 999px; border: 0;
          padding: 0; background: none; box-shadow: inset 0 0 0 1.5px var(--faint); color: var(--cta-ink);
          display: grid; place-items: center; transition: background .2s var(--ease), box-shadow .2s var(--ease),
          transform var(--duration-quick) var(--ease-smooth-out); }
  .tick::after { content: ""; position: absolute; inset: -9px; }
  .tick:hover { box-shadow: inset 0 0 0 1.5px var(--text); }
  .tick:focus-visible { box-shadow: inset 0 0 0 1.5px var(--faint), var(--ring); }
  .tick:focus-visible:hover { box-shadow: inset 0 0 0 1.5px var(--text), var(--ring); }
  .todo-item.done .tick:focus-visible { box-shadow: var(--ring); }
  .tick:active { transform: scale(.96); }
  .tick svg { width: 13px; height: 13px; opacity: 0; transform: scale(.25); filter: blur(4px);
              transition: opacity .2s cubic-bezier(.2, 0, 0, 1), transform .2s cubic-bezier(.2, 0, 0, 1), filter .2s cubic-bezier(.2, 0, 0, 1); }
  .todo-item.done .tick { background: var(--tag-ink); box-shadow: none; }
  .todo-item.done .tick svg { opacity: 1; transform: none; filter: none; }
  .todo-item .what { min-width: 0; flex: 1; }
  .todo-item .title { font-weight: 500; letter-spacing: -.01em; line-height: 1.4; text-wrap: pretty;
                      transition: color .2s var(--ease); }
  .todo-item .why { color: var(--muted); font-size: 13.5px; margin-top: 2px; text-wrap: pretty; }
  .todo-item .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 7px;
                     font-size: 12.5px; color: var(--faint); }
  .todo-item.done .title { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--faint); }
  .todo-item.done .why, .todo-item.done .tags { opacity: .6; }
  /* Editing: drag handle, remove/edit buttons, your own items, the add form. */
  .quiet .todo-sheet { animation: none; }
  .todo-item { position: relative; }
  .todo-item .grip { flex-shrink: 0; width: 16px; height: 24px; margin: 0 -8px 0 -8px; padding: 0; border: 0; border-radius: 6px;
                     background: none; color: var(--faint); display: grid; place-items: center; cursor: grab; touch-action: none;
                     opacity: 0; transition: opacity .15s var(--ease), color .15s var(--ease); }
  .todo-item .grip svg { width: 14px; height: 14px; }
  .todo-item .grip::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 26px; }
  .todo-item:hover .grip, .todo-item .grip:focus-visible { opacity: 1; }

  /* Reminder cards stack (banner stacking): the newest in front, older ones peeking out below; pointing at

  #reminders { position: fixed; top: 16px; right: 24px; z-index: var(--z-toast); width: min(340px, calc(100vw - 32px)); }

  .ghost-btn:active { transform: scale(.96); }

  /* Dragging: the row follows the pointer above everything; a dashed slot shows where it will land. */

  .todo-done { margin: 22px 8px 0; box-shadow: 0 -1px 0 var(--hair); }

  .done-item .tick svg { opacity: 1; transform: none; filter: none; }
  .done-item .tick:focus-visible { box-shadow: var(--ring); }
  /* It's the way back from a tick, so it reacts like a button: a deeper fill and a softer check on hover. */
  .done-item .tick:hover { background: color-mix(in srgb, var(--tag-ink) 80%, var(--text));
                          box-shadow: 0 0 0 4px color-mix(in srgb, var(--tag-ink) 18%, transparent); }
  .done-item .tick svg { transition: opacity .2s var(--ease); }
  .done-item .tick:hover svg { opacity: .85; }
  .todo-removed { margin: 22px 8px 8px; box-shadow: 0 -1px 0 var(--hair); }

  .removed-toggle { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 6px;
                    padding: 10px 14px; border: 0; border-radius: 12px; background: none; color: var(--muted);
                    font-size: 13.5px; font-weight: 500; text-align: left;

                       border-radius: 999px; background: var(--pill); text-align: center; }

  .removed-list { padding: 0 0 4px; }

  .put-back { position: relative; flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px;
              border: 0; border-radius: 10px; background: none; color: var(--muted); font-size: 13px; font-weight: 500;
              transition: background .2s var(--ease), color .2s var(--ease), transform var(--duration-quick) var(--ease-smooth-out); }

               margin-bottom: 18px; }
  #todo .usage { display: block; margin: 10px 4px 0; }
  /* Notes: your notes down the side, the open one beside them. Private to each person. */

  .pill-btn { position: relative; display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 999px;
              padding: 6px 14px; font-size: 13px; font-weight: 600; background: var(--cta); color: var(--cta-ink);

  /* Not ready yet (an empty note): a quiet grey pill with readable text, not a faded black one. */
  .pill-btn:disabled:not(.busy) { background: var(--pill); color: var(--muted); cursor: default; opacity: 1; }

  /* While David cleans up: soft bars where the note goes, then the new note fades in over them

  .note-skel { min-height: 240px; --pulse-count: infinite; }

                background: var(--tag-bg); color: var(--tag-ink); outline: none;

  /* Messages */

  .byline .mark .brand-mark svg { width: 12px; height: 12px; }
  .byline .mark img { height: 20px; max-width: 20px; }
  .answer { line-height: 1.7; font-size: 15.5px; overflow-wrap: anywhere; }
  .answer table { overflow-wrap: normal; }
  .answer > :first-child { margin-top: 0; }
  .answer > :last-child { margin-bottom: 0; }
  .answer > p:first-child { font-size: 22px; font-weight: 600; letter-spacing: -.03em; line-height: 1.32; }
  .answer > p:first-child strong { font-weight: 600; }
  .answer :is(h1, h2, h3, h4), .answer > p:first-child { text-wrap: balance; }
  .answer :is(p, li) { text-wrap: pretty; }
  .answer h1, .answer h2, .answer h3 { font-size: 17px; font-weight: 600; letter-spacing: -.02em; margin: 1.4em 0 .5em; }
  .answer strong { font-weight: 600; }
  .answer ul, .answer ol { padding-left: 1.3em; }
  .answer li { margin: .3em 0; }
  .answer li::marker { color: var(--faint); }
  .answer code { font-family: var(--mono); font-size: .88em; background: var(--pill); padding: 2px 6px; border-radius: 6px; }
  .answer pre { overflow-x: auto; background: var(--pill); box-shadow: inset 0 0 0 1px var(--hair); border-radius: 14px;
                padding: 12px 16px; line-height: 1.55; overflow-wrap: normal; }
  .answer pre code { background: none; padding: 0; font-size: .86em; }
  .answer a { color: var(--tag-ink); }
  /* Tables sit on one pane that scrolls sideways itself when a table is too wide, so the pane always
     covers the whole table. Text wraps, but no column gets narrower than a few words. */
  .answer .bezel { display: inline-block; max-width: 100%; margin: 10px 0 14px; vertical-align: top; }
  .answer .bezel > .core { padding: 4px; border-radius: 22px; max-width: 100%; overflow-x: auto; }
  .answer table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .answer th { text-align: left; font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
               color: var(--faint); border-bottom: 1px solid var(--hair); padding: 12px 18px; }
  .answer td { border-bottom: 1px solid var(--hair); padding: 11px 18px; vertical-align: top; }
  .answer tr:last-child td { border-bottom: 0; }
  .answer th, .answer td { min-width: 6.5em; }
  .answer :is(th, td):first-child { min-width: 9em; }
  .answer :is(th, td).num { text-align: right; white-space: nowrap; min-width: 0; }
  .answer :is(th, td):not(.num) { text-align: left; }
  .answer :is(th, td).short { white-space: nowrap; min-width: 0; }
  .answer :is(th, td).long { min-width: 16em; }
  .ref { font-family: var(--mono); font-size: .82em; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
         background: var(--tag-bg); color: var(--tag-ink); }
  a.ref { text-decoration: none; transition: box-shadow .2s var(--ease); }
  a.ref:hover { box-shadow: inset 0 0 0 1px currentColor; }
  a.ref:focus-visible { outline: none; box-shadow: var(--ring); }

  .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .actions button { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px;
                    background: var(--pill); box-shadow: inset 0 0 0 1px var(--hair); color: var(--muted);
                    font-size: 13px; padding: 6px 12px; position: relative;
                    transition: color .15s, background .15s, transform var(--duration-quick) var(--ease-smooth-out); }
  .actions button:hover { color: var(--text); background: var(--hover); }
  /* Hit areas: small controls get an invisible target of about 40px (without overlapping their
     neighbours), so they're easy to click; nothing looks different. */
  #chats button.menu::after { content: ""; position: absolute; inset: -3px 0; }
  .theme-switch button::after { content: ""; position: absolute; inset: -8px -1px; }
  .chart-tools button::after { content: ""; position: absolute; inset: -6px 0; }
  .actions button::after { content: ""; position: absolute; inset: -4px 0; }
  /* Press feedback: buttons dip to 96% while held. */
  :is(#chats button.menu, .popover button, #logout, .actions button, .chart-tools button, .theme-switch button):active {
    transform: scale(.96); }
  .actions button.copied { color: var(--tag-ink); }
  /* Thumbs: outline by default, filled when chosen. */
  .rate { display: inline-flex; gap: 2px; margin-left: auto; }
  .actions .rate button.thumb { padding: 6px 9px; background: none; box-shadow: none; }
  .actions .rate button.thumb:hover { background: var(--hover); }
  .thumb svg { width: 15px; height: 15px; fill: none; transition: fill var(--duration-quick) var(--ease-smooth-out); }
  .thumb.down svg { transform: scaleY(-1); }
  .thumb[aria-pressed="true"] { color: var(--tag-ink); }
  .thumb[aria-pressed="true"] svg { fill: currentColor; fill-opacity: .18; }
  .note { margin: 16px auto 0; width: 100%; max-width: 520px; padding: 12px; border-radius: 18px; background: var(--core);
          box-shadow: var(--core-hi), var(--ambient); display: flex; flex-direction: column; gap: 8px;
          animation: rise var(--duration-fast) var(--ease-smooth-out); }
  .note label { font-size: 13px; color: var(--muted); }
  .note textarea { font: inherit; font-size: 14px; resize: vertical; min-height: 54px; padding: 9px 12px; border: 0;
                   border-radius: 12px; background: var(--pill); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair); }
  .note textarea:focus { outline: none; box-shadow: inset 0 0 0 1px var(--glass-ring), var(--ring); }
  .note .row { display: flex; justify-content: flex-end; gap: 6px; }
  .note button { font: inherit; font-size: 13px; font-weight: 500; border: 0; border-radius: 999px; padding: 7px 14px;
                 background: var(--pill); color: var(--muted); transition: transform var(--duration-quick) var(--ease-smooth-out); }
  .note button[type="submit"] { background: var(--cta); color: var(--cta-ink); }
  .note button:active { transform: scale(.96); }
  .actions button.copied svg { animation: check-in var(--duration-fast) cubic-bezier(0.2, 0, 0, 1); }
  @keyframes check-in { from { opacity: 0; transform: scale(.25); filter: blur(4px); } }
  .actions svg { width: 14px; height: 14px; }
  .usage { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; padding: 4px 6px 4px 2px; cursor: help; }

  .charts { display: grid; gap: 16px; margin-top: 24px; }
  .chart-card { margin: 0; min-width: 0; }
  .chart-card > .core { padding: 22px 24px 14px; }
  .chart-card h4 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.025em; text-wrap: balance; }
  .chart-card .chart-sub { margin: 6px 0 0; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
  .chart-box { position: relative; margin-top: 12px; }
  .chart-tools { display: flex; gap: 6px; margin-top: 8px; }
  .chart-tools button { position: relative; background: var(--pill); border: 0; color: var(--muted); font-size: 12px;
                        padding: 5px 12px; border-radius: 999px;
                        transition: transform var(--duration-quick) var(--ease-smooth-out); }
  .chart-tools button:hover { color: var(--text); background: var(--hover); }
  .chart-table { width: 100%; margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; border-collapse: collapse; }
  .chart-table th { text-align: left; font-weight: 500; color: var(--faint); border-bottom: 1px solid var(--hair); padding: 6px 12px 6px 0; }
  .chart-table td { border-bottom: 1px solid var(--hair); padding: 6px 12px 6px 0; }
  .chart-table td:not(:first-child), .chart-table th:not(:first-child) { text-align: right; }

  .thinking { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
  .thinking .t-think { min-width: 270px; }  /* a steady width, so the seconds counter doesn't jump at each step */
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--tag-ink); opacity: .3;
            animation: pulse 1.2s infinite var(--ease); }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  .answer.streaming > :is(p, h1, h2, h3, h4):last-child::after,
  .answer.streaming > :is(ul, ol):last-child > li:last-child::after, .answer.streaming:empty::after {
    content: ""; display: inline-block; width: .5em; height: 1.05em; margin-left: 2px; vertical-align: -.15em;
    background: var(--tag-ink); border-radius: 2px; animation: blink 1s steps(2, start) infinite; }
  .elapsed { font-family: var(--mono); font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .msg.error { background: var(--danger-soft); color: var(--danger); padding: 12px 18px; border-radius: 18px; }
  .msg.error button { margin-top: 8px; background: none; border: 1px solid currentColor; color: inherit;
                      border-radius: 999px; padding: 4px 12px; font-size: 13px; }

  /* Question box: a framed island with the model picker and an Ask pill */
  #form { padding: 8px 24px 18px; }
  .composer { border-radius: 26px;
              box-shadow: var(--ambient); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
              transition: box-shadow .2s, border-color .2s; }
  /* No outline when you click in to type: the cursor shows where you are. (Buttons in the box keep theirs.) */
  .composer > .core { display: flex; align-items: flex-end; gap: 10px; padding: 6px 6px 6px 20px; border-radius: 26px; }
  /* Upload (admins and uploaders): a paperclip at the start of the box; a file can also be dropped on the box. */
  .composer > .core:has(.attach:not([hidden])) { padding-left: 6px; gap: 6px; }
  .attach { position: relative; flex-shrink: 0; width: 40px; height: 40px; border: 0; border-radius: 999px; padding: 0;
            display: grid; place-items: center; background: none; color: var(--faint);
            transition: background .2s var(--ease), color .2s var(--ease), transform var(--duration-quick) var(--ease-smooth-out); }
  .attach[hidden] { display: none; }
  /* Paperclip, then a spinner while uploading, then a check: three icons in one spot, cross-faded. */
  .attach svg { grid-area: 1 / 1; width: 17px; height: 17px;
                transition: opacity .2s cubic-bezier(.2, 0, 0, 1), scale .2s cubic-bezier(.2, 0, 0, 1), filter .2s cubic-bezier(.2, 0, 0, 1); }
  .attach .i-spin, .attach .i-check, .attach.busy .i-clip, .attach.done .i-clip {
    opacity: 0; scale: .25; filter: blur(4px); }
  .attach.busy .i-spin, .attach.done .i-check { opacity: 1; scale: 1; filter: none; }
  .attach.busy .i-spin { animation: spin .8s linear infinite; }
  .attach.busy, .attach.done { color: var(--tag-ink); opacity: 1; }
  @keyframes spin { to { rotate: 360deg; } }
  @media (prefers-reduced-motion: reduce) { .attach.busy .i-spin { animation-duration: 2.4s; } }
  .attach:hover { background: var(--hover); color: var(--text); }
  .attach:active { transform: scale(.96); }
  .attach:disabled { cursor: progress; }
  /* A file dragged over the box: a faint tint, the ring, and the placeholder says what dropping does. */
  .composer > .core { transition: background .2s var(--ease); }
  .composer.dropping { box-shadow: var(--ambient), var(--ring); }
  /* Uploaded files stay in the box, as chips, until the next question is sent (or they're taken off). */
  .composer > .core:has(.attached:not([hidden])) { flex-wrap: wrap; }
  /* A hairline keeps the files apart from where you type. */
  .attached { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 8px; margin: 0 4px 2px;
              box-shadow: 0 1px 0 var(--hair); }
  .attached[hidden] { display: none; }
  .file-chip { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 5px 6px 5px 10px;
               border-radius: 12px; background: var(--pill);
               font-size: 12.5px; line-height: 1.3; animation: rise var(--duration-fast) var(--ease-smooth-out) both; }
  .file-chip > svg { flex-shrink: 0; width: 15px; height: 15px; color: var(--tag-ink); }
  .file-chip .name { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip .meta { color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .file-chip .icon-btn { width: 22px; height: 22px; border-radius: 7px; opacity: 0;
                         transition: opacity .15s var(--ease), background .2s var(--ease), color .2s var(--ease); }
  .file-chip:hover .icon-btn, .file-chip:focus-within .icon-btn { opacity: 1; }  /* x shows when you point at the chip */
  @media (hover: none) { .file-chip .icon-btn { opacity: 1; } }
  .file-chip .icon-btn svg { width: 12px; height: 12px; }
  .file-chip.leaving { opacity: 0; transform: translateY(2px); transition: opacity var(--duration-quick) ease-out, transform var(--duration-quick) ease-out; }
  .msg.user .file-chip { margin: 0 0 8px; padding-right: 10px; background: color-mix(in srgb, var(--pill) 70%, transparent); animation: none; }
  .composer.dropping > .core { background: color-mix(in srgb, var(--tag-bg) 60%, transparent); }
  #q { flex: 1; min-width: 0; resize: none; border: 0; background: none; padding: 9px 0; max-height: 200px;
       line-height: 1.5; outline: none; }
  #q:focus-visible { box-shadow: none; }
  #q::placeholder { color: var(--faint); }
  .model-wrap { position: relative; flex-shrink: 0; height: 40px; display: flex; align-items: center; }
  .model-wrap[hidden] { display: none; }
  #model { appearance: none; height: 40px; border: 0; border-radius: 999px; padding: 0 30px 0 14px;
           font-size: 12.5px; font-weight: 500; color: var(--muted); background: var(--pill);
           box-shadow: inset 0 0 0 1px var(--hair); max-width: 240px; text-overflow: ellipsis;
           transition: color .15s, background .15s; }
  #model:hover:not(:disabled), #model:focus-visible { background: var(--hover); color: var(--text); }
  #model:focus-visible { box-shadow: var(--ring); }
  #model:disabled { cursor: default; padding-right: 14px; }
  #model option { background: var(--core); color: var(--text); }
  .model-wrap:has(#model:disabled)::after { display: none; }
  .model-wrap::after { content: ""; position: absolute; right: 14px; top: 50%; width: 5px; height: 5px;
                       border: solid currentColor; color: var(--faint); border-width: 0 1.5px 1.5px 0;
                       transform: translateY(-75%) rotate(45deg); pointer-events: none; }
  #send { flex-shrink: 0; height: 40px; display: inline-flex; align-items: center; gap: 10px; border: 0;
          border-radius: 999px; padding: 0 5px 0 16px; background: var(--cta); color: var(--cta-ink);
          font-weight: 500; font-size: 13.5px; transition: transform .5s var(--spring), opacity .2s; }
  #send:active:not(:disabled) { transform: scale(.96); }
  #send:disabled { opacity: .45; cursor: default; }
  #send .ico { width: 30px; height: 30px; }
  .composer-hint { font-size: 12px; color: var(--faint); margin: 8px 6px 0; display: flex; justify-content: space-between;
                   gap: 16px; white-space: nowrap; }
  .composer-hint span:last-child { overflow: hidden; text-overflow: ellipsis; }
  kbd { font-family: var(--mono); font-size: 11px; border-radius: 6px; padding: 0 5px; background: var(--pill);
        box-shadow: inset 0 0 0 1px var(--hair); }

  /* Notices ("Chat deleted", "Couldn't rename…") rise into the bottom-right corner, away from the
     chat and the question box. Copying confirms on the Copy button itself instead. */
  #toast { position: fixed; right: 24px; bottom: 24px; width: max-content;
           max-width: min(420px, calc(100vw - 48px)); z-index: var(--z-toast);
           display: flex; align-items: center; gap: 7px; background: var(--cta); color: var(--cta-ink);
           padding: 6px 13px 6px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; line-height: 1.4;
           box-shadow: 0 8px 24px -12px rgba(15, 23, 42, .45); pointer-events: none; }
  #toast svg { width: 13px; height: 13px; flex-shrink: 0; }
  #toast.has-action { pointer-events: auto; padding-right: 5px; }
  #toast .toast-label { font-weight: 600; flex-shrink: 0; }
  #toast .toast-detail { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .72; }
  .toast-action { margin-left: 10px; border: 0; border-radius: 999px; padding: 3px 11px; font-weight: 600; font-size: 12.5px;
                  background: color-mix(in srgb, currentColor 16%, transparent); color: inherit;
                  transition: background .2s var(--ease), transform var(--duration-quick) var(--ease-smooth-out); }
  .toast-action:hover { background: color-mix(in srgb, currentColor 26%, transparent); }
  .toast-action:active { transform: scale(.96); }
  .toast-action { position: relative; flex-shrink: 0; }
  /* A hairline between what happened and Undo */
  .toast-action::before { content: ""; position: absolute; left: -6px; top: 3px; bottom: 3px; width: 1px;
                          background: color-mix(in srgb, currentColor 24%, transparent); }
  .toast-action::after { content: ""; position: absolute; inset: -8px -4px; }  /* 40px tall to click */
  .backdrop { display: none; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise-in { from { opacity: 0; transform: translateY(12px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes blink { to { visibility: hidden; } }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }

  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    /* The sidebar becomes a slide-out panel */
    aside { position: fixed; inset: 10px auto 10px 0; margin: 0 0 0 10px; width: min(300px, 84vw); z-index: var(--z-drawer);
            background: var(--core); transform: translateX(calc(-100% - 24px)); transition: transform var(--duration-slow) var(--ease-smooth-out); }
    body.sidebar-open aside { transform: none; }
    body.sidebar-open .backdrop { display: block; position: fixed; inset: 0; z-index: calc(var(--z-drawer) - 1);
                                  background: rgba(4, 6, 12, .5); }
    #toast { left: 0; right: 0; margin: 0 auto; bottom: auto; top: 16px; max-width: calc(100vw - 32px); --toast-distance: -8px; }
    header { padding: 12px 14px 2px; }
    #toggle { display: inline-block; margin-left: 0; }
    #log { padding: 20px 16px 12px; }
    #form { padding: 6px 10px 10px; }
    .composer-hint { display: none; }
    .msg.user { max-width: 90%; }
    .suggestions { grid-template-columns: minmax(0, 1fr); }
    .suggestions button.shell:first-child { grid-row: auto; }
    .suggestions .shell:first-child .core { min-height: 0; gap: 18px; }
    .suggestions .shell:first-child .q { font-size: 21px; }
    #model { max-width: 124px; }
    #send { padding-left: 5px; gap: 0; }
    #send .label { display: none; }
    .answer > p:first-child { font-size: 19px; }
  }
  /* Entrance right after signing in: the background light blooms and settles, the sidebar slides
     in with its chats one after another, the greeting rises word by word (texts reveal, in
     showStart), then the example cards and the question box. The logo doesn't move. */
  @keyframes slide-in { from { opacity: 0; transform: translateX(-16px); filter: blur(6px); }
                        to { opacity: 1; transform: none; filter: none; } }
  @keyframes settle { from { opacity: 0; transform: translateY(12px); filter: blur(3px); }
                      to { opacity: 1; transform: none; filter: none; } }
  @keyframes bloom { from { opacity: .4; transform: scale(1.18); filter: brightness(1.5) saturate(1.4); }
                     to { opacity: 1; transform: none; filter: none; } }
  body.entering .aurora { animation: bloom 1.4s var(--ease-smooth-out) both; }
  body.entering header { animation: settle var(--duration-very-slow) var(--ease-smooth-out) 80ms both; }
  body.entering .suggestions button.shell { animation-delay: calc(260ms + var(--i) * 80ms); }
  body.entering #form { animation: settle var(--duration-very-slow) var(--ease-smooth-out) 420ms both; }
  @media (min-width: 761px) {  /* on phones the sidebar is a hidden drawer, so it stays put */
    body.entering aside { animation: slide-in var(--duration-very-slow) var(--ease-smooth-out) both; }
    body.entering #chats li { animation: settle var(--duration-slow) var(--ease-smooth-out) both;
                              animation-delay: calc(140ms + var(--n, 0) * var(--duration-stagger)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<a class="skip" href="#q">Skip to question box</a>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>
<div class="app">
  <aside aria-label="Your chats">
    <div class="brand">
      <!--brand-mark--><span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none"><path d="M3.5 12V5m4.5 7V8m4.5 4V3.5" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
      </span><!--/brand-mark-->
      <span class="brand-name"><span class="name-line">David
      <a class="icon-link" id="feedback-link" href="/feedback" hidden aria-label="Feedback from users" title="Feedback from users">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3.5h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H8l-3 2.5v-2.5H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M5 6.5h6M5 8.8h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </a>
</span><small>DBS ConnectWise Assistant</small></span>
    </div>
    <button id="new" type="button">
      New chat
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    </button>
    <ul id="chats"></ul>
    <div class="me">
      <button id="me-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="me-menu" title="Theme and sign out">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="who"><span id="me"></span></span>
        <svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5 6.5 8 3.5l3 3M5 9.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="popover t-dropdown" id="me-menu" data-origin="bottom-left" hidden>
        <div class="appearance">
          <div class="theme-switch" role="radiogroup" aria-label="Theme">
            <span class="t-tabs-pill" aria-hidden="true"></span>
            <button type="button" class="t-tab" role="radio" data-choice="light" aria-label="Light" title="Light">

          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6.5 13.5H4a1.5 1.5 0 0 1-1.5-1.5V4A1.5 1.5 0 0 1 4 2.5h2.5M10.5 11l3-3-3-3M13.5 8H6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

      <span class="t-tt-group nav-tips">

        <span class="label">Notes</span>

  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main>
    <header>
      <button id="toggle" type="button" aria-label="Show chats">
        <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <span id="chat-title"></span>
    </header>
    <div id="log"><div class="inner"><div id="messages" aria-live="polite"></div></div></div>

    <form id="form">
      <div class="inner">
        <div class="composer"><div class="core">
          <div class="attached" id="attached" hidden></div>
          <button type="button" class="attach" id="spoton-upload" hidden aria-label="Upload SpotOn data" title="Upload SpotOn data: the zip from the SpotOn Exporter, a .csv or an Excel .xlsx (or drop it here). Kept for 30 days.">
            <svg class="i-clip" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 7.5 8 12.5a3.2 3.2 0 0 1-4.5-4.5l5.3-5.3a2.1 2.1 0 0 1 3 3L6.5 10.9a1 1 0 0 1-1.4-1.4L10 4.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="i-spin" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5" opacity=".25"/><path d="M8 2.5a5.5 5.5 0 0 1 5.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <svg class="i-check" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input type="file" id="spoton-file" accept=".zip,.csv,.xlsx" hidden>
          <label for="q" class="sr-only">Your question</label>
          <textarea id="q" rows="1" placeholder="Ask about a client's tickets or time…"></textarea>
          <span class="model-wrap" id="model-wrap" hidden>
            <select id="model" aria-label="AI model"></select>
          </span>
          <button id="send" aria-label="Ask">
            <span class="label">Ask</span>
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M8 12.5v-9M4 7.5l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
        </div></div>
        <div class="composer-hint">
          <span><kbd>Enter</kbd> to send · <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line</span>
          <span>Live ConnectWise data. Check key numbers before sharing.</span>
        </div>
      </div>
    </form>
  </main>
</div>
<div id="toast" class="t-toast" role="status" aria-live="polite"></div>
<script>
  // Play the entrance once, when arriving straight from the sign-in page.
  try {
    if (sessionStorage.getItem("justSignedIn")) {
      sessionStorage.removeItem("justSignedIn");
      document.body.classList.add("entering");
      setTimeout(() => document.body.classList.remove("entering"), 1600);
    }
  } catch {}
  const $ = (id) => document.getElementById(id);
  const messages = $("messages"), chatList = $("chats"), q = $("q"), send = $("send");
  const modelSelect = $("model"), chatTitle = $("chat-title");
  let conversationId = null;
  let modelInfo = { default: null, models: [] };
  let isAdmin = false;
  let firstName = "";  // for the greeting on the start screen
  let ticketUrl = "";  // opens a ticket in ConnectWise; {id} is replaced with the number
  let busy = false;  // an answer is on its way in the chat on screen
  let view = 0;  // changes whenever another chat is shown, so a finishing answer can't land in the wrong one

  const EXAMPLES = [
    ["Recurring issues", "What are the most common issues in the past 30 days at Jimmy's Grille?"],
    ["Across clients", "Which sites had the most printer or handheld problems this month?"],
    ["Backlog", "Which open tickets at Jimmy's Grille are oldest?"],
  ];
  const ARROW = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const COPY = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5" y="5" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 10.5V4.5A1.5 1.5 0 0 1 4.5 3h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';

  // When the browser can't reach David at all (the server was stopped or restarted, the laptop slept,
  // the network changed) it only says "Failed to fetch" (Edge, Chrome), "NetworkError ..." (Firefox)
  // or "Load failed" (Safari). Say what that means instead.
  const UNREACHABLE = "Couldn't reach David's server. It may have been restarted, or the connection dropped. " +
    "Refresh the page and try again; if it keeps happening, check that David (start-web.bat) is running.";
  const DROPPED = "The connection dropped while David was answering. The answer may still finish: " +
    "open this chat again in a minute to check.";
  function networkFailure(err) {
    return err instanceof TypeError && /fetch|network|load failed|input stream/i.test(err.message);
  }

  // The server's explanation. A rejected field comes back as a list ({loc, msg}), not a sentence.
  function errorText(data, fallback) {
    const detail = data && data.detail;
    if (Array.isArray(detail)) return detail.map((d) => d.msg || String(d)).join("; ") || fallback;
    return (typeof detail === "string" && detail) || fallback;
  }

  async function api(path, options = {}) {
    let res;
    try {
      // keepalive (finish even if the page closes) only works for small bodies: browsers refuse
      // keepalive requests over 64 KB, which would turn a big save into a "can't reach David" error.
      const keepalive = options.keepalive && (options.body || "").length < 60000;
      res = await fetch(path, {
        ...options,
        keepalive,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
      });
    } catch (err) {
      throw networkFailure(err) ? new Error(UNREACHABLE) : err;
    }
    if (res.status === 401) { location.href = "/login"; throw new Error("Signed out"); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(errorText(data, res.statusText));
    return data;
  }

  let toastTimer;
  // action: {label, run}, a button on the toast (e.g. Undo), which then stays up a little longer.
  // detail: a quieter second part on the same line, e.g. the to-do's title after "Done". It's cut short
  // with an ellipsis rather than wrapping; the whole thing is in the tooltip.
  // In a chat, notices rise just above the question box, centered over it, so they never cover Ask.
  // Elsewhere (To Do) and on narrow screens they keep their corner from the stylesheet.
  function placeToast(t) {
    const box = !inTodo() && !matchMedia("(max-width: 760px)").matches && document.querySelector(".composer");
    const r = box && box.getBoundingClientRect();
    if (!r || !r.width) { t.style.cssText = ""; return; }
    Object.assign(t.style, { left: `${r.left}px`, right: `${innerWidth - r.right}px`, margin: "0 auto",
                             bottom: `${innerHeight - r.top + 12}px` });
  }
  function toast(text, action = null, detail = "") {
    const t = $("toast");
    // A check for confirmations ("Answer copied"), nothing for problems ("Couldn't …").
    const ok = !/^(couldn|allow|that didn|error)/i.test(text);
    t.innerHTML = ok ? '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" ' +
      'stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : "";
    const words = document.createElement("span");
    words.className = detail ? "toast-label" : "";
    words.textContent = text;
    t.append(words);
    t.title = detail ? `${text}: ${detail}` : "";
    if (detail) {
      const more = document.createElement("span");
      more.className = "toast-detail";
      more.textContent = detail;
      t.append(more);
    }
    if (action) {
      const b = document.createElement("button");
      b.className = "toast-action"; b.type = "button"; b.textContent = action.label;
      b.onclick = () => { t.classList.remove("is-open", "has-action"); clearTimeout(toastTimer); action.run(); };
      t.append(b);
    }
    t.classList.toggle("has-action", !!action);
    placeToast(t);
    t.classList.add("is-open");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("is-open", "has-action"), action ? 6000 : 2600);
  }

  function renderMarkdown(el, text) {
    el.innerHTML = DOMPurify.sanitize(marked.parse(text));
    // Tables sit in a framed card; ticket numbers like #48211 become small tags.
    for (const table of el.querySelectorAll("table")) {
      const shell = document.createElement("div");
      shell.className = "bezel shell";
      const core = document.createElement("div");
      core.className = "core";
      table.replaceWith(shell);
      shell.appendChild(core);
      core.appendChild(table);
    }
    tagTicketNumbers(el);
    alignNumberColumns(el);
  }

  // While an answer streams in, finished blocks (paragraphs, lists, tables) are drawn once and only the
  // block still being written is redrawn. Redrawing a long answer from scratch each frame took 15 ms or
  // more a time, which made the page stutter on slower PCs.
  function streamDrawer(el) {
    let done = 0;   // characters drawn for good
    let tail = [];  // what the block still being written is drawn as
    const draw = (md) => { const box = document.createElement("div"); renderMarkdown(box, md); return [...box.childNodes]; };
    return (shown) => {
      const text = shown.replace(/\r\n?/g, "\n");
      for (const node of tail) node.remove();
      const rest = text.slice(done);
      const blocks = marked.lexer(rest);
      if (blocks.reduce((n, b) => n + b.raw.length, 0) !== rest.length) {
        // Something that can't be split safely (link definitions, say): draw it all.
        el.replaceChildren(); done = 0; tail = draw(text); el.append(...tail);
        return;
      }
      let last = blocks.length - 1;  // the block being written; trailing blank lines don't count
      while (last > 0 && blocks[last].type === "space") last--;
      const finished = blocks.slice(0, last).reduce((n, b) => n + b.raw.length, 0);
      if (finished) { el.append(...draw(rest.slice(0, finished))); done += finished; }
      tail = draw(rest.slice(finished));
      el.append(...tail);
    };
  }

  // Right-align columns that hold numbers (counts, hours, %, $, ticket numbers); text stays left.
  // Columns of short values (names, dates, ticket numbers) stay on one line; columns of sentences
  // keep a readable width.
  function alignNumberColumns(root) {
    const numeric = /^[-+]?[$£€]?[\d,.]+%?$|^#\d+$|^[-–—]$/;
    for (const table of root.querySelectorAll("table")) {
      const rows = [...table.rows];
      const body = rows.filter((r) => r.parentElement.tagName !== "THEAD");
      const columns = Math.max(0, ...rows.map((r) => r.cells.length));
      for (let c = 0; c < columns; c++) {
        const values = body.map((r) => r.cells[c]?.textContent.trim()).filter(Boolean);
        if (values.length && values.every((v) => v.length <= 24)) {
          for (const r of rows) r.cells[c]?.classList.add("short");
        } else if (values.some((v) => v.length > 60)) {
          for (const r of rows) r.cells[c]?.classList.add("long");  // sentences: keep lines readable
        }
        if (c === 0) continue;
        if (!values.length || !values.every((v) => numeric.test(v.replace(/\s/g, "")))) continue;
        for (const r of rows) r.cells[c]?.classList.add("num");
      }
    }
  }

  function tagTicketNumbers(root) {
    const pattern = /#\d{3,}\b/g;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => n.nodeValue.includes("#") && !n.parentElement.closest("code, pre, a, .ref")
        ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
      const text = node.nodeValue;
      const matches = [...text.matchAll(pattern)];
      if (!matches.length) continue;
      const frag = document.createDocumentFragment();
      let at = 0;
      for (const m of matches) {
        frag.append(text.slice(at, m.index));
        // Ticket numbers open the ticket in ConnectWise. "Project #123" is a project, not a ticket: no link.
        const isProject = /project\s*$/i.test(text.slice(0, m.index));
        const tag = document.createElement(ticketUrl && !isProject ? "a" : "span");
        tag.className = "ref";
        tag.textContent = m[0];
        if (tag.tagName === "A") {
          tag.href = ticketUrl.replace("{id}", m[0].slice(1));
          tag.target = "_blank";
          tag.rel = "noopener";
          tag.title = "Open in ConnectWise";
        }
        frag.append(tag);
        at = m.index + m[0].length;
      }
      frag.append(text.slice(at));
      node.replaceWith(frag);
    }
  }

  // "Claude Sonnet 5.5 (balanced)" -> "Sonnet 5.5"
  function shortModel(id) {
    const label = modelInfo.models.find((m) => m.id === id)?.label || id || "";
    return label.replace(/\s*\(.*\)\s*$/, "").replace(/^Claude\s+/, "");
  }

  // The small line above each answer: David's mark, the model, and (for new answers) how long it took.
  function byline(model, seconds) {
    const line = document.createElement("div");
    line.className = "byline";
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.setAttribute("aria-hidden", "true");
    const brand = document.querySelector("aside .brand-mark");
    if (brand) mark.appendChild(brand.cloneNode(true));
    const label = document.createElement("span");
    label.className = "eyebrow";
    label.textContent = ["David", shortModel(model), seconds ? `${seconds}s` : ""].filter(Boolean).join(" · ");
    line.append(mark, label);
    return line;
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // Clipboard API needs HTTPS; fall back for plain-http intranet use.
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
  }

  // The chat stays scrolled to the newest content as an answer arrives and when it finishes (tables,
  // buttons and charts are added at the end), unless the person scrolls up to read; scrolling back
  // to the bottom turns it back on.
  const log = $("log");
  let following = true;
  let autoTop = 0;  // where we last scrolled to, so the person's own scrolling can be told apart

  function scrollToEnd() {
    following = true;
    log.scrollTo({ top: log.scrollHeight, behavior: "instant" });
    autoTop = log.scrollTop;
  }
  log.addEventListener("scroll", () => {
    if (log.scrollHeight - log.scrollTop - log.clientHeight < 8) following = true;
    else if (log.scrollTop < autoTop - 4) following = false;
    autoTop = Math.min(autoTop, log.scrollTop);
  }, { passive: true });
  // While following, ease down to new content a little each frame rather than jumping.
  const calm = matchMedia("(prefers-reduced-motion: reduce)");
  let glide = 0;
  function glideToEnd() {
    if (glide) return;
    if (calm.matches) { scrollToEnd(); return; }
    const step = () => {
      const gap = log.scrollHeight - log.clientHeight - log.scrollTop;
      if (!following || gap < 1) { glide = 0; return; }
      log.scrollTo({ top: log.scrollTop + Math.max(1, gap * 0.18), behavior: "instant" });
      autoTop = log.scrollTop;
      glide = requestAnimationFrame(step);
    };
    glide = requestAnimationFrame(step);
  }
  // (Not on the start screen: that's read from the top.)
  const keepAtEnd = new ResizeObserver(() => { if (following && !messages.querySelector(".start")) glideToEnd(); });
  keepAtEnd.observe(messages);
  keepAtEnd.observe(log);

  // Whether a file's name already says its restaurant ("Taco Town - Menu Items.csv" for Taco Town).
  const words = (t) => ` ${(t.toLowerCase().match(/[a-z0-9']+/g) || []).join(" ")} `;
  const namesRestaurant = (file, restaurant) => words(file.replace(/\.[a-z0-9]+$/i, "")).includes(words(restaurant));
  const UPLOAD_LINE = /^\[SpotOn upload: ([^\]\n]*)\]\n/;
  function addUser(text) {
    const div = document.createElement("div");
    div.className = "msg user";
    let found;
    while ((found = text.match(UPLOAD_LINE))) {  // files uploaded for this question show as chips
      const [restaurant, ...rest] = found[1].split(" · "), name = rest.join(" · ");
      const own = namesRestaurant(name, restaurant);
      div.append(fileChip(name || restaurant, name && !own ? restaurant : ""), document.createElement("br"));
      text = text.slice(found[0].length);
    }
    div.append(text);
    messages.appendChild(div);
    scrollToEnd();
  }
  const FILE_ICON = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 2.5h5l3 3v8H4v-11Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 2.5v3h3M6.5 9h3M6.5 11h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function fileChip(name, meta, remove) {
    const chip = document.createElement("span");
    chip.className = "file-chip";
    chip.innerHTML = FILE_ICON;
    const label = document.createElement("span"); label.className = "name"; label.textContent = name;
    chip.append(label);
    if (meta) { const m = document.createElement("span"); m.className = "meta"; m.textContent = meta; chip.append(m); }
    chip.title = meta ? `${name} · ${meta}` : name;
    if (remove) chip.append(iconButton(REMOVE, `Take off: ${name}`, remove));
    return chip;
  }

  function fmtTokens(n) {
    return n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
  }

  // Admins see what each answer used: tokens in/out and an estimated cost.
  function usageTag(u) {
    const span = document.createElement("span");
    span.className = "usage";
    const input = u.input_tokens + u.cache_write_tokens + u.cache_read_tokens;
    const cost = u.priced ? ` · ≈ $${u.cost_usd.toFixed(u.cost_usd < 0.1 ? 3 : 2)}` : "";
    span.textContent = `${fmtTokens(input)} in · ${fmtTokens(u.output_tokens)} out${cost}`;
    span.title = [
      `${u.requests} API call${u.requests === 1 ? "" : "s"} to Claude`,
      `Input: ${u.input_tokens.toLocaleString()} new, ${u.cache_read_tokens.toLocaleString()} cached, ` +
        `${u.cache_write_tokens.toLocaleString()} written to cache`,
      `Output (including reasoning): ${u.output_tokens.toLocaleString()}`,
      u.priced ? `Estimated cost: $${u.cost_usd.toFixed(4)}` : "No price known for this model",
      "Only admins see this.",
    ].join("\n");
    return span;
  }

  // ---------- Charts ----------
  // Validated categorical palette (dataviz reference instance), stepped separately for each mode,
  // checked against this page's surfaces. Series take slots in fixed order; never more than 8.
  const CHART_THEMES = {
    light: { surface: "#ffffff", grid: "#eceef2", axis: "#d9dce3", text: "#0b0d12", muted: "#5f636d",
             tooltip: "#ffffff",
             series: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"] },
    dark:  { surface: "#0d0f14", grid: "#1b1e26", axis: "#2a2e38", text: "#ededef", muted: "#9a9ea8",
             tooltip: "#161922",
             series: ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"] },
  };
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const liveCharts = [];  // {spec, canvas, chart} so charts can redraw when the theme changes

  function chartHeight(spec) {
    const legend = spec.series.length > 1 ? 28 : 0;
    return spec.type === "hbar" ? Math.max(140, spec.labels.length * 30 + 50 + legend) : 280 + legend;
  }

  function chartConfig(spec, t, forExport) {
    const horizontal = spec.type === "hbar";
    const stacked = spec.type === "stacked_bar";
    const line = spec.type === "line";
    const many = spec.series.length > 1;
    const datasets = spec.series.map((s, i) => {
      const color = t.series[i % 8];
      if (line) {
        return { label: s.name, data: s.values, borderColor: color, backgroundColor: many ? color : color + "1a",
                 fill: many ? false : "origin", borderWidth: 2, tension: 0, pointRadius: 4, pointHoverRadius: 6,
                 pointBackgroundColor: color, pointBorderColor: t.surface, pointBorderWidth: 2,
                 borderCapStyle: "round", borderJoinStyle: "round" };
      }
      const top = i === spec.series.length - 1;
      return { label: s.name, data: s.values, backgroundColor: color, maxBarThickness: 24,
               borderRadius: stacked && !top ? 0 : 4, borderSkipped: "start",
               // Stacked segments are separated by a 2px gap in the surface color, not a drawn border.
               borderWidth: stacked ? { top: horizontal ? 0 : 2, right: horizontal ? 2 : 0 } : 0,
               borderColor: t.surface, categoryPercentage: 0.8, barPercentage: many && !stacked ? 0.92 : 0.8 };
    });
    const valueAxis = {
      beginAtZero: true, stacked, grid: { color: t.grid, lineWidth: 1, drawTicks: false }, border: { display: false },
      ticks: { color: t.muted, padding: 6, callback: (v) => Number(v).toLocaleString() },
      title: { display: !!spec.y_label, text: spec.y_label, color: t.muted },
    };
    const categoryAxis = {
      stacked, grid: { display: false }, border: { color: t.axis },
      ticks: { color: t.muted, autoSkip: !horizontal, maxRotation: 0 },
      title: { display: !!spec.x_label, text: spec.x_label, color: t.muted },
    };
    return {
      type: line ? "line" : "bar",
      data: { labels: spec.labels, datasets },
      options: {
        indexAxis: horizontal ? "y" : "x",
        responsive: !forExport, maintainAspectRatio: false,
        animation: forExport || reduceMotion.matches ? false : { duration: 300 },
        interaction: line ? { mode: "index", intersect: false } : { mode: "nearest", intersect: true },
        font: { family: getComputedStyle(document.body).fontFamily },
        scales: horizontal ? { x: valueAxis, y: categoryAxis } : { x: categoryAxis, y: valueAxis },
        layout: { padding: labelPadding(spec) },
        plugins: {
          legend: { display: many, position: "top", align: "start",
                    labels: { color: t.muted, usePointStyle: true, boxWidth: 12, boxHeight: 12, padding: 14,
                              // A short stroke for lines, a square for bars, always in the series color.
                              generateLabels: (chart) => chart.data.datasets.map((d, i) => ({
                                text: d.label, datasetIndex: i, hidden: !chart.isDatasetVisible(i),
                                fontColor: t.muted, fillStyle: t.series[i % 8], strokeStyle: t.series[i % 8],
                                lineWidth: line ? 3 : 0, pointStyle: line ? "line" : "rect", rotation: 0,
                              })) } },
          tooltip: { backgroundColor: t.tooltip, titleColor: t.muted, bodyColor: t.text, borderColor: t.grid,
                     borderWidth: 1, padding: 10, usePointStyle: true, boxPadding: 4,
                     callbacks: {
                       labelPointStyle: () => ({ pointStyle: "line", rotation: 0 }),
                       // Values lead, series names follow.
                       label: (ctx) => ` ${Number(ctx.raw).toLocaleString()}  ${many ? ctx.dataset.label : ""}`,
                     } },
        },
      },
      plugins: [{ id: "surface", beforeDraw: (chart) => {
        const { ctx, width, height } = chart;
        ctx.save(); ctx.fillStyle = forExport ? "#ffffff" : t.surface; ctx.fillRect(0, 0, width, height); ctx.restore();
      } }, directLabels(spec, t)],
    };
  }

  // Selective direct labels: each value at the bar tip for a single-series ranking (up to 15 bars),
  // and each series' name at the end of its line for 2-4 lines. Nothing on busier charts.
  const LABEL_FONT = "11px " + getComputedStyle(document.body).fontFamily;
  function labelMode(spec) {
    if ((spec.type === "bar" || spec.type === "hbar") && spec.series.length === 1 && spec.labels.length <= 15) return "tips";
    if (spec.type === "line" && spec.series.length >= 2 && spec.series.length <= 4) return "ends";
    return null;
  }
  function textWidth(text) {
    const ctx = textWidth.ctx || (textWidth.ctx = document.createElement("canvas").getContext("2d"));
    ctx.font = LABEL_FONT;
    return ctx.measureText(text).width;
  }
  function labelPadding(spec) {
    const mode = labelMode(spec);
    if (mode === "tips") {
      const widest = Math.max(0, ...spec.series[0].values.map((v) => v == null ? 0 : textWidth(Number(v).toLocaleString())));
      return spec.type === "hbar" ? { right: Math.ceil(widest) + 8 } : { top: 18 };
    }
    if (mode === "ends") return { right: Math.ceil(Math.max(...spec.series.map((s) => textWidth(s.name)))) + 12 };
    return 0;
  }
  function directLabels(spec, t) {
    const mode = labelMode(spec);
    return { id: "directLabels", afterDatasetsDraw: (chart) => {
      if (!mode) return;
      const { ctx, chartArea } = chart;
      ctx.save();
      ctx.font = LABEL_FONT; ctx.fillStyle = t.muted;
      if (mode === "tips") {
        if (!chart.isDatasetVisible(0)) return ctx.restore();
        chart.getDatasetMeta(0).data.forEach((bar, i) => {
          const value = spec.series[0].values[i];
          if (value == null) return;
          const text = Number(value).toLocaleString();
          if (spec.type === "hbar") {
            ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(text, bar.x + 6, bar.y);
          } else {
            ctx.textAlign = "center"; ctx.textBaseline = "bottom"; ctx.fillText(text, bar.x, bar.y - 4);
          }
        });
      } else {
        // Place each name beside its line's last point, nudged apart so no two overlap.
        const ends = [];
        spec.series.forEach((s, i) => {
          if (!chart.isDatasetVisible(i)) return;
          const points = chart.getDatasetMeta(i).data;
          const last = points[points.length - 1];
          if (last) ends.push({ name: s.name, x: last.x, y: last.y });
        });
        ends.sort((a, b) => a.y - b.y);
        const gap = 14;
        for (let i = 1; i < ends.length; i++) ends[i].y = Math.max(ends[i].y, ends[i - 1].y + gap);
        const overflow = ends.length ? ends[ends.length - 1].y - chartArea.bottom : 0;
        if (overflow > 0) ends.forEach((e) => { e.y -= overflow; });
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ends.forEach((e) => ctx.fillText(e.name, e.x + 8, e.y));
      }
      ctx.restore();
    } };
  }

  function themeName() { return davidTheme.effective(); }

  function drawChart(entry) {
    if (entry.chart) entry.chart.destroy();
    entry.chart = new Chart(entry.canvas, chartConfig(entry.spec, CHART_THEMES[themeName()], false));
  }
  davidTheme.onChange(() => liveCharts.forEach((e) => e.canvas.isConnected && drawChart(e)));

  // Theme switch in the menu under your name: Light / Match system / Dark.
  const themeButtons = document.querySelectorAll(".theme-switch button");
  const themePill = document.querySelector(".theme-switch .t-tabs-pill");
  function showThemeChoice(animate) {
    const choice = davidTheme.get();
    let active = themeButtons[0];
    themeButtons.forEach((b) => {
      b.setAttribute("aria-checked", String(b.dataset.choice === choice));
      if (b.dataset.choice === choice) active = b;
    });
    // First paint and resizes snap into place; clicks slide.
    if (!animate) themePill.style.transition = "none";
    themePill.style.transform = `translateX(${active.offsetLeft}px)`;
    themePill.style.width = `${active.offsetWidth}px`;
    if (!animate) { void themePill.offsetWidth; themePill.style.transition = ""; }
  }
  themeButtons.forEach((b) => { b.onclick = () => { davidTheme.set(b.dataset.choice); showThemeChoice(true); }; });
  requestAnimationFrame(() => showThemeChoice(false));
  addEventListener("resize", () => showThemeChoice(false));

  // A light-theme, fixed-size rendering for PNG downloads and PDF reports.
  function chartImage(spec) {
    const canvas = document.createElement("canvas");
    canvas.width = 1200; canvas.height = Math.round(chartHeight(spec) * 1.8);
    canvas.style.cssText = "position:fixed;left:-99999px;top:0";
    document.body.appendChild(canvas);
    const t = { ...CHART_THEMES.light, surface: "#ffffff" };
    const config = chartConfig(spec, t, true);
    config.options.devicePixelRatio = 1;
    config.options.font = { ...config.options.font, size: 20 };
    const chart = new Chart(canvas, config);
    const url = chart.toBase64Image("image/png");
    chart.destroy(); canvas.remove();
    return url;
  }

  function download(url, filename) {
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function slug(text) { return (text || "chart").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50); }

  function chartTable(spec) {
    const table = document.createElement("table");
    table.className = "chart-table";
    const head = table.insertRow();
    for (const h of [spec.x_label || "", ...spec.series.map((s) => s.name)]) {
      const th = document.createElement("th"); th.textContent = h; head.appendChild(th);
    }
    spec.labels.forEach((label, i) => {
      const row = table.insertRow();
      row.insertCell().textContent = label;
      for (const s of spec.series) row.insertCell().textContent = s.values[i] == null ? "–" : Number(s.values[i]).toLocaleString();
    });
    return table;
  }

  function chartCard(spec) {
    const card = document.createElement("figure");
    card.className = "chart-card shell";
    const inner = document.createElement("div");
    inner.className = "core";
    card.appendChild(inner);
    const title = document.createElement("h4"); title.textContent = spec.title;
    inner.appendChild(title);
    if (spec.subtitle) {
      const sub = document.createElement("p"); sub.className = "chart-sub"; sub.textContent = spec.subtitle;
      inner.appendChild(sub);
    }
    const box = document.createElement("div");
    box.className = "chart-box";
    box.style.height = chartHeight(spec) + "px";
    const canvas = document.createElement("canvas");
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", `${spec.title}. Use "Show table" for the values.`);
    box.appendChild(canvas);
    inner.appendChild(box);
    const tools = document.createElement("div");
    tools.className = "chart-tools";
    const tableBtn = document.createElement("button");
    tableBtn.type = "button"; tableBtn.textContent = "Show table";
    let table = null;
    tableBtn.onclick = () => {
      if (table) { table.remove(); table = null; tableBtn.textContent = "Show table"; return; }
      table = chartTable(spec); inner.appendChild(table); tableBtn.textContent = "Hide table";
    };
    const png = document.createElement("button");
    png.type = "button"; png.textContent = "Download PNG";
    png.onclick = () => download(chartImage(spec), `${slug(spec.title)}.png`);
    tools.append(tableBtn, png);
    inner.appendChild(tools);
    const entry = { spec, canvas, chart: null };
