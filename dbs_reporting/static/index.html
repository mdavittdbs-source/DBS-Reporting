    liveCharts.push(entry);
    requestAnimationFrame(() => drawChart(entry));
    return card;
  }

  // ---------- Exports ----------
  // PDF of just the tables and charts in an answer (not the rest of the chat).
  function printReport(tables, charts) {
    const win = window.open("", "_blank");
    if (!win) { toast("Allow pop-ups for this site to create the PDF."); return; }
    const doc = win.document;
    doc.open();
    doc.write(`<!doctype html><html><head><meta charset="utf-8"><title></title><style>
      body { font: 13px/1.55 "Geist", "Segoe UI", system-ui, sans-serif; color: #1c1b19; margin: 32px 40px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px;
               border-bottom: 2px solid #183e7c; padding-bottom: 12px; margin-bottom: 18px; }
      header img { height: 44px; } header .meta { text-align: right; font-size: 11px; color: #6f6b63; }
      table { border-collapse: collapse; margin: 10px 0; font-variant-numeric: tabular-nums; }
      th { text-align: left; font-weight: 600; border-bottom: 1px solid #cfcbc2; padding: 4px 14px 4px 0; }
      td { border-bottom: 1px solid #e2dfd8; padding: 4px 14px 4px 0; }
      td:not(:first-child), th:not(:first-child) { text-align: right; }
      figure { margin: 18px 0; break-inside: avoid; } figure img { width: 100%; }
      figcaption { font-weight: 600; margin-bottom: 4px; } figcaption span { font-weight: 400; color: #6f6b63; }
      footer { margin-top: 28px; font-size: 10px; color: #9a958b; }
      @page { margin: 14mm; }
    </style></head><body></body></html>`);
    doc.close();
    const title = charts?.[0]?.title || "Report";
    doc.title = `David – ${title}`;
    const header = doc.createElement("header");
    const logo = doc.createElement("img"); logo.src = "/logo"; logo.alt = ""; logo.onerror = () => logo.remove();
    const meta = doc.createElement("div"); meta.className = "meta";
    meta.textContent = `Prepared by David · ${new Date().toLocaleString()}`;
    header.append(logo, meta);
    doc.body.append(header);
    for (const table of tables) doc.body.appendChild(doc.importNode(table, true));
    for (const spec of charts || []) {
      const fig = doc.createElement("figure");
      const cap = doc.createElement("figcaption"); cap.textContent = spec.title;
      if (spec.subtitle) { const sub = doc.createElement("span"); sub.textContent = " · " + spec.subtitle; cap.appendChild(sub); }
      const img = doc.createElement("img"); img.src = chartImage(spec); img.alt = spec.title;
      fig.append(cap, img);
      doc.body.appendChild(fig);
    }
    const footer = doc.createElement("footer");
    footer.textContent = "Generated from live ConnectWise data. Check key numbers before sharing.";
    doc.body.appendChild(footer);
    const go = () => { win.focus(); win.print(); };
    if (logo.isConnected && !logo.complete) { logo.onload = go; logo.onerror = () => { logo.remove(); go(); }; }
    else setTimeout(go, 50);
  }

  function actionButton(label, icon, onclick) {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = icon + label;
    b.onclick = onclick;
    return b;
  }

  const CHECK = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const DOWNLOAD = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5v8m0 0L4.5 7M8 10.5 11.5 7M3 13.5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function addAnswer(text, usage, charts, answerId, model, seconds, feedback) {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.appendChild(byline(model, seconds));
    const answer = document.createElement("div");
    answer.className = "answer";
    renderMarkdown(answer, text);
    const actions = document.createElement("div");
    actions.className = "actions";
    const copy = document.createElement("button");
    copy.type = "button";
    copy.innerHTML = COPY + "Copy";
    // The button itself confirms: its icon and label swap to a check and "Copied" for a moment.
    copy.onclick = async () => {
      await copyText(text);
      clearTimeout(copy._reset);
      copy.classList.add("copied");
      copy.innerHTML = CHECK + "Copied";
      copy._reset = setTimeout(() => { copy.classList.remove("copied"); copy.innerHTML = COPY + "Copy"; }, 1600);
    };
    if (isAdmin && usage) actions.appendChild(usageTag(usage));
    actions.appendChild(copy);
    // Only reports can be downloaded: the answer's tables and charts, never the chat itself.
    const tables = [...answer.querySelectorAll("table")];
    if (tables.length || charts?.length) {
      if (answerId) {
        actions.appendChild(actionButton("Excel", DOWNLOAD, () => download(`/api/answers/${answerId}/export.xlsx`, "")));
      }
      actions.appendChild(actionButton("PDF", DOWNLOAD, () => printReport(tables, charts)));
    }
    div.append(answer);
    if (charts && charts.length && window.Chart) {
      const wrap = document.createElement("div");
      wrap.className = "charts";
      for (const spec of charts) wrap.appendChild(chartCard(spec));
      div.appendChild(wrap);
    }
    div.appendChild(actions);
    if (answerId) feedbackButtons(div, actions, answerId, feedback);
    messages.appendChild(div);
    return div;
  }

  // Thumbs up / down on each answer. A thumbs down asks what was wrong; ratings and notes go to
  // the admins' Feedback page. Clicking the same thumb again takes the rating back.
  const THUMB = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 7.2 7.6 2.4c.9 0 1.6.8 1.4 1.7L8.6 6.2h3.6c.9 0 ' +
    '1.6.9 1.3 1.8l-1.3 4.6c-.2.6-.7 1-1.3 1H5m0-6.4v6.4m0-6.4H3.3c-.5 0-.8.4-.8.8v4.8c0 .4.3.8.8.8H5" ' +
    'stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  function feedbackButtons(msg, actions, answerId, saved) {
    let rating = saved?.rating || 0;
    const group = document.createElement("span");
    group.className = "rate";
    const make = (value, label) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "thumb" + (value < 0 ? " down" : "");
      b.setAttribute("aria-label", label);
      b.title = label;
      b.innerHTML = THUMB;
      b.onclick = () => choose(rating === value ? 0 : value);
      return b;
    };
    const up = make(1, "Good answer"), down = make(-1, "Something's wrong with this answer");
    group.append(up, down);
    actions.appendChild(group);
    const paint = () => {
      up.setAttribute("aria-pressed", String(rating === 1));
      down.setAttribute("aria-pressed", String(rating === -1));
    };
    paint();

    async function send(value, comment = "") {
      await api(`/api/answers/${answerId}/feedback`, { method: "POST", body: JSON.stringify({ rating: value, comment }) });
    }
    async function choose(value) {
      const before = rating;
      rating = value;
      paint();
      msg.querySelector(".note")?.remove();
      try {
        await send(value);
      } catch (err) {
        rating = before; paint();
        toast("Couldn't save your feedback: " + err.message);
        return;
      }
      if (value === -1) askWhy(); else if (value === 1) toast("Thanks for the feedback");
    }
    function askWhy() {
      const note = document.createElement("form");
      note.className = "note";
      note.innerHTML = '<label for="note-' + answerId + '">What was wrong? It goes to your admin with this answer.</label>' +
        '<textarea id="note-' + answerId + '" rows="2" maxlength="2000" ' +
        'placeholder="e.g. the numbers look off, it missed some tickets, wrong client…"></textarea>' +
        '<div class="row"><button type="button" class="skip-note">Skip</button><button type="submit">Send</button></div>';
      const box = note.querySelector("textarea");
      note.querySelector(".skip-note").onclick = () => note.remove();
      note.onsubmit = async (e) => {
        e.preventDefault();
        const comment = box.value.trim();
        if (!comment) { note.remove(); return; }
        try {
          await send(-1, comment);
          note.remove();
          toast("Thanks, your note was sent");
        } catch (err) {
          toast("Couldn't send your note: " + err.message);
        }
      };
      box.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); note.requestSubmit(); }
        if (e.key === "Escape") note.remove();
      });
      msg.appendChild(note);
      box.focus();
    }
  }

  function addThinking(parent = messages) {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.innerHTML = '<div class="thinking"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>' +
      '<span class="t-think" role="status"><span class="t-think-sizer" aria-hidden="true">Thinking…</span>' +
      '<span class="t-think-text" data-text="Thinking…">Thinking…</span></span><span class="elapsed">0s</span></div>';
    parent.appendChild(div);
    if (parent === messages) scrollToEnd();
    const started = Date.now();
    const elapsed = div.querySelector(".elapsed");
    const timer = setInterval(() => { elapsed.textContent = Math.round((Date.now() - started) / 1000) + "s"; }, 1000);
    // Each step ("Pulling tickets…", "Checking the schedule…") shimmers while it runs, then the old
    // line lifts out as the new one rises in (thinking states).
    const box = div.querySelector(".t-think"), sizer = box.querySelector(".t-think-sizer");
    let live = box.querySelector(".t-think-text");
    const css = (name, fallback) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || fallback;
    function setStatus(text) {
      if (text === live.dataset.text) return;
      const swap = css("--think-swap", 150), gap = css("--think-gap", 50);
      const leaving = live;
      leaving.classList.add("is-exit");
      const next = document.createElement("span");
      next.className = "t-think-text is-enter-start";
      next.textContent = text;
      next.dataset.text = text;
      box.appendChild(next);
      sizer.textContent = text;
      live = next;
      setTimeout(() => { void next.offsetWidth; next.classList.remove("is-enter-start"); }, gap);
      setTimeout(() => leaving.remove(), swap + gap);
    }
    return { el: div, stop: () => clearInterval(timer), setStatus };
  }

  function showStart() {
    const start = document.createElement("section");
    start.className = "start t-stagger";
    start.innerHTML = '<div class="eyebrow-row t-stagger-line" style="--line:0"><span class="eyebrow">David · ConnectWise intelligence</span></div>' +
      "<h2></h2>" +
      "<p class=\"t-stagger-line\">Ask anything about our clients: tickets, time, SLAs and projects, answered from live ConnectWise data. " +
      "Follow-up questions keep the context.</p>";
    // The greeting rises in word by word, then the line under it.
    const words = (firstName ? `Hey, ${firstName}` : "Hey there").split(" ");
    const h2 = start.querySelector("h2");
    words.forEach((w, i) => {
      const span = document.createElement("span");
      span.className = "word t-stagger-line";
      span.style.setProperty("--line", i + 1);
      span.textContent = w;
      h2.append(span, i < words.length - 1 ? " " : "");
    });
    start.querySelector("p").style.setProperty("--line", words.length + 1);
    const list = document.createElement("div");
    list.className = "suggestions";
    EXAMPLES.forEach(([kind, text], i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "shell";
      b.style.setProperty("--i", i);
      b.innerHTML = '<span class="core"><span class="eyebrow"></span><span class="q"></span>' +
        `<span class="cta${i ? " ghost" : ""}">${i ? "Try it" : "Ask David"}<span class="ico">${ARROW}</span></span></span>`;
      b.querySelector(".eyebrow").textContent = kind;
      b.querySelector(".q").textContent = text;
      b.onclick = () => ask(text);
      list.appendChild(b);
    });
    start.appendChild(list);
    messages.appendChild(start);
    const reveal = () => requestAnimationFrame(() => start.classList.add("is-shown"));
    if (document.body.classList.contains("entering")) setTimeout(reveal, 140); else reveal();
  }

  function groupLabel(iso) {
    const d = new Date(iso), now = new Date();
    const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((day(now) - day(d)) / 86400000);
    if (diff <= 0) return "Today";
    if (diff === 1) return "Yesterday";
    if (diff < 7) return "Previous 7 days";
    if (diff < 30) return "Previous 30 days";
    return "Older";
  }

  // Chat menus grow from their ⋯ button and close a little faster than they open (menu dropdown).
  function closePopovers() {
    const closeMs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dropdown-close-dur")) || 150;
    chatList.querySelectorAll(".popover:not(.is-closing)").forEach((p) => {
      p.classList.remove("is-open");
      p.classList.add("is-closing");
      setTimeout(() => p.remove(), closeMs);
    });
    chatList.querySelectorAll("button.menu[aria-expanded]").forEach((b) => b.setAttribute("aria-expanded", "false"));
  }

  let chatsRequest = 0;
  async function loadChats() {
    const mine = ++chatsRequest;  // if loads overlap, only the newest one draws the list
    let chats;
    try {
      chats = await api("/api/conversations");
      if (mine !== chatsRequest) return;
    } catch (err) {
      if (mine !== chatsRequest) return;
      chatList.innerHTML = '<li class="empty-list">Couldn\'t load your chats. Refresh to try again.</li>';
      return;
    }
    chatList.innerHTML = "";
    if (!chats.length) {
      chatList.innerHTML = '<li class="empty-list">Your chats will appear here. Questions and answers are logged for admins.</li>';
      return;
    }
    let lastGroup = null;
    for (const c of chats) {
      const label = groupLabel(c.updated_at);
      if (label !== lastGroup) {
        const g = document.createElement("li");
        g.className = "group";
        g.textContent = label;
        chatList.appendChild(g);
        lastGroup = label;
      }
      const li = document.createElement("li");
      li.className = "chat" + (c.id === conversationId ? " active" : "");
      li.style.setProperty("--n", Math.min(chatList.children.length, 10));
      const open = document.createElement("button");
      open.className = "open";
      open.type = "button";
      open.innerHTML = '<span class="title"></span>';
      open.firstChild.textContent = c.title;
      open.title = c.title;
      if (c.id === conversationId) open.setAttribute("aria-current", "true");
      open.onclick = () => openChat(c.id);
      const menu = document.createElement("button");
      menu.className = "menu";
      menu.type = "button";
      menu.setAttribute("aria-label", `Options for ${c.title}`);
      menu.setAttribute("aria-expanded", "false");
      menu.textContent = "⋯";
      menu.onclick = (e) => { e.stopPropagation(); chatMenu(li, menu, c); };
      li.append(open, menu);
      chatList.appendChild(li);
    }
  }

  function chatMenu(li, menuButton, c) {
    const wasOpen = menuButton.getAttribute("aria-expanded") === "true";
    closePopovers();
    closeMeMenu();
    if (wasOpen) return;
    menuButton.setAttribute("aria-expanded", "true");
    const pop = document.createElement("div");
    pop.className = "popover t-dropdown";
    pop.dataset.origin = "top-right";
    pop.onclick = (e) => e.stopPropagation();
    const rename = document.createElement("button");
    rename.type = "button";
    rename.textContent = "Rename";
    rename.onclick = () => { closePopovers(); startRename(li, c); };
    const del = document.createElement("button");
    del.type = "button";
    del.className = "danger";
    del.textContent = "Delete";
    del.onclick = () => {
      pop.innerHTML = "<p>Delete this chat? This can't be undone.</p>";
      const row = document.createElement("div");
      row.className = "row";
      const yes = document.createElement("button");
      yes.type = "button"; yes.className = "danger"; yes.textContent = "Delete";
      const no = document.createElement("button");
      no.type = "button"; no.textContent = "Cancel";
      no.onclick = closePopovers;
      yes.onclick = async () => {
        try {
          await api(`/api/conversations/${c.id}`, { method: "DELETE" });
          toast("Chat deleted");
          if (c.id === conversationId) newChat(); else loadChats();
        } catch (err) {
          toast("Couldn't delete: " + err.message);
        }
      };
      row.append(no, yes);
      pop.appendChild(row);
      yes.focus();
    };
    pop.append(rename, del);
    li.appendChild(pop);
    void pop.offsetWidth;  // start from the pre-open scale
    pop.classList.add("is-open");
    rename.focus();
  }

  function startRename(li, c) {
    const input = document.createElement("input");
    input.className = "rename";
    input.value = c.title;
    input.setAttribute("aria-label", "Chat name");
    li.replaceChildren(input);
    input.focus();
    input.select();
    let done = false;
    const finish = async (save) => {
      if (done) return;
      done = true;
      const title = input.value.trim();
      if (save && title && title !== c.title) {
        try {
          await api(`/api/conversations/${c.id}`, { method: "PATCH", body: JSON.stringify({ title }) });
          if (c.id === conversationId) chatTitle.textContent = title;
        } catch (err) {
          toast("Couldn't rename: " + err.message);
        }
      }
      loadChats();
    };
    input.onkeydown = (e) => {
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    };
    input.onblur = () => finish(true);
  }

  function setModel(model, locked) {
    // Only select models that are still enabled; otherwise show the default.
    if (model && [...modelSelect.options].some((o) => o.value === model)) modelSelect.value = model;
    else if (modelInfo.default) modelSelect.value = modelInfo.default;
    // The picker only shows before the first question: a chat keeps its model, which each answer's
    // byline already names ("David · Sonnet 5.5").
    modelSelect.disabled = locked;
    $("model-wrap").hidden = locked || modelInfo.models.length < 2;
    modelSelect.title = "Model for this chat. It can't be changed after the first question.";
  }

  // Empty the conversation view, freeing its charts.
  function clearMessages() {
    view++;
    // An answer still on its way in the chat being left keeps going in the background (it's saved and a
    // note says where), so questions can be asked here meanwhile.
    busy = false;
    updateSend();
    for (const entry of liveCharts) entry.chart?.destroy();
    liveCharts.length = 0;
    messages.innerHTML = "";
    log.scrollTop = 0;
  }

  function newChat() {
    leaveTodo();
    leaveNotes();
    conversationId = null;
    clearMessages();
    chatTitle.textContent = "";  // a new chat has no title until its first answer
    setModel(modelInfo.default, false);
    showStart();
    closeDrawer();
    loadChats();
    q.focus();
  }

  async function openChat(id) {
    closeDrawer();
    leaveTodo();
    leaveNotes();
    try {
      const chat = await api(`/api/conversations/${id}`);
      conversationId = chat.id;
      chatTitle.textContent = chat.title;
      setModel(chat.model, true);
      clearMessages();
      for (const t of chat.turns) {
        if (t.role === "user") addUser(t.text);
        else addAnswer(t.text, t.usage, t.charts, t.id, t.model || chat.model, undefined, t.feedback);
      }
      scrollToEnd();
      loadChats();
    } catch (err) {
      toast("Couldn't open that chat: " + err.message);
    }
  }

  // Reads the server's one-JSON-event-per-line stream and calls onEvent for each.
  async function readEvents(response, onEvent) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
      let newline;
      while ((newline = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, newline).trim();
        buffer = buffer.slice(newline + 1);
        if (line) onEvent(JSON.parse(line));
      }
      if (done) return;
    }
  }

  async function ask(question) {
    if (busy) return;
    busy = true;
    updateSend();
    const askedIn = view;
    const shown = () => view === askedIn;  // false once the person has opened another chat
    messages.querySelector(".start")?.remove();
    addUser(question);
    const startsChat = !conversationId;
    if (startsChat) $("model-wrap").hidden = true;
    const thinking = addThinking();
    const askedAt = Date.now();
    let streamed = null;   // the answer element while text is arriving
    let drawStreamed = null;
    let text = "";         // everything received so far
    let shownLen = 0;      // how much of it is on screen
    let frame = 0;
    let drained = null;
    let restUntil = 0;     // after a slow redraw, the next waits a little so the page stays responsive
    // Text arrives in bursts. Show it at a steady pace instead, a few words each frame, going faster
    // the further behind it is so it never lags much.
    const render = (now) => {
      frame = 0;
      if (!streamed) return;
      if (shownLen < text.length && !(now < restUntil)) {
        const next = shownLen + Math.max(3, Math.ceil((text.length - shownLen) / 12));
        const wordEnd = text.slice(next).search(/\s/);
        shownLen = wordEnd < 0 ? text.length : next + wordEnd;
        const began = performance.now();
        drawStreamed(text.slice(0, shownLen));
        const took = performance.now() - began;
        restUntil = took > 8 ? began + took * 3 : 0;  // a big table still being written: redraw less often
      }
      if (shownLen < text.length) frame = requestAnimationFrame(render);
      else if (drained) drained();
    };
    // Waits for the last of the text to be shown (at most a second and a half).
    const drain = () => new Promise((done) => {
      if (!streamed || shownLen >= text.length) return done();
      drained = done;
      setTimeout(done, 1500);
      if (!frame) frame = requestAnimationFrame(render);
    });
    const dropStreamed = () => {
      if (frame) { cancelAnimationFrame(frame); frame = 0; }
      text = "";
      shownLen = 0;
      if (streamed) { streamed.parentElement.remove(); streamed = null; }
      thinking.el.hidden = false;
    };
    let reached = false;  // whether David got the question (then an answer may still be saved)
    try {
      const response = await fetch("/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, conversation_id: conversationId, model: modelSelect.value || null }),
      });
      if (response.status === 401) { location.href = "/login"; return; }
      reached = true;
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(errorText(data, response.statusText));
      }
      let result = null;
      await readEvents(response, (event) => {
        if (event.type === "error") throw new Error(event.message);
        if (event.type === "done") { result = event; return; }
        if (!shown()) return;  // keep reading so the answer finishes and is saved
        if (event.type === "status") {
          thinking.setStatus(event.text);
        } else if (event.type === "reset") {
          dropStreamed();  // a new step started; earlier partial text was a preamble, not the answer
        } else if (event.type === "text") {
          if (!streamed) {
            const wrap = document.createElement("div");
            wrap.className = "msg bot";
            wrap.appendChild(byline(modelSelect.value));
            streamed = document.createElement("div");
            streamed.className = "answer streaming";
            drawStreamed = streamDrawer(streamed);
            wrap.appendChild(streamed);
            messages.insertBefore(wrap, thinking.el);
            thinking.el.hidden = true;
          }
          text += event.text;
          if (!frame) frame = requestAnimationFrame(render);
        }
      });
      if (!result) throw new Error("The connection was lost before the answer finished.");
      if (shown()) await drain();
      if (frame) cancelAnimationFrame(frame);
      thinking.stop();
      if (!shown()) {
        // Reopened this same chat meanwhile: reload it to show the answer. Otherwise just say where it went.
        if (result.conversation_id === conversationId) { openChat(conversationId); return; }
        toast(`Answer saved in “${result.title}”`);
        loadChats();
        return;
      }
      thinking.el.remove();
      if (streamed) streamed.parentElement.remove();
      addAnswer(result.answer, result.usage, result.charts, result.answer_id, result.model,
                Math.max(1, Math.round((Date.now() - askedAt) / 1000)));
      if (!conversationId) {
        chatTitle.textContent = result.title;
        setModel(result.model, true);
      }
      conversationId = result.conversation_id;
      loadChats();
    } catch (err) {
      if (frame) cancelAnimationFrame(frame);
      thinking.stop();
      const why = networkFailure(err) ? (reached ? DROPPED : UNREACHABLE) : err.message;
      if (!shown()) { toast("That answer didn't go through: " + why); return; }
      if (startsChat && !conversationId) setModel(modelSelect.value, false);  // nothing was saved: still a new chat
      if (streamed) streamed.parentElement.remove();
      thinking.el.hidden = false;
      thinking.el.className = "msg error";
      thinking.el.textContent = "That didn't go through: " + why;
      const retry = document.createElement("button");
      retry.type = "button";
      retry.textContent = "Try again";
      retry.onclick = () => { thinking.el.previousElementSibling?.remove(); thinking.el.remove(); ask(question); };
      thinking.el.appendChild(document.createElement("br"));
      thinking.el.appendChild(retry);
    } finally {
      if (shown()) {
        busy = false;
        updateSend();
        q.focus();
      }
    }
  }

  // ---------- To Do tab ----------
  // David turns your open ConnectWise tickets and next 7 days of calendar into a list: now, today, this
  // week, later. Ticks are saved, so the list keeps your progress until you make a new one.
  const todoTab = $("todo-tab"), todoBox = $("todo-inner");
  const TODO_GROUPS = [["now", "Now"], ["today", "Today"], ["this_week", "This week"], ["later", "Later"]];
  const REFRESH = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const TICK = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const GRIP = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="6" cy="3.5" r="1.2"/><circle cx="10" cy="3.5" r="1.2"/><circle cx="6" cy="8" r="1.2"/><circle cx="10" cy="8" r="1.2"/><circle cx="6" cy="12.5" r="1.2"/><circle cx="10" cy="12.5" r="1.2"/></svg>';
  const CLOCK = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v3l2 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const BELL = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 11.5V7.5a4 4 0 0 1 8 0v4l1 1H3l1-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.5 14.5h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  const TRASH = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.1a1 1 0 0 0 1 .9h3.8a1 1 0 0 0 1-.9l.6-8.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const TOGGLE = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path class="v" d="M8 3.5v9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  const RESTORE = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 4.5 3.5 7 6 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 7h6a3 3 0 0 1 0 6H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  const PLUS = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  const EDIT = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10.5 3 13 5.5 6 12.5H3.5V10L10.5 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  const REMOVE = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  let todoState = null;   // {list, done, created_at, usage}, as the server sends it
  let todoMaking = false;
  const make = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // Notes and To Do slide into place when opened (panel reveal); leaving is instant, since the next view
  // takes their place.
  function revealView(section) {
    if (!section.hidden) return;  // already showing
    section.hidden = false;
    section.dataset.open = "false";
    void section.offsetWidth;
    section.dataset.open = "true";
  }
  function inTodo() { return document.body.classList.contains("todo-view"); }
  function showTodo() {
    leaveNotes();
    document.body.classList.add("todo-view");
    revealView($("todo"));
    todoTab.setAttribute("aria-current", "page");
    chatTitle.textContent = "";  // the page says what it is; no title in the corner
    chatList.querySelectorAll("li.chat.active").forEach((li) => li.classList.remove("active"));
    if (location.hash !== "#todo") history.replaceState(null, "", "#todo");
    closeDrawer();
    if (!todoMaking) todoState ? drawTodo() : loadTodo();
  }
  function leaveTodo() {
    if (!inTodo()) return;
    document.body.classList.remove("todo-view");
    $("todo").hidden = true;
    todoTab.removeAttribute("aria-current");
    history.replaceState(null, "", location.pathname);
  }
  async function loadTodo(quiet = false) {
    try {
      todoState = await api("/api/todo");
    } catch (err) {
      if (quiet) return;  // keep showing what's there
      todoState = null;
      if (inTodo()) { todoBox.replaceChildren(make("p", "todo-note", "Couldn't load your list: " + err.message)); }
      return;
    }
    if (inTodo()) drawTodo(null, quiet);
  }

  // The 7 days a list covers, from the day it was made: "Mon 10/05 – Sun 10/11".
  function listDates(iso) {
    const day = (d) => d.toLocaleDateString("en-US", { weekday: "short", month: "2-digit", day: "2-digit",
      timeZone: "America/New_York" }).replace(",", "");
    const start = new Date(iso);
    return `${day(start)} – ${day(new Date(start.getTime() + 6 * 864e5))}`;
  }

  function eastern(iso) {
    return new Date(iso).toLocaleString("en-US", { weekday: "short", month: "2-digit", day: "2-digit",
      hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }).replace(",", "") + " ET";
  }

  function todoButton(label, icon = REFRESH) {
    const b = make("button", "cta");
    b.type = "button";
    b.innerHTML = `<span></span><span class="ico">${icon}</span>`;
    b.firstChild.textContent = label;
    b.onclick = makeTodo;
    b.disabled = todoMaking;
    return b;
  }

  // ----- Drawing the list -----
  // Every group is always shown once there's a list, so items can be added to or dragged into an empty one.
  // `quiet` redraws (after undo, or a failed save) skip the cards' entrance and keep the scroll position.
  function drawTodo(problem, quiet = false) {
    const scroller = $("todo"), scrollTop = scroller.scrollTop;
    todoBox.replaceChildren();
    todoBox.classList.toggle("quiet", quiet);
    const list = todoState?.list;
    if (!list) {  // first visit: what this is, and the button
      const start = make("section", "todo-empty todo-head");
      const pill = make("div"); pill.append(make("span", "eyebrow", "To Do"));
      start.append(pill, make("h2", null, firstName ? `${firstName}, let's plan your week` : "Plan your week"),
        make("p", null, "David looks at your open ConnectWise tickets, your project work and your calendar for the next " +
          "7 days, and puts them in order: what to do now, today, this week and later."));
      if (problem) start.append(make("p", "todo-note", problem));
      const bar = make("div", "todo-bar"); bar.append(todoButton("Make my list", ARROW));
      start.append(bar);
      todoBox.append(start);
      return;
    }
    const head = make("section", "todo-head");
    const pill = make("div"); pill.append(make("span", "eyebrow", listDates(todoState.created_at)));
    head.append(pill, make("h2", null, firstName ? `${firstName}, here's your week` : "Your to-do list"),
                make("p", null, list.summary || "Your own to-dos. Make a list to add your ConnectWise tickets and calendar."));
    const bar = make("div", "todo-bar");
    bar.append(todoButton("Make a new list"), make("span", "meta"));
    const progress = make("div", "progress"); progress.setAttribute("aria-hidden", "true");
    progress.append(make("i")); bar.append(progress);
    head.append(bar);
    if (problem) head.append(make("p", "todo-note", problem));
    todoBox.append(head);
    // One card for the whole list; the groups are sections in it, split by hairlines.
    const sheet = make("div", "shell todo-sheet"), sheetCore = make("div", "core");
    sheet.append(sheetCore);
    todoBox.append(sheet);
    for (const [key, label] of TODO_GROUPS) {
      const card = make("section", `todo-group ${key}`);
      card.dataset.key = key;
      const core = make("div", "todo-group-body");
      const h3 = make("h3"); h3.append(make("span", "eyebrow", label), make("span", "n"));
      const rows = make("div", "todo-rows");
      for (const item of list.items.filter((it) => it.priority === key && !isDone(it.id))) rows.append(todoItem(item));
      const none = make("p", "todo-none");
      core.append(h3, rows, none, addButton(key));
      card.append(core);
      sheetCore.append(card);
    }
    todoBox.append(make("section", "todo-done"), make("section", "todo-removed"));
    drawDone();
    drawRemoved();
    todoBox.append(make("span", "sr-only todo-live"));
    todoBox.lastChild.setAttribute("aria-live", "polite");
    if (isAdmin && todoState.usage) todoBox.append(usageTag(todoState.usage));
    refreshTodo();
    scroller.scrollTop = quiet ? scrollTop : 0;
  }

  const todoById = (id) => todoState.list.items.find((it) => it.id === id);
  const isDone = (id) => todoState.done.includes(id);

  function todoItem(item) {
    const done = isDone(item.id);
    const row = make("div", "todo-item" + (done ? " done" : "") + (item.mine ? " mine" : ""));
    row.dataset.id = item.id;
    const grip = make("button", "grip");
    grip.type = "button";
    grip.innerHTML = GRIP;
    grip.setAttribute("aria-label", `Move: ${item.title}. Use the up and down arrows.`);
    grip.title = "Drag to move";
    grip.onpointerdown = (e) => startDrag(e, row);
    grip.onkeydown = (e) => moveByKey(e, row);
    const tick = make("button", "tick");
    tick.type = "button";
    tick.innerHTML = TICK;
    tick.setAttribute("aria-pressed", String(done));
    tick.setAttribute("aria-label", `Done: ${item.title}`);
    tick.onclick = () => setTodoDone(item.id, !isDone(item.id));
    const what = make("div", "what");
    what.append(make("div", "title", item.title));
    if (item.why) what.append(make("div", "why", item.why));
    const tags = make("div", "tags");
    if (item.ticket) {
      const ref = make(ticketUrl ? "a" : "span", "ref", `#${item.ticket}`);
      if (ticketUrl) { ref.href = ticketUrl.replace("{id}", item.ticket); ref.target = "_blank"; ref.rel = "noopener"; ref.title = "Open in ConnectWise"; }
      tags.append(ref);
    }
    if (item.client) tags.append(make("span", null, item.client));
    if (item.when) tags.append(whenPill(item.when));
    if (item.remind_at) tags.append(remindPill(item));
    if (item.mine) tags.append(make("span", "mine-tag", "Added by you"));
    if (tags.childNodes.length) what.append(tags);
    const actions = make("div", "todo-actions");
    const bell = iconButton(BELL, `Remind me: ${item.title}`, (e) => openRemindPop(e, bell, item.id));
    bell.classList.add("remind-btn");
    if (!item.remind_at) actions.append(bell);  // with a reminder, its time is the button
    if (item.mine) actions.append(iconButton(EDIT, `Edit: ${item.title}`, () => editTodo(row)));
    actions.append(iconButton(REMOVE, `Remove: ${item.title}`, () => removeTodo(row)));
    row.append(grip, tick, what, actions);
    return row;
  }

  // "Tue 10/06/2026 8:30 AM" -> "Tue 8:30 AM": a list only covers 7 days, so the weekday is enough.
  function whenPill(when) {
    const pill = make("span", "when-pill");
    pill.innerHTML = CLOCK;
    const short = when.match(/^(\w{3}) \d{1,2}\/\d{1,2}\/\d{4} (.+)$/);
    pill.append(short ? `${short[1]} ${short[2]}` : when);
    pill.title = when;
    return pill;
  }

  function iconButton(svg, label, onclick) {
    const b = make("button", "icon-btn");
    b.type = "button"; b.innerHTML = svg; b.title = label.split(":")[0]; b.setAttribute("aria-label", label);
    b.onclick = onclick;
    return b;
  }

  // Counts, empty-group hints, "N of M done" and the bar, from the list as it stands.
  function refreshTodo() {
    const items = todoState.list.items;
    const doneCount = items.filter((it) => isDone(it.id)).length;
    const meta = todoBox.querySelector(".todo-bar .meta");
    if (meta) {
      // The done count rolls to its new value when you tick something off (number pop-in).
      const before = meta.dataset.done;
      meta.textContent = `Made ${eastern(todoState.created_at)} · `;
      const digits = make("span", "t-digit-group");
      const chars = String(doneCount).split("");
      chars.forEach((ch, i) => {
        const d = make("span", "t-digit", ch);
        if (chars.length > 1 && i === chars.length - 1) d.dataset.stagger = "1";
        digits.append(d);
      });
      meta.append(digits, ` of ${items.length} done`);
      if (before !== undefined && before !== String(doneCount)) { void digits.offsetWidth; digits.classList.add("is-animating"); }
      meta.dataset.done = String(doneCount);
    }
    const fill = todoBox.querySelector(".progress i");
    if (fill) fill.style.width = items.length ? `${(100 * doneCount) / items.length}%` : "0";
    for (const card of todoBox.querySelectorAll(".todo-group")) {
      const inGroup = items.filter((it) => it.priority === card.dataset.key);
      const left = inGroup.filter((it) => !isDone(it.id)).length;
      card.querySelector("h3 .n").textContent = !inGroup.length ? "" : left ? `${left} to do` : "All done";
      card.classList.toggle("empty", !card.querySelector(".todo-rows").children.length);
      card.querySelector(".todo-none").textContent = inGroup.length && !left
        ? "All done here." : "Nothing here. Drag a to-do in, or add one.";
    }
  }

  function announce(text) { const live = todoBox.querySelector(".todo-live"); if (live) live.textContent = text; }

  // ----- Reminders -----
  // Any to-do can have a time. When it comes, David pops up a card (and a desktop notification if the
  // browser allows them). The page asks David every half minute; each reminder goes off once.
  const dayStart = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  // "Today 2:00 PM", "Tomorrow 9:00 AM", "Fri 9:00 AM", "Mon 10/19 9:00 AM", in your own time zone.
  function remindLabel(iso) {
    const d = new Date(iso), days = Math.round((dayStart(d) - dayStart(new Date())) / 864e5);
    const time = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    if (days === 0) return `Today ${time}`;
    if (days === 1) return `Tomorrow ${time}`;
    if (days === -1) return `Yesterday ${time}`;
    if (days > 1 && days < 7) return `${d.toLocaleDateString("en-US", { weekday: "short" })} ${time}`;
    return `${d.toLocaleDateString("en-US", { weekday: "short", month: "numeric", day: "numeric" }).replace(",", "")} ${time}`;
  }
  function remindPill(item) {
    const pill = make("button", "remind-pill" + (item.reminded ? " due" : ""));
    pill.type = "button";
    pill.innerHTML = BELL;
    pill.append(remindLabel(item.remind_at));
    pill.setAttribute("aria-label", `Reminder ${remindLabel(item.remind_at)}: ${item.title}. Change it.`);
    pill.title = item.reminded ? "Reminder went off. Click to change it." : "Reminder. Click to change it.";
    pill.onclick = (e) => openRemindPop(e, pill, item.id);
    return pill;
  }
  // Quick picks, each skipped when it would be in the past or the same as another.
  function remindPicks() {
    const now = new Date(), at = (days, h) => { const d = new Date(now); d.setDate(d.getDate() + days); d.setHours(h, 0, 0, 0); return d; };
    const hour = new Date(Math.ceil((now.getTime() + 36e5) / 3e5) * 3e5);  // an hour from now, to the next 5 minutes
    const monday = at((8 - now.getDay()) % 7 || 7, 9);
    const picks = [["In 1 hour", hour]];
    if (now.getHours() < 15) picks.push(["Later today", at(0, 16)]);
    picks.push(["Tomorrow morning", at(1, 9)]);
    if (monday.getTime() !== at(1, 9).getTime()) picks.push(["Next Monday", monday]);
    return picks;
  }
  const localInput = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
  function askToNotify() {  // asked on the first reminder you set, while you're clicking (browsers require that)
    if (notifyState() === "default")
      Notification.requestPermission().then((answer) => { if (answer === "granted") setupPush(); }).catch(() => {});
  }

  // Push: this browser gets reminders from David even when no David tab is open (see push.py and sw.js).
  let pushOn = false;
  const keyBytes = (b64) => Uint8Array.from(atob(b64.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  async function setupPush() {
    if (notifyState() !== "granted" || !("serviceWorker" in navigator) || !("PushManager" in window)) return;
    try {
      const { key } = await api("/api/push/key");
      if (!key) return;  // not set up on the server
      const reg = await navigator.serviceWorker.register("/sw.js");
      await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      const current = sub?.options.applicationServerKey;
      if (sub && current && btoa(String.fromCharCode(...new Uint8Array(current))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") !== key) {
        await sub.unsubscribe();  // made with an older server key
        sub = null;
      }
      sub ||= await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(key) });
      await api("/api/push/subscribe", { method: "POST", body: JSON.stringify(sub.toJSON()) });
      pushOn = true;
    } catch (err) {
      console.warn("Reminder pop-ups with David closed aren't available:", err);
    }
  }
  navigator.serviceWorker?.addEventListener("message", ({ data }) => {
    if (data?.reminder) showReminder(data.reminder);
    if (data?.open === "todo") showTodo();
    if (data?.refresh) {
      dismissReminder($("reminders")?.querySelector(`.reminder[data-id="${data.item}"]`));
      if (todoState) loadTodo(true);
    }
  });

  // Windows pop-ups (desktop notifications): whether they can show, and how to turn them on if not.
  function notifyState() {
    if (!("Notification" in window) || !window.isSecureContext) return "unavailable";
    return Notification.permission;  // "granted", "denied" or "default" (not asked yet)
  }
  function windowsHint(onGranted) {
    const state = notifyState();
    if (state === "granted") return null;
    const p = make("p", "hint");
    if (state === "unavailable") {
      p.textContent = "Windows pop-ups only work when David is opened as localhost on the PC running it, or over " +
        "HTTPS. Reminders still pop up here while David is open.";
    } else if (state === "denied") {
      p.textContent = "Windows pop-ups are blocked for David. Click the icon left of the address bar, set " +
        "Notifications to Allow, then reload.";
    } else {
      const b = make("button", "linkish", "Turn on Windows pop-ups");
      b.type = "button";
      b.onclick = async () => {
        const answer = await Notification.requestPermission().catch(() => "default");
        if (answer === "granted") { toast("Windows pop-ups are on"); onGranted(); setupPush(); }
        else { p.replaceWith(windowsHint(onGranted) || ""); }
      };
      p.append(b, make("span", null, " so reminders show even when David is in the background."));
    }
    return p;
  }

  let remindPop = null;
  function closeRemindPop(refocus = false) {
    if (!remindPop) return;
    const { pop, anchor } = remindPop;
    remindPop = null;
    anchor.setAttribute("aria-expanded", "false");
    pop.classList.replace("is-open", "is-closing");
    setTimeout(() => pop.remove(), 150);
    if (refocus && anchor.isConnected) anchor.focus();
  }
  function openRemindPop(e, anchor, id) {
    e.stopPropagation();
    const again = remindPop?.anchor === anchor;
    closePopovers(); closeMeMenu(); closeRemindPop();
    const item = todoById(id);
    if (again || !item) return;
    const pop = make("div", "popover t-dropdown remind-pop");
    pop.setAttribute("role", "dialog");
    pop.setAttribute("aria-label", `Remind me: ${item.title}`);
    pop.onclick = (ev) => ev.stopPropagation();
    pop.append(make("div", "eyebrow-row", "Remind me"));
    const choose = (d) => { askToNotify(); closeRemindPop(); setReminder(id, d ? d.toISOString() : null); };
    for (const [label, d] of remindPicks()) {
      const b = make("button", "pick");
      b.type = "button";
      b.append(label, make("span", null, remindLabel(d.toISOString()).replace(/^(Today|Tomorrow) /, "")));
      b.onclick = () => choose(d);
      pop.append(b);
    }
    const custom = make("form", "custom");
    custom.noValidate = true;  // a past or empty time gets the shake below, not the browser's own bubble
    const input = make("input");
    input.type = "datetime-local";
    input.required = true;
    input.setAttribute("aria-label", "Date and time");
    input.classList.add("t-input");
    input.oninput = () => { input.classList.remove("is-error"); input.removeAttribute("aria-invalid"); custom.nextElementSibling?.classList.contains("err") && custom.nextElementSibling.remove(); };
    input.addEventListener("animationend", () => input.classList.remove("is-shaking"));
    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1); tomorrow.setHours(9, 0, 0, 0);
    input.value = localInput(item.remind_at ? new Date(item.remind_at) : tomorrow);
    input.min = localInput(new Date());
    const set = make("button", null, "Set"); set.type = "submit";
    custom.append(input, set);
    custom.onsubmit = (ev) => {
      ev.preventDefault();
      const d = new Date(input.value);
      if (isNaN(d) || d < new Date()) {  // the date box shakes and says why (error state shake)
        input.classList.remove("is-shaking");
        void input.offsetWidth;
        input.classList.add("is-shaking", "is-error");
        input.setAttribute("aria-invalid", "true");
        if (!custom.nextElementSibling?.classList.contains("err")) custom.after(make("p", "hint err", "Pick a time that hasn't passed yet."));
        return;
      }
      choose(d);
    };
    pop.append(custom);
    if (item.remind_at) {
      const off = make("button", "danger", "Remove reminder");
      off.type = "button";
      off.onclick = () => choose(null);
      pop.append(off);
    }
    const hint = windowsHint(() => { hint?.remove(); });
    if (hint) pop.append(hint);
    document.body.append(pop);
    // Under the button, lined up with its right edge; above it when there's no room below.
    const r = anchor.getBoundingClientRect(), h = pop.offsetHeight, w = pop.offsetWidth;
    const below = r.bottom + 6 + h < innerHeight - 8;
    pop.style.left = `${Math.max(8, Math.min(r.right - w, innerWidth - w - 8))}px`;
    pop.style.top = `${below ? r.bottom + 6 : Math.max(8, r.top - 6 - h)}px`;
    pop.dataset.origin = below ? "top-right" : "bottom-right";
    anchor.setAttribute("aria-expanded", "true");
    remindPop = { pop, anchor };
    void pop.offsetWidth;
    pop.classList.add("is-open");
    pop.querySelector("button").focus();
    pop.onkeydown = (ev) => { if (ev.key === "Escape") { ev.stopPropagation(); closeRemindPop(true); } };
  }
  $("todo").addEventListener("scroll", () => closeRemindPop(), { passive: true });

  // Redraw one row after its reminder changes, keeping focus on its bell.
  function redrawRow(id) {
    const row = todoBox.querySelector(`.todo-rows > .todo-item[data-id="${id}"]`), item = todoById(id);
    if (!row || !item) return;
    const hadFocus = row.contains(document.activeElement) || remindPop?.anchor && row.contains(remindPop.anchor);
    const fresh = todoItem(item);
    row.replaceWith(fresh);
    if (hadFocus) fresh.querySelector(".remind-pill, .remind-btn").focus({ preventScroll: true });
  }
  async function setReminder(id, at) {
    const item = todoState?.list ? todoById(id) : null;
    const before = item && { remind_at: item.remind_at, reminded: item.reminded };
    const apply = (r) => { if (!item) return; delete item.remind_at; delete item.reminded; if (r.remind_at) Object.assign(item, r); redrawRow(id); };
    apply(at ? { remind_at: at, reminded: false } : {});
    try {
      await api("/api/todo/reminder", { method: "PUT", body: JSON.stringify({ item: id, at }) });
      toast(at ? "Reminder set" : "Reminder removed", null, at ? remindLabel(at) : item?.title || "");
      if (at) wakeAt(at);
    } catch (err) {
      if (before) apply(before);
      toast("Couldn't set the reminder: " + err.message);
    }
  }

  // Asking David what's due.
  let reminderTimer = null, reminderCheck = null, reminderSince = null;
  const shownReminders = new Set();  // "id|fired_at", so a reminder that arrives by push and by asking shows once
  function wakeAt(iso) {  // check right when the next one is due, if that's sooner than the next half-minute poll
    const wait = new Date(iso).getTime() - Date.now() + 500;
    if (wait < 30000) { clearTimeout(reminderTimer); reminderTimer = setTimeout(checkReminders, Math.max(0, wait)); }
  }
  function checkReminders() {
    reminderCheck ||= api("/api/todo/reminders", { method: "POST", body: JSON.stringify({ since: reminderSince }) })
      .then(({ due, next, now }) => {
      reminderSince = now;
      for (const item of due) showReminder(item);
      if (next) wakeAt(next);
    }).catch(() => {}).finally(() => { reminderCheck = null; });
    return reminderCheck;
  }
  const pageTitle = document.title;
  let unseenReminders = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    unseenReminders = 0;
    document.title = pageTitle;
    checkReminders();
  });
  function chime() {
    try {
      const ac = chime.ac ||= new AudioContext(), t = ac.currentTime;
      [880, 1320].forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain(), s = t + i * 0.13;
        o.frequency.value = f;
        g.gain.setValueAtTime(0, s);
        g.gain.linearRampToValueAtTime(0.07, s + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, s + 0.5);
        o.connect(g).connect(ac.destination);
        o.start(s); o.stop(s + 0.55);
      });
    } catch { /* no sound is fine */ }
  }
  function reminderStack() {
    let stack = $("reminders");
    if (stack) return stack;
    stack = make("div", "t-stack");
    stack.id = "reminders";
    stack.setAttribute("aria-live", "assertive");
    document.body.append(stack);
    // Spread on hover is geometry, not :hover: the gaps between spread cards belong to no element.
    const gap = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--stack-spread-gap")) || 8;
    const within = (e, below) => {
      const r = stack.getBoundingClientRect();
      return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom + below;
    };
    addEventListener("pointermove", (e) => {
      if (!stack.children.length) return;
      if (stack.classList.contains("is-spread")) {
        if (!within(e, (stack.offsetHeight + gap()) * 2)) stack.classList.remove("is-spread");
      } else if (within(e, 0)) stack.classList.add("is-spread");
    });
    return stack;
  }
  // Newest card in front (depth 0), the two before it behind; a fourth slips away.
  function restack() {
    const stack = $("reminders");
    if (!stack) return;
    const cards = [...stack.querySelectorAll(".t-stack-banner:not(.is-leaving)")].reverse();
    cards.forEach((card, i) => {
      if (i > 2) dismissReminder(card);
      else card.dataset.depth = String(i);
    });
    stack.style.height = cards[0] ? `${cards[0].offsetHeight}px` : "0px";
    if (!cards.length) stack.classList.remove("is-spread");
  }
  function dismissReminder(card) {
    if (!card || card.classList.contains("is-leaving")) return;
    card.classList.add("is-leaving");
    const ms = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--stack-close")) || 250;
    setTimeout(() => card.remove(), ms + 60);
    restack();
  }
  function showReminder(item) {
    const seen = `${item.id}|${item.fired_at || item.remind_at}`;
    if (shownReminders.has(seen)) return;
    shownReminders.add(seen);
    const mine = todoState?.list ? todoById(item.id) : null;
    if (mine) { mine.reminded = true; mine.remind_at = item.remind_at; redrawRow(item.id); }
    const stack = reminderStack();
    stack.querySelector(`.reminder[data-id="${item.id}"]`)?.remove();
    const card = make("div", "reminder t-stack-banner is-enter");
    card.dataset.depth = "0";
    card.dataset.id = item.id;
    card.setAttribute("role", "alert");
    const bell = make("span", "bell"); bell.innerHTML = BELL;
    const what = make("div", "what");
    const label = make("div", "label");
    label.append(make("b", null, "Reminder"), remindLabel(item.remind_at));
    const title = make("button", "title", item.title);
    title.type = "button";
    title.title = "Open To Do";
    const close = () => dismissReminder(card);
    title.onclick = () => { close(); showTodo(); };
    const row = make("div", "row");
    const done = make("button", null, "Done"); done.type = "button";
    done.onclick = async () => {
      close();
      if (todoState?.list && todoById(item.id)) return setTodoDone(item.id, true);
      try {
        await api("/api/todo/done", { method: "POST", body: JSON.stringify({ item: item.id, done: true }) });
        toast("Done", null, item.title);
        if (todoState) loadTodo(true);
      } catch (err) { toast("Couldn't save that: " + err.message); }
    };
    const snooze = make("button", null, "Snooze 15 min"); snooze.type = "button";
    snooze.onclick = () => { close(); setReminder(item.id, new Date(Date.now() + 15 * 6e4).toISOString()); };
    const dismiss = iconButton(REMOVE, `Dismiss reminder: ${item.title}`, close);
    row.append(done, snooze);
    what.append(label, title, row);
    card.append(bell, what, dismiss);
    stack.append(card);
    restack();
    void card.offsetWidth;  // flush the pre-open state, then let it rise in
    card.classList.remove("is-enter");
    chime();
    if (document.hidden) {
      unseenReminders++;
      document.title = `(${unseenReminders}) Reminder · ${pageTitle}`;
    }
    // Also as a Windows pop-up, which stays until it's dismissed. It shows even while David's tab is open,
    // since the browser can be behind other windows without the page knowing.
    if (notifyState() === "granted" && !pushOn) {  // with push on, the service worker has already shown it
      try {
        const n = new Notification("Reminder from David", {
          body: item.title + (item.ticket ? ` (#${item.ticket})` : ""), tag: `todo-${item.id}`,
          requireInteraction: true, icon: document.querySelector('link[rel="icon"][href^="/"]')?.href });
        n.onclick = () => { focus(); close(); showTodo(); n.close(); };
      } catch { /* some browsers only allow these from a service worker */ }
    }
  }

  // ----- Saving -----
  // The list's order and groups come from the page. Saves are batched so a burst of moves is one request.
  let saveTimer = null;
  function readOrder() {
    const items = [];
    for (const card of todoBox.querySelectorAll(".todo-group"))
      for (const row of card.querySelectorAll(".todo-rows > .todo-item")) {
        const item = todoById(row.dataset.id);
        if (item) items.push({ ...item, priority: card.dataset.key });
      }
    const shown = new Set(items.map((it) => it.id));
    todoState.list.items = [...items, ...todoState.list.items.filter((it) => isDone(it.id) && !shown.has(it.id))];
  }
  // now: add, edit, remove and put back save at once; moves (a burst of arrow keys or drags) wait 300ms.
  function saveTodo(now = false) {
    readOrder();
    refreshTodo();
    clearTimeout(saveTimer);
    if (now) sendTodo(); else saveTimer = setTimeout(() => sendTodo(), 300);
  }
  let saving = null;  // the save in flight, so Make a new list can wait for it
  // Items taken off since the last save. Only these are removed: an item the server has that this page
  // never saw (added just before a reload, or in another tab) is kept.
  const toRemove = new Set();
  function sendTodo(leaving = false) {
    clearTimeout(saveTimer);
    saveTimer = null;
    const items = todoState.list.items.map(({ id, priority, mine, title, why, ticket }) =>
      ({ id, priority, mine: !!mine, title, why: why || "", ticket: ticket || null }));
    const body = JSON.stringify({ items, remove: [...toRemove] });
    toRemove.clear();
    if (leaving) {  // the page is going away: keepalive lets the save finish after it's gone
      fetch("/api/todo/items", { method: "PUT", body, keepalive: body.length < 60000,
                                 headers: { "Content-Type": "application/json" } }).catch(() => {});
      return Promise.resolve();
    }
    // keepalive: the save still reaches David if the page is reloaded or closed right after.
    saving = api("/api/todo/items", { method: "PUT", body, keepalive: true }).catch(async (err) => {
      toast("Couldn't save that: " + err.message);
      await loadTodo(true);
    });
    return saving;
  }
  // Anything not yet sent goes now: before a new list is made, and when the page is closed, reloaded or hidden.
  function flushTodo() { return saveTimer ? sendTodo() : (saving || Promise.resolve()); }
  addEventListener("pagehide", () => { if (saveTimer) sendTodo(true); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && saveTimer) sendTodo(true); });

  // Ticking an item: the check fills, then the row slides out and the rows below close the gap; it's then
  // listed under Done. Unticking (from Done, or Undo) puts it back in its place in its group.
  const FINISH_PAUSE = 450;
  function showTodoDone(id) {
    const done = isDone(id);
    const row = todoBox.querySelector(`.todo-rows > .todo-item[data-id="${id}"]`);
    if (done && row) {
      row.classList.add("done");
      row.querySelector(".tick").setAttribute("aria-pressed", "true");
      const leave = () => {
        if (!isDone(id) || !row.isConnected) return;  // unticked again in the meantime
        const next = row.nextElementSibling?.querySelector(".tick") || row.closest(".todo-group").querySelector(".todo-add");
        const hadFocus = row.contains(document.activeElement);
        row.classList.remove("arriving");  // a finished entrance animation would hold it in place
        row.glide = (row.glide || 0) + 1;  // and a glide still in progress would override the fade
        row.style.removeProperty("transition");
        row.style.removeProperty("transform");
        row.classList.add("finishing");
        setTimeout(() => {
          if (!isDone(id) || !row.isConnected) { row.classList.remove("finishing"); return; }
          slideRows(() => row.remove());
          refreshTodo();
          drawDone();
          if (hadFocus) next?.focus({ preventScroll: true });
        }, 260);
      };
      // Reduced motion still shows the check first, then fades out in place (see .finishing) instead of sliding.
      setTimeout(leave, FINISH_PAUSE);
    } else if (!done && !row) {
      const item = todoById(id);
      if (item) placeRow(item);
    } else if (row) {
      row.classList.remove("done", "finishing");
      row.querySelector(".tick").setAttribute("aria-pressed", "false");
    }
    refreshTodo();
    drawDone();
  }

  // Back into its group, before the next item that follows it in the list.
  function placeRow(item) {
    const card = todoBox.querySelector(`.todo-group[data-key="${item.priority}"]`);
    if (!card) return null;
    const rows = card.querySelector(".todo-rows");
    const after = todoState.list.items.slice(todoState.list.items.indexOf(item) + 1);
    const before = after.map((it) => rows.querySelector(`.todo-item[data-id="${it.id}"]`)).find(Boolean) || null;
    const row = todoItem(item);
    row.classList.add("arriving");
    slideRows(() => rows.insertBefore(row, before));
    return row;
  }

  async function setTodoDone(id, done) {
    const before = [...todoState.done];
    todoState.done = done ? [...new Set([...before, id])] : before.filter((i) => i !== id);
    showTodoDone(id);
    const item = todoById(id);
    if (done && item) toast("Done", { label: "Undo", run: () => setTodoDone(id, false) }, item.title);
    try {
      await api("/api/todo/done", { method: "POST", body: JSON.stringify({ item: id, done }), keepalive: true });
    } catch (err) {
      todoState.done = before;
      showTodoDone(id);
      toast("Couldn't save that: " + err.message);
    }
  }

  // ----- Done: what you've ticked off, newest list order, untick to put back -----
  let doneOpen = false;
  function drawDone() {
    const box = todoBox.querySelector(".todo-done");
    if (!box) return;
    const done = todoState.list.items.filter((it) => isDone(it.id) && !todoBox.querySelector(`.todo-rows > .todo-item[data-id="${it.id}"]`));
    box.querySelector(".t-acc-panel")?.remove();
    box.hidden = !done.length;
    if (!done.length) { doneOpen = false; box.replaceChildren(); return; }
    let toggle = box.querySelector(".removed-toggle");
    if (!toggle) {
      toggle = make("button", "removed-toggle");
      toggle.type = "button";
      toggle.innerHTML = TOGGLE;
      toggle.prepend(make("span", "label", "Done"), make("span", "n"));
      toggle.onclick = () => { doneOpen = !doneOpen; openSection(box, doneOpen); };
      box.append(toggle);
    }
    toggle.setAttribute("aria-expanded", String(doneOpen));
    toggle.querySelector(".n").textContent = String(done.length);
    const panel = make("div", "removed-list done-list");
    for (const item of done) {
      const row = make("div", "removed-item done-item");
      const tick = make("button", "tick");
      tick.type = "button";
      tick.innerHTML = TICK;
      tick.setAttribute("aria-pressed", "true");
      tick.setAttribute("aria-label", `Not done: ${item.title}`);
      tick.title = "Not done yet";
      tick.onclick = () => {
        const next = row.nextElementSibling?.querySelector(".tick") || box.querySelector(".removed-toggle");
        setTodoDone(item.id, false);
        next?.focus({ preventScroll: true });
      };
      const what = make("div", "what");
      what.append(make("div", "title", item.title));
      const tags = make("div", "tags");
      if (item.ticket) {
        const ref = make(ticketUrl ? "a" : "span", "ref", `#${item.ticket}`);
        if (ticketUrl) { ref.href = ticketUrl.replace("{id}", item.ticket); ref.target = "_blank"; ref.rel = "noopener"; ref.title = "Open in ConnectWise"; }
        tags.append(ref);
      }
      if (item.client) tags.append(make("span", null, item.client));
      if (item.mine) tags.append(make("span", "mine-tag", "Added by you"));
      tags.append(make("span", null, `In ${groupName(item.priority)}`));
      what.append(tags);
      row.append(tick, what);
      panel.append(row);
    }
    box.append(sectionPanel(panel));
    openSection(box, doneOpen);
  }

  // Done and Removed open and close as accordions: the panel stays in the page and its height
  // animates (grid rows 0fr <-> 1fr), so the rows below glide instead of jumping.
  function sectionPanel(panel) {
    const outer = make("div", "t-acc-panel"), inner = make("div", "t-acc-panel-inner");
    inner.append(panel);
    outer.append(inner);
    return outer;
  }
  function openSection(box, open) {
    box.classList.add("t-acc");
    box.dataset.open = String(open);
    box.querySelector(".removed-toggle")?.setAttribute("aria-expanded", String(open));
    box.querySelector(".t-acc-panel-inner").inert = !open;  // nothing in a closed section takes focus
  }

  // ----- Removed: what you took off, for 30 days, with Put back -----
  let removedOpen = false;
  const groupName = (key) => (TODO_GROUPS.find(([k]) => k === key) || [, "Later"])[1];

  function drawRemoved() {
    const box = todoBox.querySelector(".todo-removed");
    if (!box) return;
    const removed = todoState.removed || [];
    box.querySelector(".t-acc-panel")?.remove();
    box.hidden = !removed.length;
    if (!removed.length) { removedOpen = false; box.replaceChildren(); return; }
    // The toggle stays put between redraws, so its icon can turn from + to - instead of swapping.
    let toggle = box.querySelector(".removed-toggle");
    if (!toggle) {
      toggle = make("button", "removed-toggle");
      toggle.type = "button";
      toggle.innerHTML = TOGGLE;
      toggle.prepend(make("span", "label", "Removed"), make("span", "n"));
      toggle.onclick = () => { removedOpen = !removedOpen; openSection(box, removedOpen); };
      box.append(toggle);
    }
    toggle.setAttribute("aria-expanded", String(removedOpen));
    toggle.querySelector(".n").textContent = String(removed.length);
    const panel = make("div", "removed-list");
    const head = make("div", "removed-head");
    head.append(make("p", "removed-note", "Kept for 30 days. These tickets stay off new lists unless they're updated " +
      "in ConnectWise, even if you delete them here."));
    const all = make("button", "put-back delete-all");
    all.type = "button";
    all.innerHTML = TRASH;
    all.append("Delete all");
    all.onclick = () => deleteRemoved(null);
    head.append(all);
    panel.append(head);
    for (const item of removed) {
      const row = make("div", "removed-item");
      const what = make("div", "what");
      what.append(make("div", "title", item.title));
      const tags = make("div", "tags");
      if (item.ticket) {
        const ref = make(ticketUrl ? "a" : "span", "ref", `#${item.ticket}`);
        if (ticketUrl) { ref.href = ticketUrl.replace("{id}", item.ticket); ref.target = "_blank"; ref.rel = "noopener"; ref.title = "Open in ConnectWise"; }
        tags.append(ref);
      }
      if (item.client) tags.append(make("span", null, item.client));
      if (item.mine) tags.append(make("span", "mine-tag", "Added by you"));
      tags.append(make("span", null, `Was in ${groupName(item.priority)} · removed ${eastern(item.removed_at)}`));
      what.append(tags);
      const back = make("button", "put-back");
      back.type = "button";
      back.innerHTML = RESTORE;
      back.append("Put back");
      back.setAttribute("aria-label", `Put back: ${item.title}`);
      back.onclick = () => putBack(item);
      const del = iconButton(TRASH, `Delete for good: ${item.title}`, () => deleteRemoved([item.id]));
      del.title = "Delete";
      row.append(what, back, del);
      panel.append(row);
    }
    box.append(sectionPanel(panel));
    openSection(box, removedOpen);
  }

  // Delete from Removed (ids null: all of them), with Undo. The tickets still stay off new lists.
  async function deleteRemoved(ids) {
    const before = todoState.removed;
    const gone = ids ? before.filter((r) => ids.includes(r.id)) : before;
    if (!gone.length) return;
    const goneIds = gone.map((r) => r.id);
    todoState.removed = before.filter((r) => !goneIds.includes(r.id));
    drawRemoved();
    const next = todoBox.querySelector(".removed-item .icon-btn") || todoBox.querySelector(".removed-toggle") || todoTab;
    next.focus({ preventScroll: true });
    try {
      await api("/api/todo/removed/delete", { method: "POST", body: JSON.stringify({ ids }) });
    } catch (err) {
      todoState.removed = before;
      drawRemoved();
      toast("Couldn't delete that: " + err.message);
      return;
    }
    toast(gone.length === 1 ? "Deleted" : `Deleted ${gone.length} items`, { label: "Undo", run: async () => {
      try {
        const answer = await api("/api/todo/removed/delete", { method: "POST", body: JSON.stringify({ ids: goneIds, undo: true }) });
        todoState.removed = answer.removed;
        removedOpen = true;
        drawRemoved();
      } catch (err) {
        toast("Couldn't undo that: " + err.message);
      }
    } }, gone.length === 1 ? gone[0].title : "");
  }

  function putBack(entry) {
    const { removed_at: _, ...item } = entry;
    todoState.removed = todoState.removed.filter((r) => r.id !== item.id);
    const card = todoBox.querySelector(`.todo-group[data-key="${item.priority}"]`) || todoBox.querySelector(".todo-group");
    item.priority = card.dataset.key;
    todoState.list.items.push(item);
    const row = todoItem(item);
    row.classList.add("arriving");
    card.querySelector(".todo-rows").append(row);
    saveTodo(true);
    drawRemoved();
    const next = todoBox.querySelector(".removed-item .put-back") || todoBox.querySelector(".removed-toggle");
    next?.focus({ preventScroll: true });
    toast(`Put back in ${groupName(item.priority)}`);
  }

  // ----- Remove, with undo -----
  function removeTodo(row) {
    const item = todoById(row.dataset.id);
    if (!item) return;
    const index = todoState.list.items.indexOf(item), wasDone = isDone(item.id);
    const next = row.nextElementSibling || row.previousElementSibling;
    row.glide = (row.glide || 0) + 1;  // a glide still in progress would override the fade
    row.style.removeProperty("transition");
    row.style.removeProperty("transform");
    row.classList.add("leaving");
    setTimeout(() => {
      row.remove();
      todoState.done = todoState.done.filter((i) => i !== item.id);
      toRemove.add(item.id);
      saveTodo(true);
      (next?.querySelector(".grip") || todoBox.querySelector(`.todo-group[data-key="${item.priority}"] .todo-add`))?.focus({ preventScroll: true });
    }, reducedMotion() ? 0 : 150);
    todoState.removed = [{ ...item, removed_at: new Date().toISOString() }, ...(todoState.removed || [])];
    drawRemoved();
    toast("Removed", { label: "Undo", run: () => {
      todoState.removed = todoState.removed.filter((r) => r.id !== item.id);
      toRemove.delete(item.id);  // if the removal hasn't been sent yet, it never will be
      todoState.list.items.splice(Math.min(index, todoState.list.items.length), 0, item);
      drawTodo(null, true);
      saveTodo(true);
      if (wasDone) setTodoDone(item.id, true);
      todoBox.querySelector(`.todo-item[data-id="${item.id}"] .grip`)?.focus({ preventScroll: true });
    } }, item.title);
  }

  // ----- Add and edit your own -----
  function addButton(key) {
    const b = make("button", "todo-add");
    b.type = "button";
    b.innerHTML = PLUS;
    b.append("Add a to-do");
    b.onclick = () => openTodoForm(b.closest(".todo-group"), null);
    return b;
  }

  // One form at a time: for a new item at the end of a group, or in place of one of your items to edit it.
  function openTodoForm(card, row) {
    closeTodoForm();
    const item = row ? todoById(row.dataset.id) : null;
    const form = make("form", "todo-form");
    const title = make("input"); title.name = "title"; title.maxLength = 200; title.required = true;
    title.placeholder = "What do you need to do?"; title.setAttribute("aria-label", "To-do");
    title.value = item?.title || "";
    const ticket = make("input"); ticket.name = "ticket"; ticket.inputMode = "numeric"; ticket.maxLength = 9;
    ticket.placeholder = "Ticket #"; ticket.setAttribute("aria-label", "Ticket number (optional)");
    ticket.value = item?.ticket || "";
    const save = make("button", "cta small", item ? "Save" : "Add"); save.type = "submit";
    const cancel = make("button", "ghost-btn", "Cancel"); cancel.type = "button";
    form.append(title, ticket, save, cancel);
    form.onsubmit = (e) => {
      e.preventDefault();
      const text = title.value.trim();
      if (!text) { title.focus(); return; }
      const number = parseInt(ticket.value.replace(/[^0-9]/g, ""), 10) || null;
      if (item) {
        Object.assign(item, { title: text, ticket: number });
        const fresh = todoItem(item);
        row.replaceWith(fresh);
        closeTodoForm();
        saveTodo(true);
        fresh.querySelector(".grip").focus({ preventScroll: true });
        return;
      }
      const added = { id: "m-" + Math.random().toString(36).slice(2, 12), title: text, why: "", priority: card.dataset.key,
                      ticket: number, client: null, when: null, mine: true };
      todoState.list.items.push(added);
      const fresh = todoItem(added);
      fresh.classList.add("arriving");
      card.querySelector(".todo-rows").append(fresh);
      saveTodo(true);
      announce(`Added "${text}"`);
      title.value = ""; ticket.value = "";
      title.focus();  // ready for the next one
    };
    cancel.onclick = () => closeTodoForm(true);
    form.onkeydown = (e) => { if (e.key === "Escape") { e.stopPropagation(); closeTodoForm(true); } };
    if (row) { row.hidden = true; row.after(form); form.dataset.editing = row.dataset.id; }
    else { card.querySelector(".todo-add").hidden = true; card.querySelector(".todo-rows").after(form); }
    title.focus();
  }
  function closeTodoForm(refocus = false) {
    const form = todoBox.querySelector(".todo-form");
    if (!form) return;
    const card = form.closest(".todo-group");
    const row = form.dataset.editing && todoBox.querySelector(`.todo-item[data-id="${form.dataset.editing}"]`);
    form.remove();
    if (row) { row.hidden = false; if (refocus) row.querySelector(".grip").focus(); }
    const add = card.querySelector(".todo-add");
    add.hidden = false;
    if (refocus && !row) add.focus();
  }
  function editTodo(row) { openTodoForm(row.closest(".todo-group"), row); }

  // ----- Moving: drag the handle, or arrow keys on it -----
  const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Slide rows from where they were to where they are now (FLIP), so nothing jumps.
  // Glides use inline styles, which would override the row's own transitions (the fade when ticked or
  // removed), so they're cleared as soon as each glide ends. Rows already on their way out are left alone.
  function slideRows(change) {
    const rows = [...todoBox.querySelectorAll(".todo-item:not(.dragging):not(.finishing):not(.leaving), .todo-drop, .todo-add, .todo-none")];
    const before = new Map(rows.map((r) => [r, r.getBoundingClientRect().top]));
    change();
    if (reducedMotion()) return;
    for (const r of rows) {
      const dy = before.get(r) - r.getBoundingClientRect().top;
      if (!dy || !r.isConnected) continue;
      r.style.transition = "none";
      r.style.transform = `translateY(${dy}px)`;
      const glide = (r.glide || 0) + 1;
      r.glide = glide;
      requestAnimationFrame(() => {
        r.style.transition = "transform var(--duration-fast) var(--ease-smooth-out)";
        r.style.transform = "";
        setTimeout(() => { if (r.glide === glide) r.style.removeProperty("transition"); }, 320);
      });
    }
  }

  function moveByKey(e, row) {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();
    const up = e.key === "ArrowUp";
    const sibling = up ? row.previousElementSibling : row.nextElementSibling;
    let card = row.closest(".todo-group");
    slideRows(() => {
      if (sibling) { up ? sibling.before(row) : sibling.after(row); return; }
      const cards = [...todoBox.querySelectorAll(".todo-group")];
      const next = cards[cards.indexOf(card) + (up ? -1 : 1)];
      if (!next) return;
      card = next;
      const rows = next.querySelector(".todo-rows");
      up ? rows.append(row) : rows.prepend(row);
    });
    saveTodo();
    row.querySelector(".grip").focus({ preventScroll: true });
    row.scrollIntoView({ block: "nearest" });
    announce(`${todoById(row.dataset.id)?.title}: ${TODO_GROUPS.find(([k]) => k === card.dataset.key)[1]}, ` +
             `${[...card.querySelectorAll(".todo-rows > .todo-item")].indexOf(row) + 1} of ${card.querySelectorAll(".todo-rows > .todo-item").length}`);
  }

  function startDrag(e, row) {
    if (e.button !== 0) return;
    e.preventDefault();
    closeTodoForm();
    const grip = e.currentTarget, scroller = $("todo");
    const box = row.getBoundingClientRect();
    const offset = e.clientY - box.top;
    const drop = make("div", "todo-drop");
    drop.style.height = `${box.height}px`;
    row.after(drop);
    Object.assign(row.style, { width: `${box.width}px`, height: `${box.height}px`, left: `${box.left}px`, top: `${box.top}px` });
    row.classList.add("dragging");
    document.body.classList.add("dragging-todo");
    // Lifted out to the page while dragged: a group card's entrance animation leaves a transform on it,
    // which would make the fixed-position row move relative to the card instead of the window.
    document.body.append(row);
    let y = e.clientY, raf = 0, scrollRaf = 0;

    const place = () => {
      raf = 0;
      row.style.top = `${y - offset}px`;
      // Where would it land? The group under the pointer, before the first row whose middle is below it.
      const card = [...todoBox.querySelectorAll(".todo-group")].find((c) => {
        const r = c.getBoundingClientRect(); return y >= r.top - 8 && y <= r.bottom + 8;
      });
      if (!card) return;
      const rows = card.querySelector(".todo-rows");
      const before = [...rows.children].find((r) => r !== drop && r.getBoundingClientRect().top + r.offsetHeight / 2 > y) || null;
      if (drop.parentNode === rows && drop.nextElementSibling === before) return;
      slideRows(() => { rows.insertBefore(drop, before); refreshEmpty(); });
    };
