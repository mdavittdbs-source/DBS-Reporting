<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="color-scheme" content="light dark">
<title>David</title>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/chart.umd.min.js"></script>

<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/motion.css">
<style>
  :root { --z-popover: 20; --z-drawer: 30; --z-toast: 40; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-size: 15px; line-height: 1.6; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: none; box-shadow: var(--ring); border-radius: 8px; }

  .skip { position: absolute; left: 12px; top: -48px; z-index: var(--z-toast);
          background: var(--cta); color: var(--cta-ink); padding: 8px 14px; border-radius: 999px;
          text-decoration: none; font-weight: 500; transition: top .2s var(--ease); }
  .skip:focus { top: 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { position: relative; z-index: 1; display: grid; grid-template-columns: 292px minmax(0, 1fr);
         height: 100dvh; overflow: hidden; }

  /* ---------- Sidebar: a floating, mostly solid panel ---------- */
  aside { margin: 14px 0 14px 14px; border-radius: 28px; background: var(--panel); border: 1px solid var(--glass-ring);
          box-shadow: var(--core-hi), var(--ambient); display: flex; flex-direction: column; min-height: 0;
          position: relative; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 16px; }
  .brand-mark { width: 28px; height: 28px; border-radius: 9px; background: #183e7c;
                display: grid; place-items: center; flex-shrink: 0; }
  .brand-mark svg { width: 16px; height: 16px; }
  .brand-mark.has-logo { background: none; width: auto; height: auto; border-radius: 0; }
  .brand-mark img { display: block; height: 30px; width: auto; max-width: 132px; object-fit: contain; }
  .brand-name { font-weight: 600; letter-spacing: -.02em; line-height: 1.2; font-size: 16px; min-width: 0; }
  .brand-name small { display: block; font-size: 9.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
                      color: var(--faint); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #new { margin: 0 14px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
         padding: 6px 6px 6px 18px; border-radius: 999px; border: 0; background: var(--cta); color: var(--cta-ink);
         font-weight: 500; transition: transform var(--duration-quick) var(--ease-smooth-out), opacity .2s; }
  #new:hover { opacity: .92; }
  #new:active { transform: scale(.96); }

  #chats { list-style: none; margin: 0; padding: 4px 10px 12px; overflow-y: auto; flex: 1; }
  #chats .group { font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--faint);
                  padding: 16px 12px 6px; }
  #chats .group:first-child { padding-top: 4px; }
  #chats li.chat { position: relative; display: flex; align-items: center; border-radius: 14px; margin: 1px 0;
                   transition: background .2s var(--ease); }
  #chats li.chat:hover { background: var(--hover); }
  #chats li.chat.active { background: var(--pill); box-shadow: inset 0 0 0 1px var(--hair); }
  #chats button.open { flex: 1; min-width: 0; text-align: left; background: none; border: 0;
                       padding: 8px 4px 8px 12px; border-radius: 14px; }
  #chats .title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                  font-size: 13.5px; color: var(--muted); }
  #chats li.active .title { color: var(--text); font-weight: 500; }
  #chats button.menu { position: relative; width: 36px; height: 32px; display: grid; place-items: center;
                       background: none; border: 0; color: var(--muted); padding: 0; margin-right: 3px;
                       border-radius: 999px; opacity: 0; line-height: 1;
                       transition: opacity .15s, background .15s, transform var(--duration-quick) var(--ease-smooth-out); }
  #chats li.chat:hover button.menu, #chats li.chat.active button.menu,
  #chats button.menu:focus-visible, #chats button.menu[aria-expanded="true"] { opacity: 1; }
  #chats button.menu:hover { background: var(--hover); color: var(--text); }
  #chats input.rename { flex: 1; min-width: 0; margin: 3px 6px; padding: 5px 10px; font-size: 13.5px;
                        border: 1px solid var(--glass-ring); border-radius: 10px; background: var(--core); }
  #chats input.rename:focus { outline: none; box-shadow: var(--ring); }
  .popover { position: absolute; right: 6px; top: calc(100% - 2px); z-index: var(--z-popover);
             background: var(--core); border: 1px solid var(--glass-ring); border-radius: 16px;
             box-shadow: var(--ambient); padding: 5px; min-width: 176px; }
  .popover p { margin: 6px 10px 8px; font-size: 13px; color: var(--muted); }
  .popover button { display: block; width: 100%; text-align: left; background: none; border: 0;
                    padding: 8px 12px; border-radius: 11px; font-size: 13.5px; }
  .popover button { transition: transform var(--duration-quick) var(--ease-smooth-out); }
  .popover button:hover { background: var(--hover); }
  .popover button.danger { color: var(--danger); }
  .popover button.danger:hover { background: var(--danger-soft); }
  .popover .row { display: flex; gap: 4px; }
  .popover .row button { text-align: center; }
  .empty-list { color: var(--faint); font-size: 13px; padding: 10px 12px; line-height: 1.5; }

  .appearance { border-top: 1px solid var(--hair); margin: 0 10px; padding: 12px 6px 2px; display: flex; align-items: center;
                justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); }
  /* The highlight slides between the three choices (tabs sliding). */
  .theme-switch { position: relative; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--pill);
                  box-shadow: inset 0 0 0 1px var(--hair); }
  .theme-switch button { position: relative; width: 36px; height: 26px; border: 0; border-radius: 999px; background: none;
                         display: grid; place-items: center; }
  .theme-switch .t-tab { transition: color var(--tabs-dur) var(--tabs-ease), transform var(--duration-quick) var(--ease-smooth-out); }
  .theme-switch .t-tabs-pill { height: 26px; box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
  .theme-switch svg { width: 15px; height: 15px; }
  /* Admins: Feedback from users, an icon at the right of the David name. Hovering shows this week's thumbs down. */
  .icon-link { position: relative; width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center;
               color: var(--muted); flex-shrink: 0; transition: transform var(--duration-quick) var(--ease-smooth-out); }
  .icon-link[hidden] { display: none; }
  .name-line { display: flex; align-items: center; gap: 4px; }
  .brand .icon-link { width: 26px; height: 26px; margin: -4px 0; }
  .brand .icon-link svg { width: 15px; height: 15px; }
  .brand .icon-link::after { inset: -7px; }
  .icon-link:hover { color: var(--text); background: var(--hover); }
  .icon-link:active { transform: scale(.96); }
  .icon-link:focus-visible { outline: none; box-shadow: var(--ring); }
  .icon-link::after { content: ""; position: absolute; inset: -4px; }
  .icon-link svg { width: 16px; height: 16px; }
  .me { margin: 0 10px; padding: 12px 6px 14px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 30px; height: 30px; border-radius: 999px; background: var(--pill); color: var(--text);
            box-shadow: inset 0 0 0 1px var(--hair); display: grid; place-items: center; font-size: 11.5px;
            font-weight: 600; flex-shrink: 0; }
  #me { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #logout { position: relative; background: none; border: 0; color: var(--muted); font-size: 13px; padding: 5px 10px;
            border-radius: 999px; transition: transform var(--duration-quick) var(--ease-smooth-out); }
  #logout:hover { color: var(--text); background: var(--hover); }

  /* ---------- Main ---------- */
  main { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  /* The chat title floats as a small glass pill */
  /* The chat title: plain text at the top of the chat area */
  header { display: flex; align-items: center; gap: 10px; padding: 20px 28px 4px; min-height: 0; }
  /* Empty on a new chat; it keeps its line height so nothing shifts when a title appears. */
  #chat-title { min-width: 0; min-height: 1.45em; font-size: 14px; font-weight: 600; letter-spacing: -.01em;
                color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toggle { display: none; background: none; border: 0; border-radius: 999px; padding: 4px; margin-left: -8px; line-height: 0; }
  #toggle svg { width: 18px; height: 18px; }

  #log { flex: 1; overflow-y: auto; padding: 28px 24px 16px; scroll-behavior: smooth;
         -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 24px), transparent);
                 mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 24px), transparent); }
  .inner { max-width: 840px; margin: 0 auto; }
  #messages { display: flex; flex-direction: column; gap: 34px; }

  /* Start screen: headline and an uneven grid of example questions. Sizes and spacing follow the
     window's height, so it fits without scrolling on short screens (laptops, Windows displays
     scaled to 125-150%) and sits in the middle of tall ones. It only scrolls if it can't fit. */
  #log:has(.start) .inner { min-height: 100%; display: flex; flex-direction: column; }
  #log:has(.start) #messages { flex: 1; justify-content: center; }
  .start { padding: clamp(0px, 2vh, 24px) 0 clamp(8px, 2vh, 24px); }
  .start .eyebrow-row { margin-bottom: clamp(10px, 2.2vh, 18px); }
  .start h2 { font-size: clamp(30px, min(4.4vw, 6.2vh), 56px); font-weight: 600; letter-spacing: -.05em; line-height: 1.02;
              margin: 0 0 clamp(8px, 1.6vh, 16px); text-wrap: balance; color: var(--text); }
  .start h2 .word { display: inline-block;
              background: linear-gradient(180deg, var(--text) 30%, var(--muted)); -webkit-background-clip: text;
              background-clip: text; -webkit-text-fill-color: transparent; }
  .start p { margin: 0 0 clamp(14px, 3vh, 28px); font-size: clamp(14px, 1.9vh, 16px); color: var(--muted);
             max-width: 44ch; text-wrap: pretty; }
  .suggestions { display: grid; grid-template-columns: 1.5fr 1fr; gap: clamp(10px, 1.6vh, 14px); }
  .suggestions button.shell { display: block; text-align: left; color: inherit;
    transition: transform var(--duration-fast) var(--ease-smooth-out);
    animation: rise-in var(--duration-very-slow) var(--ease-smooth-out) both; animation-delay: calc(var(--i) * var(--duration-micro)); }
  .suggestions button.shell:hover { transform: translateY(-2px); }
  .suggestions button.shell:active { transform: scale(.96); }
  .suggestions button.shell:first-child { grid-row: span 2; }
  .suggestions .core { position: relative; overflow: hidden; height: 100%; padding: clamp(14px, 2.3vh, 20px);
                       display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 14px); }
  .suggestions .shell:first-child .core { min-height: clamp(160px, 30vh, 300px); justify-content: space-between; }
  .suggestions .shell:first-child .core::before { content: ""; position: absolute; width: 340px; height: 340px;
    right: -110px; top: -140px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, var(--orb-a), transparent); }
  /* Shorter windows: the three examples side by side in one row, which takes about half the height. */
  @media (min-width: 761px) and (max-height: 780px) {
    .suggestions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .suggestions button.shell:first-child { grid-row: auto; }
    .suggestions .shell:first-child .core { min-height: 0; }
    .suggestions .shell:first-child .q { font-size: 17px; letter-spacing: -.02em; line-height: 1.35; max-width: none; }
    .start p { max-width: 62ch; }
  }
  .suggestions .q { position: relative; font-size: 15px; font-weight: 500; line-height: 1.45; letter-spacing: -.01em; }
  .suggestions .shell:first-child .q { font-size: clamp(20px, 3vh, 26px); font-weight: 600; letter-spacing: -.035em; line-height: 1.12; max-width: 17ch; }
  .cta { position: relative; display: inline-flex; align-items: center; gap: 12px; align-self: flex-start;
         border-radius: 999px; padding: 5px 5px 5px 16px; font-size: 13px; font-weight: 500;
         background: var(--cta); color: var(--cta-ink); }
  .cta .ico { width: 26px; height: 26px; }
  .cta.ghost { background: var(--pill); color: var(--text); }
  .cta.ghost .ico { background: var(--pill); }

  /* To Do tab: a sidebar entry, and a view that takes the chat's place. */
  .nav-tab { margin: 0 10px 6px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 0;
             border-radius: 14px; background: none; color: var(--muted); font-size: 13.5px; text-align: left;
             transition: background .2s var(--ease), transform var(--duration-quick) var(--ease-smooth-out); }
  .nav-tab:hover { background: var(--hover); color: var(--text); }
  .nav-tab:active { transform: scale(.96); }
  .nav-tab[aria-current="page"] { background: var(--pill); color: var(--text); font-weight: 500;
                                  box-shadow: inset 0 0 0 1px var(--hair); }
  .nav-tab svg { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-tab .label { flex: 1; }
  .nav-tab .count { font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; min-width: 20px;
                    padding: 1px 7px; border-radius: 999px; text-align: center; background: var(--tag-bg); color: var(--tag-ink); }
  body.todo-view #log, body.todo-view #form { display: none; }
  #todo .inner { min-height: 100%; display: flex; flex-direction: column; }
  #todo { flex: 1; overflow-y: auto; padding: 28px 24px 40px;
          -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28px);
                  mask-image: linear-gradient(to bottom, transparent 0, #000 28px); }
  .todo-head h2 { font-size: clamp(30px, 4vw, 44px); font-weight: 600; letter-spacing: -.05em; line-height: 1.04;
                  margin: 16px 0 10px; text-wrap: balance;
                  background: linear-gradient(180deg, var(--text) 30%, var(--muted)); -webkit-background-clip: text;
                  background-clip: text; -webkit-text-fill-color: transparent; }
  .todo-head p { margin: 0 0 18px; color: var(--muted); max-width: 60ch; text-wrap: pretty; }
  .todo-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 26px; }
  .todo-bar .meta { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
  .todo-bar .cta { border: 0; transition: transform var(--duration-quick) var(--ease-smooth-out), opacity .2s; }
  .todo-bar .cta:active { transform: scale(.96); }
  .todo-bar .cta:disabled { opacity: .5; }
  .progress { flex-basis: 100%; height: 4px; border-radius: 999px; background: var(--pill); overflow: hidden; }
  .progress i { display: block; height: 100%; border-radius: inherit; background: var(--tag-ink);
                transition: width var(--duration-slow) var(--ease-smooth-out); }
  .todo-group { margin-bottom: 16px; animation: rise var(--duration-slow) var(--ease-smooth-out) both; }
  .todo-group > .core { padding: 18px 8px 8px; }
  .todo-group h3 { margin: 0 14px 6px; display: flex; align-items: center; gap: 10px; }
  .todo-group h3 .n { font-size: 12px; color: var(--faint); font-weight: 500; font-variant-numeric: tabular-nums; }
  .todo-group.now .eyebrow { color: var(--danger); background: var(--danger-soft); }
  .todo-item { display: flex; gap: 14px; align-items: flex-start; padding: 12px 14px; border-radius: 16px;
               transition: background .2s var(--ease); }
  .todo-item + .todo-item { box-shadow: 0 -1px 0 var(--hair); }
  .todo-item:hover { background: var(--hover); }
  .tick { position: relative; flex-shrink: 0; width: 22px; height: 22px; margin-top: 1px; border-radius: 999px; border: 0;
          padding: 0; background: none; box-shadow: inset 0 0 0 1.5px var(--faint); color: var(--cta-ink);
          display: grid; place-items: center; transition: background .2s var(--ease), box-shadow .2s var(--ease),
          transform var(--duration-quick) var(--ease-smooth-out); }
  .tick::after { content: ""; position: absolute; inset: -9px; }
  .tick:hover { box-shadow: inset 0 0 0 1.5px var(--text); }
  .tick:active { transform: scale(.96); }
  .tick svg { width: 13px; height: 13px; opacity: 0; transform: scale(.25); filter: blur(4px);
              transition: opacity .2s cubic-bezier(.2, 0, 0, 1), transform .2s cubic-bezier(.2, 0, 0, 1), filter .2s cubic-bezier(.2, 0, 0, 1); }
  .todo-item.done .tick { background: var(--tag-ink); box-shadow: none; }
  .todo-item.done .tick svg { opacity: 1; transform: none; filter: none; }
  .todo-item .what { min-width: 0; flex: 1; }
  .todo-item .title { font-weight: 500; letter-spacing: -.01em; line-height: 1.4; text-wrap: pretty;
                      transition: color .2s var(--ease); }
  .todo-item .why { color: var(--muted); font-size: 13.5px; margin-top: 2px; text-wrap: pretty; }
  .todo-item .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 7px;
                     font-size: 12.5px; color: var(--faint); }
  .todo-item.done .title { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--faint); }
  .todo-item.done .why, .todo-item.done .tags { opacity: .6; }
  .todo-empty { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 6vh; }
  .todo-note { padding: 16px 20px; border-radius: 18px; background: var(--danger-soft); color: var(--danger);
               margin-bottom: 18px; }
  #todo .usage { display: block; margin: 10px 4px 0; }
  @media (max-width: 760px) {
    #todo { padding: 18px 14px 32px; }
    .todo-group > .core { padding: 14px 4px 4px; }
    .todo-item { padding: 11px 10px; gap: 12px; }
  }

  /* Messages */
  .msg { animation: rise var(--duration-slow) var(--ease-smooth-out); }
  .msg.user { align-self: flex-end; max-width: 82%; background: var(--glass);
              box-shadow: 0 0 0 1px var(--glass-ring), 0 1px 2px rgba(0, 0, 0, .04), 0 8px 20px -12px rgba(0, 0, 0, .18);
              padding: 11px 18px; border-radius: 22px 22px 8px 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { align-self: stretch; min-width: 0; }
  .byline { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .byline .mark { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; overflow: hidden;
                  background: var(--pill); box-shadow: inset 0 0 0 1px var(--hair); flex-shrink: 0; }
  .byline .mark .brand-mark { width: 20px; height: 20px; border-radius: 6px; }
  .byline .mark .brand-mark svg { width: 12px; height: 12px; }
  .byline .mark img { height: 20px; max-width: 20px; }
  .answer { line-height: 1.7; font-size: 15.5px; overflow-wrap: anywhere; }
  .answer table { overflow-wrap: normal; }
  .answer > :first-child { margin-top: 0; }
  .answer > :last-child { margin-bottom: 0; }
  .answer > p:first-child { font-size: 22px; font-weight: 600; letter-spacing: -.03em; line-height: 1.32; }
  .answer > p:first-child strong { font-weight: 600; }
  .answer :is(h1, h2, h3, h4), .answer > p:first-child { text-wrap: balance; }
  .answer :is(p, li) { text-wrap: pretty; }
  .answer h1, .answer h2, .answer h3 { font-size: 17px; font-weight: 600; letter-spacing: -.02em; margin: 1.4em 0 .5em; }
  .answer strong { font-weight: 600; }
  .answer ul, .answer ol { padding-left: 1.3em; }
  .answer li { margin: .3em 0; }
  .answer li::marker { color: var(--faint); }
  .answer code { font-family: var(--mono); font-size: .88em; background: var(--pill); padding: 2px 6px; border-radius: 6px; }
  .answer pre { overflow-x: auto; background: var(--pill); box-shadow: inset 0 0 0 1px var(--hair); border-radius: 14px;
                padding: 12px 16px; line-height: 1.55; overflow-wrap: normal; }
  .answer pre code { background: none; padding: 0; font-size: .86em; }
  .answer a { color: var(--tag-ink); }
  /* Tables sit on one pane that scrolls sideways itself when a table is too wide, so the pane always
     covers the whole table. Text wraps, but no column gets narrower than a few words. */
  .answer .bezel { display: inline-block; max-width: 100%; margin: 10px 0 14px; vertical-align: top; }
  .answer .bezel > .core { padding: 4px; border-radius: 22px; max-width: 100%; overflow-x: auto; }
  .answer table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .answer th { text-align: left; font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
               color: var(--faint); border-bottom: 1px solid var(--hair); padding: 12px 18px; }
  .answer td { border-bottom: 1px solid var(--hair); padding: 11px 18px; vertical-align: top; }
  .answer tr:last-child td { border-bottom: 0; }
  .answer th, .answer td { min-width: 6.5em; }
  .answer :is(th, td):first-child { min-width: 9em; }
  .answer :is(th, td).num { text-align: right; white-space: nowrap; min-width: 0; }
  .answer :is(th, td):not(.num) { text-align: left; }
  .answer :is(th, td).short { white-space: nowrap; min-width: 0; }
  .answer :is(th, td).long { min-width: 16em; }
  .ref { font-family: var(--mono); font-size: .82em; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
         background: var(--tag-bg); color: var(--tag-ink); }
  a.ref { text-decoration: none; transition: box-shadow .2s var(--ease); }
  a.ref:hover { box-shadow: inset 0 0 0 1px currentColor; }
  a.ref:focus-visible { outline: none; box-shadow: var(--ring); }

  .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .actions button { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px;
                    background: var(--pill); box-shadow: inset 0 0 0 1px var(--hair); color: var(--muted);
                    font-size: 13px; padding: 6px 12px; position: relative;
                    transition: color .15s, background .15s, transform var(--duration-quick) var(--ease-smooth-out); }
  .actions button:hover { color: var(--text); background: var(--hover); }
  /* Hit areas: small controls get an invisible target of about 40px (without overlapping their
     neighbours), so they're easy to click; nothing looks different. */
  #chats button.menu::after { content: ""; position: absolute; inset: -3px 0; }
  .theme-switch button::after { content: ""; position: absolute; inset: -8px -1px; }
  #logout::after { content: ""; position: absolute; inset: -5px 0; }
  .chart-tools button::after { content: ""; position: absolute; inset: -6px 0; }
  .actions button::after { content: ""; position: absolute; inset: -4px 0; }
  /* Press feedback: buttons dip to 96% while held. */
  :is(#chats button.menu, .popover button, #logout, .actions button, .chart-tools button, .theme-switch button):active {
    transform: scale(.96); }
  .actions button.copied { color: var(--tag-ink); }
  /* Thumbs: outline by default, filled when chosen. */
  .rate { display: inline-flex; gap: 2px; margin-left: auto; }
  .actions .rate button.thumb { padding: 6px 9px; background: none; box-shadow: none; }
  .actions .rate button.thumb:hover { background: var(--hover); }
  .thumb svg { width: 15px; height: 15px; fill: none; transition: fill var(--duration-quick) var(--ease-smooth-out); }
  .thumb.down svg { transform: scaleY(-1); }
  .thumb[aria-pressed="true"] { color: var(--tag-ink); }
  .thumb[aria-pressed="true"] svg { fill: currentColor; fill-opacity: .18; }
  .note { margin: 16px auto 0; width: 100%; max-width: 520px; padding: 12px; border-radius: 18px; background: var(--core);
          box-shadow: var(--core-hi), var(--ambient); display: flex; flex-direction: column; gap: 8px;
          animation: rise var(--duration-fast) var(--ease-smooth-out); }
  .note label { font-size: 13px; color: var(--muted); }
  .note textarea { font: inherit; font-size: 14px; resize: vertical; min-height: 54px; padding: 9px 12px; border: 0;
                   border-radius: 12px; background: var(--pill); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair); }
  .note textarea:focus { outline: none; box-shadow: inset 0 0 0 1px var(--glass-ring), var(--ring); }
  .note .row { display: flex; justify-content: flex-end; gap: 6px; }
  .note button { font: inherit; font-size: 13px; font-weight: 500; border: 0; border-radius: 999px; padding: 7px 14px;
                 background: var(--pill); color: var(--muted); transition: transform var(--duration-quick) var(--ease-smooth-out); }
  .note button[type="submit"] { background: var(--cta); color: var(--cta-ink); }
  .note button:active { transform: scale(.96); }
  .actions button.copied svg { animation: check-in var(--duration-fast) cubic-bezier(0.2, 0, 0, 1); }
  @keyframes check-in { from { opacity: 0; transform: scale(.25); filter: blur(4px); } }
  .actions svg { width: 14px; height: 14px; }
  .usage { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; padding: 4px 6px 4px 2px; cursor: help; }

  .charts { display: grid; gap: 16px; margin-top: 24px; }
  .chart-card { margin: 0; min-width: 0; }
  .chart-card > .core { padding: 22px 24px 14px; }
  .chart-card h4 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.025em; text-wrap: balance; }
  .chart-card .chart-sub { margin: 6px 0 0; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
  .chart-box { position: relative; margin-top: 12px; }
  .chart-tools { display: flex; gap: 6px; margin-top: 8px; }
  .chart-tools button { position: relative; background: var(--pill); border: 0; color: var(--muted); font-size: 12px;
                        padding: 5px 12px; border-radius: 999px;
                        transition: transform var(--duration-quick) var(--ease-smooth-out); }
  .chart-tools button:hover { color: var(--text); background: var(--hover); }
  .chart-table { width: 100%; margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; border-collapse: collapse; }
  .chart-table th { text-align: left; font-weight: 500; color: var(--faint); border-bottom: 1px solid var(--hair); padding: 6px 12px 6px 0; }
  .chart-table td { border-bottom: 1px solid var(--hair); padding: 6px 12px 6px 0; }
  .chart-table td:not(:first-child), .chart-table th:not(:first-child) { text-align: right; }

  .thinking { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
  .thinking .t-think { min-width: 270px; }  /* a steady width, so the seconds counter doesn't jump at each step */
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--tag-ink); opacity: .3;
            animation: pulse 1.2s infinite var(--ease); }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  .answer.streaming > :is(p, h1, h2, h3, h4):last-child::after,
  .answer.streaming > :is(ul, ol):last-child > li:last-child::after, .answer.streaming:empty::after {
    content: ""; display: inline-block; width: .5em; height: 1.05em; margin-left: 2px; vertical-align: -.15em;
    background: var(--tag-ink); border-radius: 2px; animation: blink 1s steps(2, start) infinite; }
  .elapsed { font-family: var(--mono); font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .msg.error { background: var(--danger-soft); color: var(--danger); padding: 12px 18px; border-radius: 18px; }
  .msg.error button { margin-top: 8px; background: none; border: 1px solid currentColor; color: inherit;
                      border-radius: 999px; padding: 4px 12px; font-size: 13px; }

  /* Question box: a framed island with the model picker and an Ask pill */
  #form { padding: 8px 24px 18px; }
  .composer { border-radius: 26px;
              box-shadow: var(--ambient); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
              transition: box-shadow .2s, border-color .2s; }
  .composer:focus-within { box-shadow: var(--ambient), var(--ring); }
  .composer > .core { display: flex; align-items: flex-end; gap: 10px; padding: 6px 6px 6px 20px; border-radius: 26px; }
  #q { flex: 1; min-width: 0; resize: none; border: 0; background: none; padding: 9px 0; max-height: 200px;
       line-height: 1.5; outline: none; }
  #q:focus-visible { box-shadow: none; }
  #q::placeholder { color: var(--faint); }
  .model-wrap { position: relative; flex-shrink: 0; height: 40px; display: flex; align-items: center; }
  .model-wrap[hidden] { display: none; }
  #model { appearance: none; height: 40px; border: 0; border-radius: 999px; padding: 0 30px 0 14px;
           font-size: 12.5px; font-weight: 500; color: var(--muted); background: var(--pill);
           box-shadow: inset 0 0 0 1px var(--hair); max-width: 240px; text-overflow: ellipsis;
           transition: color .15s, background .15s; }
  #model:hover:not(:disabled), #model:focus-visible { background: var(--hover); color: var(--text); }
  #model:focus-visible { box-shadow: var(--ring); }
  #model:disabled { cursor: default; padding-right: 14px; }
  #model option { background: var(--core); color: var(--text); }
  .model-wrap:has(#model:disabled)::after { display: none; }
  .model-wrap::after { content: ""; position: absolute; right: 14px; top: 50%; width: 5px; height: 5px;
                       border: solid currentColor; color: var(--faint); border-width: 0 1.5px 1.5px 0;
                       transform: translateY(-75%) rotate(45deg); pointer-events: none; }
  #send { flex-shrink: 0; height: 40px; display: inline-flex; align-items: center; gap: 10px; border: 0;
          border-radius: 999px; padding: 0 5px 0 16px; background: var(--cta); color: var(--cta-ink);
          font-weight: 500; font-size: 13.5px; transition: transform .5s var(--spring), opacity .2s; }
  #send:active:not(:disabled) { transform: scale(.96); }
  #send:disabled { opacity: .45; cursor: default; }
  #send .ico { width: 30px; height: 30px; }
  .composer-hint { font-size: 12px; color: var(--faint); margin: 8px 6px 0; display: flex; justify-content: space-between;
                   gap: 16px; white-space: nowrap; }
  .composer-hint span:last-child { overflow: hidden; text-overflow: ellipsis; }
  kbd { font-family: var(--mono); font-size: 11px; border-radius: 6px; padding: 0 5px; background: var(--pill);
        box-shadow: inset 0 0 0 1px var(--hair); }

  /* Notices ("Chat deleted", "Couldn't rename…") rise into the bottom-right corner, away from the
     chat and the question box. Copying confirms on the Copy button itself instead. */
  #toast { position: fixed; right: 24px; bottom: 24px; width: max-content;
           max-width: min(420px, calc(100vw - 48px)); z-index: var(--z-toast);
           display: flex; align-items: center; gap: 7px; background: var(--cta); color: var(--cta-ink);
           padding: 6px 13px 6px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; line-height: 1.4;
           box-shadow: 0 8px 24px -12px rgba(15, 23, 42, .45); pointer-events: none; }
  #toast svg { width: 13px; height: 13px; flex-shrink: 0; }
  .backdrop { display: none; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise-in { from { opacity: 0; transform: translateY(12px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes blink { to { visibility: hidden; } }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }

  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    /* The sidebar becomes a slide-out panel */
    aside { position: fixed; inset: 10px auto 10px 0; margin: 0 0 0 10px; width: min(300px, 84vw); z-index: var(--z-drawer);
            background: var(--core); transform: translateX(calc(-100% - 24px)); transition: transform var(--duration-slow) var(--ease-smooth-out); }
    body.sidebar-open aside { transform: none; }
    body.sidebar-open .backdrop { display: block; position: fixed; inset: 0; z-index: calc(var(--z-drawer) - 1);
                                  background: rgba(4, 6, 12, .5); }
    #toast { left: 0; right: 0; margin: 0 auto; bottom: auto; top: 16px; max-width: calc(100vw - 32px); --toast-distance: -8px; }
    header { padding: 12px 14px 2px; }
    #toggle { display: inline-block; margin-left: 0; }
    #log { padding: 20px 16px 12px; }
    #form { padding: 6px 10px 10px; }
    .composer-hint { display: none; }
    .msg.user { max-width: 90%; }
    .suggestions { grid-template-columns: minmax(0, 1fr); }
    .suggestions button.shell:first-child { grid-row: auto; }
    .suggestions .shell:first-child .core { min-height: 0; gap: 18px; }
    .suggestions .shell:first-child .q { font-size: 21px; }
    #model { max-width: 124px; }
    #send { padding-left: 5px; gap: 0; }
    #send .label { display: none; }
    .answer > p:first-child { font-size: 19px; }
  }
  /* Entrance right after signing in: the background light blooms and settles, the sidebar slides
     in with its chats one after another, the greeting rises word by word (texts reveal, in
     showStart), then the example cards and the question box. The logo doesn't move. */
  @keyframes slide-in { from { opacity: 0; transform: translateX(-16px); filter: blur(6px); }
                        to { opacity: 1; transform: none; filter: none; } }
  @keyframes settle { from { opacity: 0; transform: translateY(12px); filter: blur(3px); }
                      to { opacity: 1; transform: none; filter: none; } }
  @keyframes bloom { from { opacity: .4; transform: scale(1.18); filter: brightness(1.5) saturate(1.4); }
                     to { opacity: 1; transform: none; filter: none; } }
  body.entering .aurora { animation: bloom 1.4s var(--ease-smooth-out) both; }
  body.entering header { animation: settle var(--duration-very-slow) var(--ease-smooth-out) 80ms both; }
  body.entering .suggestions button.shell { animation-delay: calc(260ms + var(--i) * 80ms); }
  body.entering #form { animation: settle var(--duration-very-slow) var(--ease-smooth-out) 420ms both; }
  @media (min-width: 761px) {  /* on phones the sidebar is a hidden drawer, so it stays put */
    body.entering aside { animation: slide-in var(--duration-very-slow) var(--ease-smooth-out) both; }
    body.entering #chats li { animation: settle var(--duration-slow) var(--ease-smooth-out) both;
                              animation-delay: calc(140ms + var(--n, 0) * var(--duration-stagger)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
