<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DBS Reporting Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280;
    --border: #e3e6eb; --accent: #2458d6; --accent-text: #ffffff; --user: #e8eefc;
    --active: #e8eefc; --error: #c53030;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1c2027; --text: #e6e8ec; --muted: #9aa3af;
      --border: #2c323c; --accent: #5b8cff; --accent-text: #0d1117; --user: #243150;
      --active: #243150; --error: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 270px minmax(0, 1fr); height: 100vh; overflow: hidden; }

  /* Sidebar */
  aside { background: var(--panel); border-right: 1px solid var(--border); display: flex;
          flex-direction: column; min-height: 0; }
  .side-top { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .side-top h1 { font-size: 16px; margin: 0; }
  #new { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
         padding: 9px 12px; font: inherit; font-weight: 600; cursor: pointer; }
  #chats { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1; }
  #chats li { display: flex; align-items: center; border-radius: 8px; }
  #chats li.active { background: var(--active); }
  #chats li button.open { flex: 1; min-width: 0; text-align: left; background: none; border: 0;
                          color: var(--text); font: inherit; padding: 8px 10px; cursor: pointer; }
  #chats .title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chats .when { display: block; font-size: 12px; color: var(--muted); }
  #chats li button.menu { background: none; border: 0; color: var(--muted); cursor: pointer;
                          padding: 6px 8px; font-size: 13px; visibility: hidden; }
  #chats li:hover button.menu, #chats li.active button.menu { visibility: visible; }
  .empty { color: var(--muted); padding: 8px 18px; font-size: 14px; }
  .side-bottom { border-top: 1px solid var(--border); padding: 12px 16px; display: flex;
                 justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
  .side-bottom button { background: none; border: 1px solid var(--border); color: var(--text);
                        border-radius: 8px; padding: 5px 10px; font: inherit; cursor: pointer; }

  /* Main */
  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px;
           padding: 12px 20px; border-bottom: 1px solid var(--border); }
  #chat-title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header select { flex-shrink: 0; background: var(--panel); color: var(--text); border: 1px solid var(--border);
                  border-radius: 8px; padding: 6px 10px; font: inherit; max-width: 50vw; }
  #toggle { display: none; white-space: nowrap; flex-shrink: 0; background: none; border: 1px solid var(--border); color: var(--text);
            border-radius: 8px; padding: 5px 10px; font: inherit; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 20px; }
  .inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border);
         background: var(--panel); overflow-x: auto; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .msg.error { border-color: var(--error); }
  .msg table { border-collapse: collapse; margin: 8px 0; }
  .msg th, .msg td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
  .msg p:first-child { margin-top: 0; } .msg p:last-child { margin-bottom: 0; }
  .note { color: var(--muted); font-size: 13px; text-align: center; }
  .hint { color: var(--muted); }
  .hint button { display: block; width: 100%; margin: 6px 0; text-align: left; cursor: pointer;
                 background: var(--panel); color: var(--text); border: 1px solid var(--border);
                 border-radius: 8px; padding: 8px 12px; font: inherit; }
  form { padding: 12px 20px 18px; }
  form .inner { flex-direction: row; gap: 8px; }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 10px;
             border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  #send { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px;
          padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }

  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    aside { position: fixed; inset: 0 20% 0 0; z-index: 10; transform: translateX(-100%);
            transition: transform .2s; box-shadow: 0 0 24px rgba(0,0,0,.25); }
    body.sidebar-open aside { transform: none; }
    #toggle { display: inline-block; }
    #log, form { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="side-top">
      <h1>DBS Reporting</h1>
      <button id="new" type="button">+ New chat</button>
    </div>
    <ul id="chats"></ul>
    <div class="side-bottom">
      <span id="me"></span>
      <button id="logout" type="button">Sign out</button>
    </div>
  </aside>
  <main>
    <header>
      <button id="toggle" type="button" aria-label="Show chats">☰ Chats</button>
      <span id="chat-title">New chat</span>
      <select id="model" title="AI model" hidden></select>
    </header>
    <div id="log"><div class="inner" id="messages"></div></div>
    <form id="form">
      <div class="inner">
        <textarea id="q" rows="2" placeholder="Ask a question… (Enter to send, Shift+Enter for a new line)"></textarea>
        <button id="send">Ask</button>
      </div>
    </form>
  </main>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const messages = $("messages"), chatList = $("chats"), q = $("q"), send = $("send");
  const modelSelect = $("model"), chatTitle = $("chat-title");
  let conversationId = null;
  let modelInfo = { default: null, models: [] };

  const EXAMPLES = [
    "What are the most common issues in the past 30 days at Jimmy's Grille?",
    "How many hours did we spend on Jimmy's Grille last month, and on what?",
    "Which open tickets at Jimmy's Grille are oldest?",
  ];

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { "Content-Type": "application/json", ...(options.headers || {}) },
    });
    if (res.status === 401) { location.href = "/login"; throw new Error("Signed out"); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || res.statusText);
    return data;
  }

  function add(kind, content, markdown) {
    const div = document.createElement("div");
    div.className = kind === "note" ? "note" : "msg " + kind;
    if (markdown) div.innerHTML = DOMPurify.sanitize(marked.parse(content));
    else div.textContent = content;
    messages.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end", inline: "nearest" });
    return div;
  }

  function showExamples() {
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "Ask about any client in ConnectWise. For example:";
    for (const text of EXAMPLES) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = text;
      b.onclick = () => ask(text);
      hint.appendChild(b);
    }
    messages.appendChild(hint);
  }

  function when(iso) {
    const d = new Date(iso);
    const today = new Date();
    return d.toDateString() === today.toDateString()
      ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
      : d.toLocaleDateString([], { month: "short", day: "numeric" });
  }

  async function loadChats() {
    const chats = await api("/api/conversations");
    chatList.innerHTML = "";
    if (!chats.length) {
      chatList.innerHTML = '<li class="empty">No saved chats yet.</li>';
      return;
    }
    for (const c of chats) {
      const li = document.createElement("li");
      if (c.id === conversationId) li.className = "active";
      const open = document.createElement("button");
      open.className = "open";
      open.type = "button";
      open.innerHTML = '<span class="title"></span><span class="when"></span>';
      open.querySelector(".title").textContent = c.title;
      open.querySelector(".when").textContent = when(c.updated_at);
      open.onclick = () => openChat(c.id);
      const menu = document.createElement("button");
      menu.className = "menu";
      menu.type = "button";
      menu.title = "Rename or delete";
      menu.textContent = "⋯";
      menu.onclick = () => chatMenu(c);
      li.append(open, menu);
      chatList.appendChild(li);
    }
  }

  async function chatMenu(c) {
    const action = prompt(`"${c.title}"\n\nType a new name to rename it, or type DELETE to delete this chat.`, c.title);
    if (action === null || action.trim() === "" || action === c.title) return;
    if (action.trim() === "DELETE") {
      await api(`/api/conversations/${c.id}`, { method: "DELETE" });
      if (c.id === conversationId) newChat();
    } else {
      await api(`/api/conversations/${c.id}`, { method: "PATCH", body: JSON.stringify({ title: action }) });
      if (c.id === conversationId) chatTitle.textContent = action.trim();
    }
    loadChats();
  }

  function setModel(model, locked) {
    if (model) modelSelect.value = model;
    modelSelect.disabled = locked;
    modelSelect.title = locked ? "This chat's model. Start a new chat to use a different one." : "AI model";
  }

  function newChat() {
    conversationId = null;
    messages.innerHTML = "";
    chatTitle.textContent = "New chat";
    setModel(modelInfo.default, false);
    showExamples();
    document.body.classList.remove("sidebar-open");
    loadChats();
    q.focus();
  }

  async function openChat(id) {
    document.body.classList.remove("sidebar-open");
    try {
      const chat = await api(`/api/conversations/${id}`);
      conversationId = chat.id;
      chatTitle.textContent = chat.title;
      if (![...modelSelect.options].some((o) => o.value === chat.model)) {
        modelSelect.add(new Option(chat.model + " (no longer enabled)", chat.model));
      }
      setModel(chat.model, true);
      messages.innerHTML = "";
      for (const t of chat.turns) add(t.role === "user" ? "user" : "bot", t.text, t.role !== "user");
      loadChats();
    } catch (err) {
      alert("Couldn't open that chat: " + err.message);
    }
  }

  async function ask(question) {
    messages.querySelector(".hint")?.remove();
    add("user", question, false);
    const pending = add("bot", "Looking that up in ConnectWise…", false);
    send.disabled = true;
    try {
      const data = await api("/api/chat", {
        method: "POST",
        body: JSON.stringify({ question, conversation_id: conversationId, model: modelSelect.value || null }),
      });
      const isNew = !conversationId;
      conversationId = data.conversation_id;
      pending.innerHTML = DOMPurify.sanitize(marked.parse(data.answer));
      if (isNew) {
        chatTitle.textContent = data.title;
        setModel(modelSelect.value, true);
      }
      loadChats();
    } catch (err) {
      pending.classList.add("error");
      pending.textContent = "Something went wrong: " + err.message;
    } finally {
      send.disabled = false;
      q.focus();
    }
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const question = q.value.trim();
    if (!question || send.disabled) return;
    q.value = "";
    ask(question);
  });
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("new").onclick = newChat;
  $("toggle").onclick = () => document.body.classList.toggle("sidebar-open");
  $("logout").onclick = async () => {
    await api("/api/logout", { method: "POST" }).catch(() => {});
    location.href = "/login";
  };

  (async () => {
    const me = await api("/api/me");
    $("me").textContent = me.display_name;
    modelInfo = await api("/api/models");
    for (const m of modelInfo.models) modelSelect.add(new Option(m.label, m.id));
    modelSelect.hidden = modelInfo.models.length < 2;
    newChat();
  })();
</script>
</body>
</html>
