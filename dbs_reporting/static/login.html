<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
         font-size: 15px; line-height: 1.55; }
  main { position: relative; z-index: 1; width: 100%; max-width: 400px; }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 24px 6px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 9px; background: #183e7c; display: grid; place-items: center; }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-mark.has-logo { background: none; width: auto; height: auto; border-radius: 0; }
  .brand-mark img { display: block; height: 36px; width: auto; max-width: 180px; object-fit: contain; }
  .brand span:last-child { font-weight: 600; letter-spacing: -.02em; }
  .card { border-radius: 26px; }
  form.core { border-radius: 26px; padding: 30px 28px 26px; display: flex; flex-direction: column; gap: 16px; }
  form .eyebrow { margin-bottom: 2px; }
  h1 { font-size: 30px; line-height: 1.1; letter-spacing: -.045em; font-weight: 600; margin: 0; }
  .lead { margin: -6px 0 4px; color: var(--muted); font-size: 14px; }
  label { display: flex; flex-direction: column; gap: 7px; font-size: 13px; font-weight: 500; color: var(--muted); }
  input { font: inherit; font-size: 15px; padding: 11px 16px; border-radius: 14px; border: 0; color: var(--text);
          background: var(--pill); box-shadow: inset 0 0 0 1px var(--hair); transition: box-shadow .2s var(--ease); }
  input:hover { box-shadow: inset 0 0 0 1px var(--glass-ring); }
  input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--glass-ring), var(--ring); }
  input[aria-invalid="true"] { box-shadow: inset 0 0 0 1px var(--danger); }
  button { font: inherit; font-weight: 500; margin-top: 6px; padding: 6px 6px 6px 20px; border: 0; border-radius: 999px;
           background: var(--cta); color: var(--cta-ink); cursor: pointer; display: flex; align-items: center;
           justify-content: space-between; gap: 8px; transition: transform var(--duration-quick) var(--ease-smooth-out), opacity .2s; }
  button:hover:not(:disabled) { opacity: .92; }
  button:active:not(:disabled) { transform: scale(.96); }
  button:focus-visible { outline: none; box-shadow: var(--ring); }
  button:disabled { opacity: .8; cursor: default; }
  button .ico { width: 34px; height: 34px; display: grid; place-items: center; }
  button .ico > * { grid-area: 1 / 1; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
             animation: spin .7s linear infinite; display: none; }
  button:disabled .spinner { display: block; }
  button:disabled .arrow { display: none; }
  button.done .spinner { display: none; }
  .t-success-check svg { width: 16px; height: 16px; }
  /* The button label swaps in place (text swap: up and out through a blur, new text rises in). */
  #submit-label { display: inline-block; transition: opacity var(--duration-quick) var(--ease-in-out),
                  transform var(--duration-quick) var(--ease-in-out), filter var(--duration-quick) var(--ease-in-out); }
  #submit-label.out { opacity: 0; transform: translateY(-4px); filter: blur(2px); }
  #submit-label.in { transition: none; opacity: 0; transform: translateY(4px); filter: blur(2px); }
  #error { font-size: 14px; color: var(--danger); background: var(--danger-soft); border-radius: 14px; padding: 10px 14px; }
  #error:empty { display: none; }
  .foot { margin: 18px 0 0; font-size: 13px; color: var(--faint); text-align: center; text-wrap: balance; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* David pops up from behind the card's top edge (the card hides his lower half), waves, and
     ducks back. Colours are the logo's. Clicks pass straight through him. */
  .card { position: relative; z-index: 1; }
  /* The head is the logo's own artwork (no "DAVID" lettering); the arm is drawn in the logo's navy
     and line weight. The slot's bottom edge is the card's top edge, so he rises from behind it. */
  .buddy-slot { position: absolute; left: calc(100% - 2px); top: calc(var(--card-top, 60px) + 12px); width: 196px; height: 152px;
                pointer-events: none; overflow: hidden; z-index: 0; }
  @media (max-width: 680px) { .buddy-slot { display: none; } }  /* no room beside the card */
  .buddy { display: block; width: 158px; height: 110px; margin-top: 10px; overflow: visible; transform-origin: 0 80%;
           transform: translateX(-105%) rotate(0deg); }
  /* Light: the logo's navy and white. Dark: a soft white outline and a dark face, so he still reads
     against the dark page. The light blue stays in both. */
  .buddy { --b-ink: #01295B; --b-face: #FFFFFF; --b-glow: #00B9FC; }
  :root[data-theme="dark"] .buddy { --b-ink: #E6EDF7; --b-face: #0D0F14; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .buddy { --b-ink: #E6EDF7; --b-face: #0D0F14; } }
  .buddy .b-ink { fill: var(--b-ink); }
  .buddy .b-face { fill: var(--b-face); }
  .buddy .b-arm-line { fill: none; stroke: var(--b-ink); }
  /* The hand: an outline layer under a fill layer, so the fingers read as one shape. */
  .buddy .b-hand-line { fill: var(--b-ink); stroke: var(--b-ink); }
  .buddy .b-hand-fill { fill: var(--b-face); }
  .buddy [fill="#00B9FC"] { fill: var(--b-glow); }
  /* The hand waves from the wrist (the bottom of the palm). */
  .buddy .b-arm { transform-box: fill-box; transform-origin: 55% 100%; transform: rotate(0deg) scale(0); }
  .buddy .b-eyes, .buddy .b-light { transform-box: fill-box; transform-origin: center; }
  main.waving .buddy { animation: buddy-peek 3.4s var(--ease-smooth-out) both; }
  main.waving .buddy .b-arm { animation: buddy-wave 3.4s var(--ease-in-out) both; }
  main.waving .buddy .b-light { animation: buddy-blink 3.4s steps(1) both; }
  main.waving .buddy .b-eyes { animation: buddy-squint 3.4s var(--ease-in-out) both; }
  @keyframes buddy-peek {
    0%   { transform: translateX(-105%) rotate(0deg); }
    14%  { transform: translateX(3%) rotate(9deg); animation-timing-function: var(--ease-smooth-out); }
    20%  { transform: translateX(0) rotate(7deg); }
    84%  { transform: translateX(0) rotate(7deg); animation-timing-function: cubic-bezier(0.55, 0, 0.75, 0); }
    100% { transform: translateX(-105%) rotate(0deg); }
  }
  @keyframes buddy-wave {
    0%, 15% { transform: rotate(-10deg) scale(0); animation-timing-function: var(--ease-bounce); }
    22% { transform: rotate(-4deg) scale(1); }
    30% { transform: rotate(18deg) scale(1); }
    38% { transform: rotate(-12deg) scale(1); }
    46% { transform: rotate(18deg) scale(1); }
    54% { transform: rotate(-12deg) scale(1); }
    62% { transform: rotate(10deg) scale(1); }
    70% { transform: rotate(0deg) scale(1); }
    77%, 100% { transform: rotate(0deg) scale(0); }
  }
  @keyframes buddy-blink { 0%, 22%, 30%, 38%, 100% { opacity: 1; } 26%, 34% { opacity: .25; } }
  @keyframes buddy-squint { 0%, 30%, 40%, 100% { transform: scaleY(1); } 35% { transform: scaleY(.55); } }
  @media (prefers-reduced-motion: reduce) { .buddy-slot { display: none; } }
  @keyframes rise-in { from { opacity: 0; transform: translateY(12px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  .card { animation: rise-in var(--duration-very-slow) var(--ease-smooth-out) both; }
  /* After signing in: a check, "Welcome, <name>", then the card lifts away through a blur while
     the background light blooms; the chat page picks the bloom up and settles it. */
  main.leaving .card { animation: leave var(--duration-medium) var(--ease-smooth-out) forwards; }
  main.leaving .foot, main.leaving .brand { animation: fade-out var(--duration-fast) var(--ease-smooth-out) forwards; }
  body.leaving .aurora { animation: bloom-out .6s var(--ease-smooth-out) forwards; }
  @keyframes leave { from { opacity: 1; transform: none; filter: none; }
                     to { opacity: 0; transform: translateY(-12px) scale(.96); filter: blur(8px); } }
  @keyframes fade-out { to { opacity: 0; } }
  @keyframes bloom-out { to { opacity: .4; transform: scale(1.18); filter: brightness(1.5) saturate(1.4); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

  <div class="card shell">
  <form id="form" class="core t-input" novalidate>
    <span class="eyebrow">David · ConnectWise</span>
    <h1>Sign in</h1>
    <p class="lead">Ask questions about tickets in ConnectWise.</p>
    <label>Username <input id="username" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <div id="error" role="alert"></div>
    <button id="submit"><span id="submit-label">Sign in</span><span class="ico" aria-hidden="true"><span class="spinner"></span><span class="t-success-check" data-state="out"><svg viewBox="0 0 16 16" fill="none"><path d="M4 8.5l2.6 2.5L12 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><svg class="arrow" viewBox="0 0 16 16" fill="none"><path d="M3.5 8h9M8.5 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
  </form>
  </div>
  <p class="foot">Need an account or a password reset? Ask Mikey Davitt.</p>
</main>
<script>

  const form = document.getElementById("form");
  const error = document.getElementById("error");
  const submit = document.getElementById("submit");
  const label = document.getElementById("submit-label");
  const fields = [document.getElementById("username"), document.getElementById("password")];

  fields.forEach((f) => f.addEventListener("input", () => f.removeAttribute("aria-invalid")));
  // After 5 seconds, David says hello: once per visit (even mid sign-in), not with reduced motion.
  const main = document.querySelector("main");
  const placeBuddy = () => main.style.setProperty("--card-top", document.querySelector(".card").offsetTop + "px");
  placeBuddy();
  addEventListener("resize", placeBuddy);
  setTimeout(() => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    placeBuddy();
    main.classList.add("waving");
  }, 5000);

  const css = (name, fallback) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || fallback;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Wrong or missing details: the card shakes (error state shake).
  function shake() {
    form.classList.remove("is-shaking");
    void form.offsetWidth;  // replay from rest
    form.classList.add("is-shaking");
    setTimeout(() => form.classList.remove("is-shaking"), css("--shake-dur-a", 80) * 2 + css("--shake-dur-b", 60) * 2 + 20);
  }
  function swapLabel(text) {
    label.classList.add("out");
    setTimeout(() => {
      label.textContent = text;
      label.classList.remove("out");
      label.classList.add("in");
      void label.offsetWidth;
      label.classList.remove("in");
    }, css("--duration-quick", 150));
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.textContent = "";
    const empty = fields.filter((f) => !f.value.trim());
    if (empty.length) {
      empty.forEach((f) => f.setAttribute("aria-invalid", "true"));
      error.textContent = "Enter your username and password.";
      empty[0].focus();
      shake();
      return;
    }
    submit.disabled = true;
    label.textContent = "Signing in…";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: fields[0].value, password: fields[1].value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || "Sign in failed. Try again.");
      // Hand off to the chat page, which plays its entrance (see index.html): a check and a
      // welcome first, then the card's exit plays while the chat page loads.
      try { sessionStorage.setItem("justSignedIn", "1"); } catch {}
      if (reduced) { location.href = "/"; return; }
      submit.classList.add("done");
      submit.querySelector(".t-success-check").dataset.state = "in";
      const first = (data.display_name || "").trim().split(/\s+/)[0];
      swapLabel(first ? `Welcome, ${first}` : "Welcome");
      setTimeout(() => {
        document.querySelector("main").classList.add("leaving");
        document.body.classList.add("leaving");
      }, 520);
      setTimeout(() => { location.href = "/"; }, 720);
    } catch (err) {
      error.textContent = err.message;
      shake();
      fields[1].value = "";
      fields[1].focus();
      submit.disabled = false;
      label.textContent = "Sign in";
    }
  });
</script>
