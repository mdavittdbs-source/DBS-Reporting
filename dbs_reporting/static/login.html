<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sign in to the DBS Autonomous Virtual Information Desk.">
<meta name="color-scheme" content="light dark">
<title>Sign in · David</title>
<!--icon--><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23183e7c'/%3E%3Cpath d='M9 21V11m7 10v-6m7 6v-9' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"><!--/icon-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Fetch the chat page's libraries while people type, so the switch to the chat is quick. -->
<link rel="prefetch" href="/static/vendor/chart.umd.min.js">
<link rel="prefetch" href="/static/vendor/marked.min.js">
<link rel="prefetch" href="/static/vendor/purify.min.js">
<link rel="prefetch" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" crossorigin>
<link rel="stylesheet" href="/static/theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
         font-size: 15px; line-height: 1.55; }
  main { position: relative; z-index: 1; width: 100%; max-width: 400px; }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 24px 6px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 9px; background: #183e7c; display: grid; place-items: center; }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-mark.has-logo { background: none; width: auto; height: auto; border-radius: 0; }
  .brand-mark img { display: block; height: 36px; width: auto; max-width: 180px; object-fit: contain; }
  .brand span:last-child { font-weight: 600; letter-spacing: -.02em; }
  .card { border-radius: 32px; box-shadow: var(--ambient); }
  form.core { border-radius: 26px; padding: 30px 28px 26px; display: flex; flex-direction: column; gap: 16px; }
  form .eyebrow { margin-bottom: 2px; }
  h1 { font-size: 30px; line-height: 1.1; letter-spacing: -.045em; font-weight: 600; margin: 0; }
  .lead { margin: -6px 0 4px; color: var(--muted); font-size: 14px; }
  label { display: flex; flex-direction: column; gap: 7px; font-size: 13px; font-weight: 500; color: var(--muted); }
  input { font: inherit; font-size: 15px; padding: 11px 16px; border-radius: 14px; border: 0; color: var(--text);
          background: var(--pill); box-shadow: inset 0 0 0 1px var(--hair); transition: box-shadow .2s var(--ease); }
  input:hover { box-shadow: inset 0 0 0 1px var(--glass-ring); }
  input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--glass-ring), var(--ring); }
  input[aria-invalid="true"] { box-shadow: inset 0 0 0 1px var(--danger); }
  button { font: inherit; font-weight: 500; margin-top: 6px; padding: 6px 6px 6px 20px; border: 0; border-radius: 999px;
           background: var(--cta); color: var(--cta-ink); cursor: pointer; display: flex; align-items: center;
           justify-content: space-between; gap: 8px; transition: transform .5s var(--spring), opacity .2s; }
  button:hover:not(:disabled) { opacity: .92; }
  button:active:not(:disabled) { transform: scale(.98); }
  button:focus-visible { outline: none; box-shadow: var(--ring); }
  button:disabled { opacity: .8; cursor: default; }
  button .ico { width: 34px; height: 34px; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
             animation: spin .7s linear infinite; display: none; }
  button:disabled .spinner { display: block; }
  button:disabled .arrow { display: none; }
  #error { font-size: 14px; color: var(--danger); background: var(--danger-soft); border-radius: 14px; padding: 10px 14px; }
  #error:empty { display: none; }
  .foot { margin: 18px 0 0; font-size: 13px; color: var(--faint); text-align: center; text-wrap: balance; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise-in { from { opacity: 0; transform: translateY(24px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  .card { animation: rise-in .8s var(--spring) both; }
  /* After signing in, the card lifts away while the chat loads. */
  main.leaving .card { animation: leave .26s var(--ease) forwards; }
  main.leaving .foot { animation: fade-out .18s var(--ease) forwards; }
  @keyframes leave { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-10px) scale(.97); } }
  @keyframes fade-out { to { opacity: 0; } }
  /* Browsers that support it (Chrome, Edge) also cross-fade between the pages. */
  @view-transition { navigation: auto; }
  @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>
<main>
  <div class="brand">
    <!--brand-mark--><span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="none"><path d="M3.5 12V5m4.5 7V8m4.5 4V3.5" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
    </span><!--/brand-mark-->
    <span>DBS Autonomous Virtual Information Desk</span>
  </div>
  <div class="card shell">
  <form id="form" class="core" novalidate>
    <span class="eyebrow">David · ConnectWise</span>
    <h1>Sign in</h1>
    <p class="lead">Ask questions about tickets in ConnectWise.</p>
    <label>Username <input id="username" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <div id="error" role="alert"></div>
    <button id="submit"><span id="submit-label">Sign in</span><span class="ico" aria-hidden="true"><span class="spinner"></span><svg class="arrow" viewBox="0 0 16 16" fill="none"><path d="M3.5 8h9M8.5 4l4 4-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
  </form>
  </div>
  <p class="foot">Need an account or a password reset? Ask Mikey Davitt.</p>
</main>
<script>

  const form = document.getElementById("form");
  const error = document.getElementById("error");
  const submit = document.getElementById("submit");
  const label = document.getElementById("submit-label");
  const fields = [document.getElementById("username"), document.getElementById("password")];

  fields.forEach((f) => f.addEventListener("input", () => f.removeAttribute("aria-invalid")));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.textContent = "";
    const empty = fields.filter((f) => !f.value.trim());
    if (empty.length) {
      empty.forEach((f) => f.setAttribute("aria-invalid", "true"));
      error.textContent = "Enter your username and password.";
      empty[0].focus();
      return;
    }
    submit.disabled = true;
    label.textContent = "Signing in…";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: fields[0].value, password: fields[1].value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || "Sign in failed. Try again.");
      // Hand off to the chat page, which plays its entrance (see index.html). The card's exit
      // plays while the chat page loads, so there's no pause in between.
      try { sessionStorage.setItem("justSignedIn", "1"); } catch {}
      document.querySelector("main").classList.add("leaving");
      location.href = "/";
    } catch (err) {
      error.textContent = err.message;
      fields[1].value = "";
      fields[1].focus();
      submit.disabled = false;
      label.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
